/**
 * Buckets a count into one of MAP_RAMP_COLORS_'s 5 steps, or -1 ("no data") for a
 * non-positive count. Log-scaled against the current render's own max so one dominant
 * region (e.g. India) doesn't flatten every other region to the palest step.
 * @param {number} count
 * @param {number} maxCount
 * @return {number} -1..4
 */
function rampBucket_(count, maxCount) {
  if (!count || count <= 0) return -1;
  if (!maxCount || maxCount <= 1) return 0;
  var t = Math.log(count + 1) / Math.log(maxCount + 1);
  var idx = Math.floor(t * MAP_RAMP_COLORS_.length);
  return idx >= MAP_RAMP_COLORS_.length ? MAP_RAMP_COLORS_.length - 1 : idx;
}

 * here 2026-08-25 when it was still private to each MapView instance and
 * App.html had no way to reach it. Despite the name, the NUMBER it buckets
 * depends on the caller: CDM's default colorFn feeds it low-battery count;
 * Overview/Top Customers explicitly feed it the oldest open ticket's AGE in
 * days (since 2026-08-25, was ticket count before) — see the file header. A
 * -1 sentinel ("nothing to bucket") falls through both `>= 4` and `> 0` to
 * green, same as a real 0 always did.
 */
function ticketColor(n) {
  if (n >= 4) return '#F87171';
  if (n > 0) return '#FBBF24';
  return '#34D399';
}

function MapView(containerId) {

    // tier only) which of India's states do. Both interactive:true so
    // hovering shows a name+count tooltip; markers/clusters sit in Leaflet's
    // higher marker pane, so this never blocks clicking a marker underneath.
    // Neither is unconditionally added to the map — updateTier_ (above) owns
    // visibility, and stateLayer is always added AFTER countryLayer so it
    // draws on top of India's (transparent, at that tier) country polygon.
    countryLayer = L.geoJSON(COUNTRY_GEOJSON_, {
      style: countryStyle_, interactive: true,
      onEachFeature: function (feature, layer) { layer.bindTooltip('', { direction: 'top', sticky: true }); }
    });
    stateLayer = L.geoJSON(INDIA_STATE_GEOJSON_, {
      style: stateStyle_, interactive: true,
      onEachFeature: function (feature, layer) { layer.bindTooltip('', { direction: 'top', sticky: true }); }
    });
    cluster = L.markerClusterGroup({
      chunkedLoading: true, maxClusterRadius: 46,
      showCoverageOnHover: false, spiderfyOnMaxZoom: true,
      iconCreateFunction: function (clusterObj) {
        var count = clusterObj.getChildCount();
        // City tier only ever has to represent a handful of nearby pins per cluster
        // (state/country tiers absorb the low-zoom load now), so a modest fixed max
        // for the bucket's "brightest" step reads better than the true global max.
        var bucket = rampBucket_(count, Math.max(count, 60));
        var color = MAP_RAMP_COLORS_[bucket === -1 ? 0 : bucket];
        var size = Math.min(48, 28 + Math.sqrt(count) * 2);
        return L.divIcon({
          html: '<span class="center-cluster-inner" style="width:' + size + 'px;height:' + size + 'px;background:' + color + ';">' + count + '</span>',
          className: 'center-cluster',
          iconSize: [size, size]
        });
      }
    });
    map.on('zoomend', updateTier_);
    updateTier_(); // sets the correct initial tier for the map's starting zoom (5 -> state)
    if (pendingRender) { var run = pendingRender; pendingRender = null; run(); }
    return true;
  }

  function defaultTooltip(c) {
    // No trailing "N assets" clause: c[7] is now the same Jira count as c[4]
    // (see the file-header note), so it would just repeat the device count.
    // index 12 (approx, main map only — undefined/0 elsewhere) flags a center
    // plotted at a city/hub proxy coordinate because it isn't geocoded yet.
    // index 13 (max_open_age_days, -1 sentinel) — added 2026-08-25 alongside
    // the color switch to age; shown so the color has a visible reason
    // ("6 open tickets" alone no longer explains why a marker is red vs green).
    var age = c[13];
    return esc(c[1]) + ' · ' + esc(c[4]) + ' device' + (c[4] === 1 ? '' : 's') +
      ' · ' + esc(c[6]) + ' open ticket' + (c[6] === 1 ? '' : 's') +
      (age != null && age >= 0 ? ' (oldest ' + Math.floor(age) + 'd)' : '') +
      (c[12] ? ' · approx. location' : '');
  }

  // opts lets a page override marker color/tooltip while reusing the same
  // clustering/rendering plumbing — e.g. CDM colors by low-battery count and
  // labels tooltips accordingly, instead of the default open-ticket severity.
  function setData(rows, onClick, opts) {
    centers = rows || [];
    if (!map) { pendingRender = function () { setData(centers, onClick, opts); }; return; }
    var colorFn = (opts && opts.colorFn) || function (c) { return ticketColor(c[6]); };
    var tooltipFn = (opts && opts.tooltipFn) || defaultTooltip;
    cluster.clearLayers();
    markerById = {};
    var markers = centers.map(function (c) {
      var radius = Math.min(18, 5 + Math.sqrt(c[4] || 1) * 1.9);
      var color = colorFn(c);
      // approx (proxy-coordinate) centers render lighter/dashed — a
      // neighborhood-level guess, not the center's real geocoded spot.
      var base = {
        radius: radius, color: color, weight: c[12] ? 1 : 1.5,
        fillColor: color, fillOpacity: c[12] ? 0.2 : 0.4,
        dashArray: c[12] ? '2,3' : null
      };
      var marker = L.circleMarker([c[2], c[3]], base);
      // Kept so FSE focus mode can ring/dim this marker and then put it back
      // exactly as it was, rather than re-deriving a style and drifting from
      // the rules above.
      marker._baseStyle = base;
      marker._latlng2 = [c[2], c[3]];
      markerById[String(c[0])] = marker;
      marker.bindTooltip(tooltipFn(c), { direction: 'top' });
      marker.on('click', function () { onClick(c); });
      return marker;
    });
    cluster.addLayers(markers);
    refreshCountryFill_(centers, opts && opts.countryIdx);
    refreshStateFill_(centers, opts && opts.stateIdx);
    if (fseFocused) applyFseFocus_(fseFocused);   // survive a data refresh
    // Fit to the in-region centers only (see SERVICE_REGION_BOUNDS_ above);
    // fall back to every center in the rare case none qualify, so the map
    // still lands somewhere sane instead of skipping fitBounds entirely.
    var forFit = centers.filter(inServiceRegion_);
    if (!forFit.length) forFit = centers;
    if (forFit.length) {
      try { map.fitBounds(L.latLngBounds(forFit.map(function (c) { return [c[2], c[3]]; })).pad(0.1)); } catch (e) {}
    }
    updateTier_(); // fitBounds may have changed the zoom level — resync the visible tier
  }

  /* ── FSE coverage layer ──────────────────────────────────────────
     Engineers get the one visual channel this map has left. Position, size
     (devices), fill (ticket severity) and opacity/dash (approximate location)
     are all spoken for by centers, so an engineer is distinguished by SHAPE —
     a figure glyph, not another circle. That also means the layer does not
     depend on colour vision to be readable. */

  /**
   * Humanoid pin. A 24px glyph centred in a 44×44 transparent box so the tap
   * target meets the 44px minimum without drawing a 44px blob, plus the name
   * as a permanent pill (engineers are few, and an unnamed figure is useless).
   * `extra` > 0 collapses same-HQ colleagues into one pin with a count.
   */
  function fseIcon_(name, extra, isFocused) {
    var label = esc(name) + (extra ? ' +' + extra : '');
    return L.divIcon({
      className: 'fse-pin' + (isFocused ? ' is-focused' : ''),
      iconSize: [44, 44], iconAnchor: [22, 22],
      html:
        '<span class="fse-glyph" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" width="24" height="24">' +
            '<circle cx="12" cy="7" r="3.4"/>' +
            '<path d="M5.5 21v-4.2A6.5 6.5 0 0 1 12 10.3a6.5 6.5 0 0 1 6.5 6.5V21"/>' +
          '</svg>' +
        '</span>' +
        '<span class="fse-name">' + label + '</span>'
    });
  }

  /**
   * Draws the engineer pins. `engineers` is the payload's fse.engineers array
   * ({name, hq, lat, lng, centers[], tickets}). Called with a falsy/empty list
   * this clears the layer — which is the production state until FSE_ROSTER is
   * filled, so the whole feature is inert rather than half-drawn.
   */
  function setFse(engineers, onSelect) {
    fseSelectHandler = onSelect || null;
    if (!map) { pendingRender = function () { setFse(engineers, onSelect); }; return; }
    if (!fseGroup) { fseGroup = L.layerGroup().addTo(map); }
    fseGroup.clearLayers();
    fseMarkers = {};
    clearFseFocus();
    var list = engineers || [];
    if (!list.length) return;

    // Same-HQ colleagues would otherwise stack their name pills into an
    // illegible pile — Leaflet has no label decluttering. One pin per
    // coordinate, labelled with the first name and a "+n", expanding via the
    // tooltip; the click handler still reports the whole group.
    var byCoord = {};
    list.forEach(function (e) {
      var k = Number(e.lat).toFixed(3) + ',' + Number(e.lng).toFixed(3);
      (byCoord[k] = byCoord[k] || []).push(e);
    });

    Object.keys(byCoord).forEach(function (k) {
      var group = byCoord[k];
      var lead = group[0];
      var marker = L.marker([lead.lat, lead.lng], {
        icon: fseIcon_(lead.name, group.length - 1, false),
        keyboard: true, riseOnHover: true, zIndexOffset: 1000
      });
      marker.bindTooltip(group.map(function (e) {
        var terr = e.territory && e.territory.length ?
          '<br>Territory: ' + esc(e.territory.join(', ')) : '';
        return '<strong>' + esc(e.name) + '</strong><br>' + esc(e.hq) + terr +
          '<br>' + e.centers.length + ' center' + (e.centers.length === 1 ? '' : 's') +
          ' · ' + e.tickets + ' ticket' + (e.tickets === 1 ? '' : 's');
      }).join('<hr class="fse-tip-rule">'), { direction: 'top', className: 'fse-tip' });
      marker.on('click', function () {
        // Toggle: clicking the focused engineer clears focus, so the pin is
        // itself one of the three escape routes.
        if (fseFocused === lead.name) { clearFseFocus(); if (fseSelectHandler) fseSelectHandler(null); return; }
        focusFse(lead.name);
        if (fseSelectHandler) fseSelectHandler(group);
      });
      group.forEach(function (e) { fseMarkers[e.name] = { marker: marker, data: e, group: group }; });
      fseGroup.addLayer(marker);
    });
  }

  /** Restores every center marker and removes the reach fan. */
  function clearFseFocus() {
    fseFocused = null;
    if (map) L.DomUtil.removeClass(map.getContainer(), 'fse-focus-active');
    if (reachGroup) { reachGroup.clearLayers(); }
    Object.keys(markerById).forEach(function (id) {
      var m = markerById[id];
      if (m && m._baseStyle) m.setStyle(m._baseStyle);
    });
    Object.keys(fseMarkers).forEach(function (n) {
      var rec = fseMarkers[n];
      rec.marker.setIcon(fseIcon_(rec.group[0].name, rec.group.length - 1, false));
    });
  }

  function applyFseFocus_(name) {
    var rec = fseMarkers[name];
    if (!rec || !map) return;
    if (!reachGroup) { reachGroup = L.layerGroup().addTo(map); }
    reachGroup.clearLayers();

    // Clustered centers are DOM icons from the markercluster plugin, not
    // canvas circleMarkers, so the setStyle dimming below cannot touch them —
    // at the default India-wide zoom that left 8 bright cluster bubbles
    // competing with the fan (measured: opacity 1 while focused). A class on
    // the container dims the clustered backdrop in CSS instead. Individual
    // violet rings still only appear as clusters break apart on zoom-in;
    // that is inherent to clustering, not something this can paint around.
    L.DomUtil.addClass(map.getContainer(), 'fse-focus-active');

    var covered = {};
    rec.data.centers.forEach(function (id) { covered[String(id)] = true; });

    // Covered centers gain a violet ring; everything else recedes. Fill colour
    // (severity) and radius (devices) are untouched — coverage is added as a
    // STROKE so it displaces none of the encodings already on the marker.
    Object.keys(markerById).forEach(function (id) {
      var m = markerById[id];
      if (!m || !m._baseStyle) return;
      if (covered[id]) {
        m.setStyle({ color: FSE_COLOR, weight: 2.5, opacity: 1, fillOpacity: m._baseStyle.fillOpacity });
        m.bringToFront();
      } else {
        m.setStyle({ opacity: 0.25, fillOpacity: 0.08 });
      }
    });

    // The reach fan: a hairline from HQ to each center actually worked. Solid,
    // deliberately — dashes already mean "approximate location" here, and
    // overloading that would make a confident line look like a guess. No radius
    // or hull: both would claim coverage of ground the engineer has never been
    // to, which the ticket data cannot support.
    var hq = [rec.data.lat, rec.data.lng];
    var targets = rec.data.centers
      .map(function (id) { return markerById[String(id)]; })
      .filter(function (m) { return !!m; });
    function addLine(m) {
      reachGroup.addLayer(L.polyline([hq, m._latlng2], {
        color: FSE_COLOR, weight: 1.25, opacity: 0.5, interactive: false
      }));
    }
    if (REDUCED_MOTION) {
      targets.forEach(addLine);
    } else {
      // Staggered so the fan reads as reaching outward FROM the engineer —
      // cause and effect, not decoration. setTimeout rather than a CSS/SVG
      // stroke animation because the map runs preferCanvas, where polylines
      // have no DOM node to animate.
      targets.forEach(function (m, i) { setTimeout(function () { if (fseFocused === name) addLine(m); }, i * 15); });
    }

    rec.marker.setIcon(fseIcon_(rec.group[0].name, rec.group.length - 1, true));
  }

  function focusFse(name) {
    clearFseFocus();
    fseFocused = name;
    applyFseFocus_(name);
  }

  /** Focuses the first engineer whose name contains `query`. */
  function focusFseByName(query) {
    var q = String(query || '').toLowerCase().trim();
    if (!q) return false;
    var hit = Object.keys(fseMarkers).filter(function (n) { return n.toLowerCase().indexOf(q) !== -1; })[0];
    if (!hit) return false;
    var rec = fseMarkers[hit];
    map.setView([rec.data.lat, rec.data.lng], 8);
    focusFse(hit);
    if (fseSelectHandler) fseSelectHandler(rec.group);
    return true;
  }

  function setFseVisible(visible) {
    if (!fseGroup || !map) return;
    if (visible) { fseGroup.addTo(map); } else { clearFseFocus(); map.removeLayer(fseGroup); }
  }

  /* ── CP (Channel Partner dealer) layer ───────────────────────────
     Same "distinguish by shape" principle as the FSE layer above, with a
     briefcase glyph instead of a person. No same-HQ grouping: none of the
     roster's dealer companies share an HQ city (spec §7), so unlike
     fseIcon_/setFse there is no "+N" collapsing to do. */

  /** Briefcase pin. 24px glyph in a 44×44 box, same sizing as fseIcon_. */
  function cpIcon_(name, isFocused) {
    return L.divIcon({
      className: 'cp-pin' + (isFocused ? ' is-focused' : ''),
      iconSize: [44, 44], iconAnchor: [22, 22],
      html:
        '<span class="cp-glyph" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" width="24" height="24">' +
            '<rect x="3" y="7" width="18" height="13" rx="2"/>' +
            '<path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' +
            '<path d="M3 13h18"/>' +
          '</svg>' +
        '</span>' +
        '<span class="fse-name cp-name">' + esc(name) + '</span>'
    });
  }

  /**
   * Draws the dealer pins. `dealers` is the payload's cp.dealers array
   * ({name, hq, lat, lng, locations[]}). Called with a falsy/empty list this
   * clears the layer.
   */
  function setCp(dealers, onSelect) {
    cpSelectHandler = onSelect || null;
    if (!map) { pendingRender = function () { setCp(dealers, onSelect); }; return; }
    if (!cpGroup) { cpGroup = L.layerGroup().addTo(map); }
    cpGroup.clearLayers();
    cpMarkers = {};
    clearCpFocus();
    var list = dealers || [];
    if (!list.length) return;

    list.forEach(function (d) {
      var marker = L.marker([d.lat, d.lng], {
        icon: cpIcon_(d.name, false),
        keyboard: true, riseOnHover: true, zIndexOffset: 900
      });
      var n = (d.locations || []).length;
      marker.bindTooltip(
        '<strong>' + esc(d.name) + '</strong><br>' + esc(d.hq) +
        '<br>' + n + ' location' + (n === 1 ? '' : 's') + ' covered',
        { direction: 'top', className: 'cp-tip' }
      );
      marker.on('click', function () {
        // Toggle: clicking the focused dealer clears focus, mirroring the
        // FSE pin's own click behavior.
        if (cpFocused === d.name) { clearCpFocus(); if (cpSelectHandler) cpSelectHandler(null); return; }
        focusCp(d.name);
        if (cpSelectHandler) cpSelectHandler(d);
      });
      cpMarkers[d.name] = { marker: marker, data: d };
      cpGroup.addLayer(marker);
    });
  }

  /** Restores every dealer pin's default icon and removes the reach fan. */
  function clearCpFocus() {
    cpFocused = null;
    if (cpReachGroup) { cpReachGroup.clearLayers(); }
    Object.keys(cpMarkers).forEach(function (n) {
      var rec = cpMarkers[n];
      rec.marker.setIcon(cpIcon_(rec.data.name, false));
    });
  }

  function applyCpFocus_(name) {
    var rec = cpMarkers[name];
    if (!rec || !map) return;
    if (!cpReachGroup) { cpReachGroup = L.layerGroup().addTo(map); }
    cpReachGroup.clearLayers();

    // Unlike FSE's focus mode, there is no existing center marker to ring —
    // covered locations are independent geocoded points, so the fan draws its
    // own small endpoint dot at each one, with the location's name in a
    // tooltip.
    var hq = [rec.data.lat, rec.data.lng];
    var locations = rec.data.locations || [];
    function drawOne(loc) {
      cpReachGroup.addLayer(L.polyline([hq, [loc.lat, loc.lng]], {
        color: CP_COLOR, weight: 1.25, opacity: 0.5, interactive: false
      }));
      cpReachGroup.addLayer(L.circleMarker([loc.lat, loc.lng], {
        radius: 4, color: CP_COLOR, weight: 1.5,
        fillColor: CP_COLOR, fillOpacity: 0.6, interactive: false
      }).bindTooltip(esc(loc.name), { direction: 'top' }));
    }
    if (REDUCED_MOTION) {
      locations.forEach(drawOne);
    } else {
      // Staggered fan-out, same technique as applyFseFocus_ — setTimeout, not
      // a CSS/SVG stroke animation, since the map runs preferCanvas.
      locations.forEach(function (loc, i) {
        setTimeout(function () { if (cpFocused === name) drawOne(loc); }, i * 15);
      });
    }

    rec.marker.setIcon(cpIcon_(rec.data.name, true));
  }

  function focusCp(name) {
    clearCpFocus();
    cpFocused = name;
    applyCpFocus_(name);
  }

  function setCpVisible(visible) {
    if (!cpGroup || !map) return;
    if (visible) { cpGroup.addTo(map); } else { clearCpFocus(); map.removeLayer(cpGroup); }
  }

  function focusByName(query, onClick) {
    var q = String(query || '').toLowerCase().trim();
    if (!q || !map) return false;
    for (var i = 0; i < centers.length; i++) {
      if (String(centers[i][1]).toLowerCase().indexOf(q) !== -1) {
        map.setView([centers[i][2], centers[i][3]], 13);
        onClick(centers[i]);
        return true;
      }
    }
    return false;
  }

  function setTheme(next) {
    theme = (next === 'light') ? 'light' : 'dark';
    if (tileLayer) tileLayer.setUrl(TILES[theme]);
  }

  return {
    ensureMap: ensureMap, setData: setData, focusByName: focusByName, setTheme: setTheme,
    setFse: setFse, focusFse: focusFse, clearFseFocus: clearFseFocus,
    focusFseByName: focusFseByName, setFseVisible: setFseVisible,
    setCp: setCp, focusCp: focusCp, clearCpFocus: clearCpFocus, setCpVisible: setCpVisible
  };
}
</script>

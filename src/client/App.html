     * @param {{ticketNumber:number}=} opts when opened from a Support/CS
     *   ticket-number search, switches the ticket list to "All", jumps to
     *   whichever page contains that ticket, and highlights/scrolls to it
     *   once rendered (best-effort — the All list is capped, see
     *   buildCenterDetailSpecs, so a very old ticket may not appear at all).
     */
    function open(c, opts) {
      listPage = { assets: 0, open: 0, all: 0, swapped: 0, svcOpen: 0, svcClosed: 0, svcSwapped: 0 };
      activeTix = 'open';
      activeSvcTix = 'open';
      $(ids.panel).hidden = false;
      if (ids.scrim) $(ids.scrim).hidden = false;
      focusTrap_.activate();
      $(ids.title).textContent = c[1];
      $(ids.sub).textContent = 'Center #' + c[0];
      $(ids.body).innerHTML = '<div class="chart-empty" style="padding:32px 0">Loading details…</div>';
      $(ids.body).scrollTop = 0;
      gsCall(ep('apiGetCenterDetail'), { centerId: c[0] })
        .then(function (detail) {
          if (opts && opts.ticketNumber) {
            activeTix = 'all';
            var idx = -1;
            (detail.allTickets || []).forEach(function (t, i) {
              if (idx < 0 && String(t.ticket) === String(opts.ticketNumber)) idx = i;
            });
            if (idx >= 0) listPage.all = Math.floor(idx / PAGE_SIZE);
          }
          renderInto(c, detail);
          if (opts && opts.ticketNumber) focusTicket_(opts.ticketNumber);
        })
        .catch(function (err) {
          $(ids.body).innerHTML = '<div class="chart-empty" style="padding:32px 0">Failed: ' + escapeHtml(err.message) + '</div>';
        });
    }

    /** Highlights/scrolls to one ticket row, if it's on the currently-rendered page. */
    function focusTicket_(ticketNumber) {
      var row = $(ids.body).querySelector('.ticket-row[data-ticket="' + ticketNumber + '"]');
      if (row) {
        row.classList.add('is-highlighted');
        row.scrollIntoView({ block: 'center' });
      }
    }

    function renderInto(c, d) {
      var info = d.info || {};
      var tix = d.tickets || {};
      $(ids.title).textContent = info.center || c[1];
      $(ids.sub).textContent = 'Center #' + c[0] +
        (info.city ? ' · ' + info.city : '') + (info.state ? ', ' + info.state : '');

      // "Devices" = Jira devices mapped to this center by Summary serial
      // (d.assets, from getAssetIndex_) — NOT cloud_devices telemetry.
      var assetsList = d.assets || [];
      var jiraDevCount = assetsList.length || (c[7] || 0);
      var oldest = assetsList.length ? assetsList[0] : null; // oldest overall, not just the current page
      var html =
        '<div class="detail-grid">' +
        statBox_(jiraDevCount, 'Devices') +
        statBox_(tix.open_tickets != null ? tix.open_tickets : c[6], 'Open tickets') +
        statBox_(tix.total_tickets != null ? tix.total_tickets : '—', 'Tickets lifetime') +
        '</div>';

      if (oldest) {
        html += '<div class="first-asset"><strong>First asset:</strong> ' +
          escapeHtml(oldest.serial || oldest.summary) + ' (' + escapeHtml(oldest.type) + ') · ' +
          'born ' + escapeHtml(oldest.birthday || '—') + ' · age ' + humanAge(oldest.age_days) + '</div>';
      }

      html += '<dl class="detail-list">' +
        dt_('Hub', (info.hub || '—') + (info.hub_id != null ? ' · #' + info.hub_id : '')) +
        dt_('Segment', tix.segment || '—') +
        dt_('Center age', info.age_months != null
          ? centerAge(info.age_months) + ' (first deployment ' + (info.first_deployment || '—') + ')' : '—') +
        dt_('Location', [info.city, info.state, info.pin, info.country]
          .filter(Boolean).map(escapeHtml).join(', ') || '—') +
        '</dl>';

      // Ticket list: toggle between Open (default) and All (every ticket the
      // center has ever raised) — per user request to see full ticket history.
      // Each tab is independently paginated (5/page) — see listPage.open/all.
      var openList = d.openTickets || [];
      var allList = d.allTickets || [];
      // Swapped mirrors the Service-tickets block below and Center-360's own
      // `swapped` column (Queries.js centerTickets) — same '%swap%'
      // IssueCategory match, just the underlying ticket list for that count.
      var swappedList = d.swappedTickets || [];
      if (openList.length || allList.length || swappedList.length) {
        listPage.open = clampPage_(listPage.open, openList.length, PAGE_SIZE);
        listPage.all = clampPage_(listPage.all, allList.length, PAGE_SIZE);
        listPage.swapped = clampPage_(listPage.swapped, swappedList.length, PAGE_SIZE);
        var openSlice = openList.slice(listPage.open * PAGE_SIZE, listPage.open * PAGE_SIZE + PAGE_SIZE);
        var allSlice = allList.slice(listPage.all * PAGE_SIZE, listPage.all * PAGE_SIZE + PAGE_SIZE);
        var swappedSlice = swappedList.slice(listPage.swapped * PAGE_SIZE, listPage.swapped * PAGE_SIZE + PAGE_SIZE);
        html += '<div class="panel-section-title-row">' +
          '<span class="panel-section-title">Tickets</span>' +
          '<div class="ticket-toggle" role="group" aria-label="Ticket list filter">' +
          '<button type="button" class="ticket-toggle-btn' + (activeTix === 'open' ? ' is-active' : '') + '" data-tix="open">Open (' + openList.length + ')</button>' +
          '<button type="button" class="ticket-toggle-btn' + (activeTix === 'all' ? ' is-active' : '') + '" data-tix="all">All (' + allList.length + (allList.length >= 50 ? '+' : '') + ')</button>' +
          '<button type="button" class="ticket-toggle-btn' + (activeTix === 'swapped' ? ' is-active' : '') + '" data-tix="swapped">Swapped (' + swappedList.length + (swappedList.length >= 50 ? '+' : '') + ')</button>' +
          '</div></div>' +
          '<div class="ticket-list" data-tix-panel="open"' + (activeTix === 'open' ? '' : ' hidden') + '>' +
          ticketRowsHtml_(openSlice, 'priority') + listPagerHtml_('open', listPage.open, PAGE_SIZE, openList.length) + '</div>' +
          '<div class="ticket-list" data-tix-panel="all"' + (activeTix === 'all' ? '' : ' hidden') + '>' +
          ticketRowsHtml_(allSlice, 'status') + listPagerHtml_('all', listPage.all, PAGE_SIZE, allList.length) + '</div>' +
          '<div class="ticket-list" data-tix-panel="swapped"' + (activeTix === 'swapped' ? '' : ' hidden') + '>' +
          ticketRowsHtml_(swappedSlice, 'status') + listPagerHtml_('swapped', listPage.swapped, PAGE_SIZE, swappedList.length) + '</div>';
      }

      // Service (ServiceWRK) tickets — separate source from Zoho above, joined
      // to this center via customer_id (see buildCenterDetailSpecs). Swapped
      // is all-time and can overlap Open/Closed, same convention as the
      // Center-360 `swapped` column (Queries.js centerTickets).
      var svcOpenList = d.svcOpenTickets || [];
      var svcClosedList = d.svcClosedTickets || [];
      var svcSwappedList = d.svcSwappedTickets || [];
      if (svcOpenList.length || svcClosedList.length || svcSwappedList.length) {
        listPage.svcOpen = clampPage_(listPage.svcOpen, svcOpenList.length, PAGE_SIZE);
        listPage.svcClosed = clampPage_(listPage.svcClosed, svcClosedList.length, PAGE_SIZE);
        listPage.svcSwapped = clampPage_(listPage.svcSwapped, svcSwappedList.length, PAGE_SIZE);
        var svcOpenSlice = svcOpenList.slice(listPage.svcOpen * PAGE_SIZE, listPage.svcOpen * PAGE_SIZE + PAGE_SIZE);
        var svcClosedSlice = svcClosedList.slice(listPage.svcClosed * PAGE_SIZE, listPage.svcClosed * PAGE_SIZE + PAGE_SIZE);
        var svcSwappedSlice = svcSwappedList.slice(listPage.svcSwapped * PAGE_SIZE, listPage.svcSwapped * PAGE_SIZE + PAGE_SIZE);
        html += '<div class="panel-section-title-row">' +
          '<span class="panel-section-title">Service tickets</span>' +
          '<div class="ticket-toggle" role="group" aria-label="Service ticket list filter">' +
          '<button type="button" class="ticket-toggle-btn' + (activeSvcTix === 'open' ? ' is-active' : '') + '" data-svctix="open">Open (' + svcOpenList.length + ')</button>' +
          '<button type="button" class="ticket-toggle-btn' + (activeSvcTix === 'closed' ? ' is-active' : '') + '" data-svctix="closed">Closed (' + svcClosedList.length + (svcClosedList.length >= 50 ? '+' : '') + ')</button>' +
          '<button type="button" class="ticket-toggle-btn' + (activeSvcTix === 'swapped' ? ' is-active' : '') + '" data-svctix="swapped">Swapped (' + svcSwappedList.length + (svcSwappedList.length >= 50 ? '+' : '') + ')</button>' +
          '</div></div>' +
          '<div class="ticket-list" data-svctix-panel="open"' + (activeSvcTix === 'open' ? '' : ' hidden') + '>' +
          svcTicketRowsHtml_(svcOpenSlice) + listPagerHtml_('svcOpen', listPage.svcOpen, PAGE_SIZE, svcOpenList.length) + '</div>' +
          '<div class="ticket-list" data-svctix-panel="closed"' + (activeSvcTix === 'closed' ? '' : ' hidden') + '>' +
          svcTicketRowsHtml_(svcClosedSlice) + listPagerHtml_('svcClosed', listPage.svcClosed, PAGE_SIZE, svcClosedList.length) + '</div>' +
          '<div class="ticket-list" data-svctix-panel="swapped"' + (activeSvcTix === 'swapped' ? '' : ' hidden') + '>' +
          svcTicketRowsHtml_(svcSwappedSlice) + listPagerHtml_('svcSwapped', listPage.svcSwapped, PAGE_SIZE, svcSwappedList.length) + '</div>';
      } else {
        html += '<div class="panel-section-title">Service tickets</div>' +
          '<p class="card-sub">No ServiceWRK tickets are linked to this center.</p>';
      }

      if (assetsList.length) {
        listPage.assets = clampPage_(listPage.assets, assetsList.length, PAGE_SIZE);
        var assetsSlice = assetsList.slice(listPage.assets * PAGE_SIZE, listPage.assets * PAGE_SIZE + PAGE_SIZE);
        html += '<div class="panel-section-title">Jira devices (' + assetsList.length + ', oldest first)</div>' +
          '<div class="table-scroll"><table class="assets-table">' +
          '<thead><tr><th>Key</th><th>Serial</th><th>Type</th><th>Category</th><th class="num">Age</th><th>Since</th></tr></thead><tbody>' +
          assetsSlice.map(function (asset) {
            var keyCell = asset.key
              ? '<a href="' + escapeHtml(JIRA_BROWSE + encodeURIComponent(asset.key)) +
                '" target="_blank" rel="noopener noreferrer" title="Open ' + escapeHtml(asset.key) + ' in Jira">' +
                escapeHtml(asset.key) + '</a>'
              : '—';
            return '<tr><td>' + keyCell + '</td>' +
              '<td>' + escapeHtml(asset.serial || asset.summary) + '</td>' +
              '<td>' + escapeHtml(asset.type) + '</td>' +
              '<td>' + escapeHtml(asset.category) + '</td>' +
              '<td class="num">' + humanAge(asset.age_days) + '</td>' +
              '<td>' + escapeHtml(asset.birthday || '—') + '</td></tr>';
          }).join('') +
          '</tbody></table></div>' +
          listPagerHtml_('assets', listPage.assets, PAGE_SIZE, assetsList.length);
      } else {
        html += '<div class="panel-section-title">Jira devices</div>' +
          '<p class="card-sub">No Jira devices are linked to this center yet.</p>';
      }

      $(ids.body).innerHTML = html;
      Array.prototype.forEach.call($(ids.body).querySelectorAll('.ticket-toggle-btn[data-tix]'), function (btn) {
        btn.addEventListener('click', function () {
          activeTix = btn.getAttribute('data-tix');
          renderInto(c, d);
        });
      });
      Array.prototype.forEach.call($(ids.body).querySelectorAll('.ticket-toggle-btn[data-svctix]'), function (btn) {
        btn.addEventListener('click', function () {
          activeSvcTix = btn.getAttribute('data-svctix');
          renderInto(c, d);
        });
      });
      Array.prototype.forEach.call($(ids.body).querySelectorAll('.list-pager-btn'), function (btn) {
        btn.addEventListener('click', function () {
          var pagerKey = btn.closest('.list-pager').getAttribute('data-pager');
          listPage[pagerKey] += (btn.getAttribute('data-dir') === 'next' ? 1 : -1);
          renderInto(c, d);
        });
      });
    }

    /** Opens the same drawer for a customer (hub): rollup + its centers. */
    function openCustomer(cust, centersOfHub) {
      $(ids.panel).hidden = false;
      if (ids.scrim) $(ids.scrim).hidden = false;
      focusTrap_.activate();
      $(ids.title).textContent = cust.hub;
      var hubIds = cust.hub_ids || [];
      var hubLabel = hubIds.length === 1 ? 'Hub #' + hubIds[0] : hubIds.length + ' hubs';
      $(ids.sub).textContent = hubLabel + ' · ' + (cust.tier || 'customer');
      $(ids.body).scrollTop = 0;
      var html =
        '<div class="detail-grid">' +
        statBox_(cust.centers, 'Centers') +
        statBox_(cust.open_tickets, 'Open tickets') +
        '</div>';
      // Only centers WITH open tickets (per request), most open first.
      var withOpen = (centersOfHub || []).filter(function (c) { return (c[6] || 0) > 0; })
        .sort(function (a, b) { return (b[6] || 0) - (a[6] || 0); });
      if (withOpen.length) {
        html += '<div class="panel-section-title">Centers with open tickets (' + withOpen.length + ')</div>' +
          '<div class="ticket-list">' +
          withOpen.map(function (c, i) {
            var pc = c[6] > 3 ? 'danger' : 'warn';
            return '<button class="ticket-row" type="button" data-ci="' + i + '">' +
              '<div class="ticket-row-top"><span class="ticket-id">' + escapeHtml(c[1]) + '</span>' +
              '<span class="badge badge-' + pc + '">' + c[6] + ' open</span></div>' +
              '<div class="ticket-subj">' + c[4] + ' devices</div></button>';
          }).join('') + '</div>';
      } else {
        html += '<p class="card-sub">No centers with open tickets for this customer.</p>';
      }
      $(ids.body).innerHTML = html;
      Array.prototype.forEach.call($(ids.body).querySelectorAll('button[data-ci]'), function (b) {
        b.addEventListener('click', function () { open(withOpen[parseInt(b.getAttribute('data-ci'), 10)]); });
      });
    }

    function close() {
      focusTrap_.deactivate();
      $(ids.panel).hidden = true;
      if (ids.scrim) $(ids.scrim).hidden = true;
    }
    return { open: open, openCustomer: openCustomer, close: close };
  }

  var mainMap = MapView('assetMap');
  var tcMap = MapView('tcMap');
  var cdmMap = MapView('cdmMap');
  var CenterDetail = makeCenterDetail({
    panel: 'centerDrawer', scrim: 'centerScrim',
    title: 'centerDrawerTitle', sub: 'centerDrawerSub', body: 'centerDrawerBody'
  });
  /** Open the drawer from a Center-360 row object. */
  function openCenterRow(row) {
    CenterDetail.open([row.center_id, row.center, 0, 0, row.devices || 0, row.online || 0, row.open_tickets || 0, 0]);
  }

  /* ── theme ───────────────────────────────────────────────────── */
  function applyTheme(theme, persist) {
    state.theme = (theme === 'light') ? 'light' : 'dark';
    document.body.setAttribute('data-theme', state.theme);
    $('themeDark').setAttribute('aria-pressed', String(state.theme === 'dark'));
    $('themeLight').setAttribute('aria-pressed', String(state.theme === 'light'));
    Charts.applyTheme(state.theme);
    if (persist) localStorage.setItem('sip.theme', state.theme);
    // ECharts colors are baked at build time → rebuild from cached data.
    if (state.lastDashboard) renderDashboard(state.lastDashboard);
    if (state.overviewFlowLoaded) renderOverviewFlow(state.overviewFlowData);
    mainMap.setTheme(state.theme);
    tcMap.setTheme(state.theme);
    if (state.mapLoaded) applyMapFilters();
    if (state.topLoaded) renderTopCustomers(state.topBundle);
  }

  /**
   * The sidebar rests as a narrow icon-only "bubble" and expands into the
   * full nav on hover/focus (pure CSS, see Styles.html — .app-main never
   * reflows for a hover). "Pinned" makes the expanded state the resting
   * one instead, for anyone who wants the labels on screen permanently.
   */
  function applySidebarPinned(pinned, persist) {
    document.body.classList.toggle('sidebar-pinned', pinned);
    var btn = $('sidebarCollapseBtn');
    if (btn) {
      btn.setAttribute('aria-expanded', String(pinned));
      btn.setAttribute('aria-label', pinned ? 'Unpin sidebar' : 'Pin sidebar open');
      // Unlike the old always-expanded sidebar, this label is only ever on
      // screen once the rail is already wide (pinned, or mid hover/focus
      // peek) — so, unlike before, it must match whichever of those two
      // visible states is live, not just a static caption.
      var label = btn.querySelector('span');
      if (label) label.textContent = pinned ? 'Unpin' : 'Pin open';
    }
    if (persist) localStorage.setItem('sip.sidebarPinned', pinned ? '1' : '0');
    // Charts/maps size themselves off the viewport at render time — the
    // sidebar width change needs a resize tick so they don't stay stale.
    // .app-main's width transitions over --dur, so a resize fired only now
    // makes ECharts measure the container mid-transition and freeze at that
    // transient (wrong) width — nothing fires again to correct it once the
    // transition settles. Fire once now (covers non-animated cases) and once
    // more when the transition actually finishes.
    window.dispatchEvent(new Event('resize'));
    var appMain = document.querySelector('.app-main');
    if (appMain) {
      appMain.addEventListener('transitionend', function onSidebarTransitionEnd(e) {
        if (e.propertyName !== 'margin-left') return;
        appMain.removeEventListener('transitionend', onSidebarTransitionEnd);
        window.dispatchEvent(new Event('resize'));
      });
    }
  }

  /* ── Top Customers page ──────────────────────────────────────── */
  function loadTopCustomers() {
    gsCall(ep('apiGetTopCustomers'), { filters: state.globalFilters })
      .then(function (payload) {
        state.topLoaded = true;
        // hubCount is a plain derived field (not shipped by the server) so
        // TC_COLUMNS' generic a[tcSort.key] sort works on it like any other column.
        (payload.customers || []).forEach(function (c) { c.hubCount = (c.hub_ids || []).length; });
        state.topBundle = payload;
        renderTopCustomers(payload);
      })
      .catch(function (err) {
        toast('Top customers failed: ' + err.message, 'error');
      });
  }

  function renderTopCustomers(payload) {
    var t = payload.totals || {};
    setKpi('tcCustomers', t.customers, (t.withData || 0) + ' with live data');
    setKpi('tcCenters', t.centers, 'across top accounts');
    setKpi('tcTicketCount', t.ticket_count, FMT.format(t.open_tickets || 0) + ' currently open');
    setKpi('tcSlaBreach', t.sla_breach, (t.sla_within_pct != null ? t.sla_within_pct + '% within SLA' : 'past target'));

    tcMap.setData(payload.mapCenters || [], CenterDetail.open, { stateIdx: TCI.state });

    // Charts use the top ~15 by the relevant metric.
    var withCenters = payload.customers.filter(function (c) { return c.centers > 0; });
    var withTickets = payload.customers.filter(function (c) { return c.open_tickets > 0; });

    Charts.rankBar('chartTcCenters', asRows(topBy(withCenters, 'centers', 15), 'centers'), { color: '#38BDF8', empty: 'No center data' });
    Charts.rankBar('chartTcTickets', asRows(topBy(withTickets, 'open_tickets', 15), 'open_tickets'), { color: '#F5B301', empty: 'No open tickets' });

    renderTcTable(topCustFilteredRows());
  }

  /** Customer leaderboard filtered by the global search box (name or hub ID) — client-side, the full ~27-row Top LE list is already in memory. */
  function topCustFilteredRows() {
    var all = (state.topBundle && state.topBundle.customers) || [];
    var q = (state.search || '').trim().toLowerCase();
    if (!q) return all;
    return all.filter(function (c) {
      return String(c.hub || '').toLowerCase().indexOf(q) !== -1 ||
        (c.hub_ids || []).some(function (id) { return String(id).indexOf(q) !== -1; });
    });
  }

  function topBy(rows, key, n) {
    return rows.slice().sort(function (a, b) { return b[key] - a[key]; }).slice(0, n);
  }
  function asRows(customers, key) {
    return customers.map(function (c) { return { label: shortName(c.hub), cnt: c[key] }; });
  }
  function shortName(name) {
    return String(name || '').replace(/\s*\(HUB\)\s*/i, '').split(',')[0].slice(0, 34);
  }

  var TC_COLUMNS = [
    { key: 'hub', label: 'Customer', sortable: true },
    { key: 'hubCount', label: 'Hubs', sortable: true, num: true },
    { key: 'centers', label: 'Centers', sortable: true, num: true },
    { key: 'open_tickets', label: 'Open tickets', sortable: true, num: true },
    // Same '%swap%' IssueCategory match as the Centers page's own Swapped
    // column (Queries.js centerTickets) — per user, 2026-08-25.
    { key: 'swapped', label: 'Swapped', sortable: true, num: true },
    // Displays c.openAgeBucket (a band label) but SORTS on c.maxOpenAgeDays
    // (the underlying day count) — sorting the band string alphabetically
    // would not be chronological ("1-2d" < "30d+" < "3-7d"). Per user,
    // 2026-08-25: bucket of the customer's OLDEST currently-open ticket,
    // same 5 bands as the Support page's Open ticket age chart.
    { key: 'maxOpenAgeDays', label: 'Oldest open ticket', sortable: true }
  ];
  var tcSort = { key: 'centers', dir: 'desc' };

  function renderTcTable(customers) {
    $('tcTableHead').innerHTML = TC_COLUMNS.map(function (col) {
      var cls = col.num ? ' class="num"' : '';
      var aria = tcSort.key === col.key ? (tcSort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
      return '<th scope="col"' + cls + ' aria-sort="' + aria + '">' +
        '<button type="button" class="th-sort" data-k="' + col.key + '" aria-sort="' + aria + '">' + col.label +
        '<svg class="sort-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button></th>';
    }).join('');
    Array.prototype.forEach.call($('tcTableHead').querySelectorAll('.th-sort'), function (btn) {
      btn.addEventListener('click', function () {
        var k = btn.getAttribute('data-k');
        if (tcSort.key === k) tcSort.dir = tcSort.dir === 'asc' ? 'desc' : 'asc';
        else { tcSort.key = k; tcSort.dir = k === 'hub' ? 'asc' : 'desc'; }
        renderTcTable(topCustFilteredRows());
      });
    });

    var sign = tcSort.dir === 'asc' ? 1 : -1;
    var rows = customers.slice().sort(function (a, b) {
      var x = a[tcSort.key], y = b[tcSort.key];
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * sign;
      return String(x).localeCompare(String(y)) * sign;
    });

    if (!rows.length) {
      $('tcTable').querySelector('tbody').innerHTML = '<tr><td colspan="' + TC_COLUMNS.length + '">' +
        '<div class="chart-empty" style="padding:32px 0">' +
        '<strong>No customers match</strong><span>Try clearing the search</span>' +
        '</div></td></tr>';
      return;
    }

    $('tcTable').querySelector('tbody').innerHTML = rows.map(function (c, i) {
      var tb = c.open_tickets > 3 ? 'danger' : (c.open_tickets > 0 ? 'warn' : 'ok');
      var hubIds = c.hub_ids || [];
      return '<tr class="is-clickable" data-idx="' + i + '" tabindex="0" role="button" aria-label="Open ' + escapeHtml(c.hub) + '">' +
        '<td><strong>' + escapeHtml(c.hub) + '</strong> <span class="badge badge-info">' + escapeHtml(c.tier) + '</span></td>' +
        '<td class="num" title="' + escapeHtml(hubIds.join(', ')) + '">' + FMT.format(hubIds.length) + '</td>' +
        '<td class="num">' + FMT.format(c.centers) + '</td>' +
        '<td class="num"><span class="badge badge-' + tb + '">' + FMT.format(c.open_tickets) + '</span></td>' +
        '<td class="num">' + FMT.format(c.swapped || 0) + '</td>' +
        '<td>' + escapeHtml(c.openAgeBucket || '—') + '</td>' +
        '</tr>';
    }).join('');
    Array.prototype.forEach.call($('tcTable').querySelectorAll('tr.is-clickable'), function (tr) {
      var cust = rows[parseInt(tr.getAttribute('data-idx'), 10)];
      function go() {
        var hubIds = cust.hub_ids || [];
        var centersOfHub = (state.topBundle && state.topBundle.mapCenters || [])
          .filter(function (mc) { return hubIds.indexOf(mc[CI.hubId]) !== -1; });
        CenterDetail.openCustomer(cust, centersOfHub);
      }
      tr.addEventListener('click', go);
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  /* ── tabs ────────────────────────────────────────────────────── */
  // Order MUST match the sidebar's DOM/visual order (Index.html) — wireTabs()'s
  // keydown handler moves focus by TAB_IDS index, so a mismatch here makes
  // arrow-key traversal jump to a non-adjacent tab (found 2026-08-24; array
  // previously had 'tab-asset' 2nd instead of 6th, out of sync with the DOM).
  var TAB_IDS = ['tab-overview', 'tab-centers', 'tab-support', 'tab-service', 'tab-tom', 'tab-asset', 'tab-cdm', 'tab-topcust', 'tab-numbers', 'tab-rawdata'];

  /* ── hash routing (#overview, #asset, …) ─────────────────────── */
  function pageOf(tabId) { return tabId.replace('tab-', ''); }
  function routeHash() { return '#' + pageOf(state.activeTab); }

  function updateHash() {
    var h = routeHash();
    if (location.hash !== h) {
      try { history.replaceState(null, '', h); } catch (e) { location.hash = h; }
    }
  }

  /** Apply the URL hash on boot / back-forward. Legacy #new-<page> links still resolve. */
  function applyHashRoute() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    if (h.indexOf('new-') === 0) h = h.slice(4); // legacy alias from the old edition routes
    var tabId = 'tab-' + h;
    if (TAB_IDS.indexOf(tabId) !== -1) activateTab(tabId);
  }

  function activateTab(tabId) {
    state.activeTab = tabId;
    TAB_IDS.forEach(function (id) {
      var tab = $(id);
      var panel = $(id.replace('tab-', 'panel-'));
      var active = id === tabId;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
      panel.hidden = !active;
      panel.classList.toggle('is-active', active);
    });
    Charts.flushVisible();
    updateSearchPlaceholder();
    var overviewFlowStale = state.overviewFlowFilters && !filtersEqual_(state.overviewFlowFilters, state.globalFilters);
    if (tabId === 'tab-overview') {
      if (!state.overviewFlowLoaded || overviewFlowStale) loadOverviewFlow();
      if (!mainMap.ensureMap()) {
        toast('Map library failed to load — check your network and refresh.', 'error');
      } else {
        if (!state.mapLoaded) loadMapData();
      }
    }
    if (tabId === 'tab-topcust') {
      tcMap.ensureMap();
      if (!state.topLoaded) loadTopCustomers();
    }
    if (tabId === 'tab-cdm') {
      cdmMap.ensureMap();
      if (!state.cdmLoaded) { loadCdmData(); loadCdmDevices(); }
    }
    var serviceStale = state.serviceFilters && !filtersEqual_(state.serviceFilters, state.globalFilters);
    var tomStale = state.tomFilters && !filtersEqual_(state.tomFilters, state.globalFilters);
    if (tabId === 'tab-tom' && (!state.tomLoaded || tomStale)) {
      state.tom.page = 0;
      loadTom();
    }
    if (tabId === 'tab-service' && (!state.serviceLoaded || serviceStale)) {
      state.service.page = 0;
      loadService();
    }
    var numbersStale = state.numbersFilters && !filtersEqual_(state.numbersFilters, state.globalFilters);
    if (tabId === 'tab-numbers') {
      if (!state.numbersLoaded || numbersStale) loadNumbers();
      if (!state.cdRaw.total || numbersStale) loadCdRaw();
    }
    if (tabId === 'tab-rawdata' &&
        (!state.rawData.total || (state.rawDataFilters && !filtersEqual_(state.rawDataFilters, state.globalFilters)))) {
      loadRawTable();
    }

    // Shared-payload rule: the dashboard payload is fetched once under the
    // current global filters and shared by Asset/Centers/Support/Overview;
    // refetch when switching into one of those tabs and the payload on hand
    // was fetched under a different filter set (flat comparison — no more
    // per-tab segment branching now that the filter is global).
    var sharesDashboardPayload = ['tab-asset', 'tab-centers', 'tab-support', 'tab-service'].indexOf(tabId) !== -1;
    if (sharesDashboardPayload && state.lastDashboard && !filtersEqual_(state.dashFilters, state.globalFilters)) loadDashboard(false);

    // Same rule for paginated tables that fetch their own rows rather than
    // reading the shared payload — commitGlobalFilters_ only reloads them
    // when their tab is already active, so a filter applied from ANY other tab
    // left them stale on the way back (finding I2). Page resets to 0 because the
    // row set changed underneath, matching commitGlobalFilters_'s own behaviour.
    if (tabId === 'tab-centers' && state.centerFilters && !filtersEqual_(state.centerFilters, state.globalFilters)) {
      state.centers.page = 0;
      loadCenters();
    }
    if (tabId === 'tab-cdm' && state.cdmDeviceFilters && !filtersEqual_(state.cdmDeviceFilters, state.globalFilters)) {
      state.cdmDevices.page = 0;
      loadCdmDevices();
    }
    // SLA-risk worklist: same rule, plus a first-visit fetch — it lives on the
    // Support page but pulls its own rows, so nothing else would populate it.
    if (tabId === 'tab-support') {
      if (!state.slaRiskFilters) loadSlaRiskTickets();
      else if (!filtersEqual_(state.slaRiskFilters, state.globalFilters)) {
        state.slaRisk.page = 0;
        loadSlaRiskTickets();
      }
    }

    updateHash();
  }

  /* ── Numbers page (center_details counts + raw data) ───────────── */
  function loadNumbers(bypass) {
    gsCall('apiGetNumbers', { bypassCache: !!bypass, filters: state.globalFilters })
      .then(function (d) { state.numbersLoaded = true; state.numbersFilters = state.globalFilters; renderNumbers(d); })
      .catch(function (err) {
        $('numCentersKpi').innerHTML = '<div class="num-empty">Failed: ' + escapeHtml(err.message) + '</div>';
      });
  }

  function loadCdRaw() {
    $('cdRawInfo').textContent = 'Loading…';
    gsCall('apiGetCenterDetailsRaw', { page: state.cdRaw.page, pageSize: state.cdRaw.pageSize, filters: state.globalFilters })
      .then(renderCdRaw)
      .catch(function (err) {
        $('cdRawInfo').textContent = 'Failed: ' + err.message;
      });
  }

  function renderCdRaw(payload) {
    var rows = payload.rows || [];
    state.cdRaw.total = payload.totalRows || 0;
    var body = $('cdRawTable').querySelector('tbody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="14" class="chart-empty">No rows</td></tr>';
    } else {
      body.innerHTML = rows.map(function (r) {
        return '<tr>' +
          '<td class="num">' + escapeHtml(r.center_id) + '</td>' +
          '<td><strong>' + escapeHtml(r.center || '—') + '</strong></td>' +
          '<td>' + escapeHtml(r.status || '—') + '</td>' +
          '<td>' + escapeHtml(r.type || '—') + '</td>' +
          '<td>' + escapeHtml(r.segment || '—') + '</td>' +
          '<td class="num">' + escapeHtml(r.hub_id == null ? '—' : r.hub_id) + '</td>' +
          '<td>' + escapeHtml(r.hub || '—') + '</td>' +
          '<td>' + escapeHtml(r.city || '—') + '</td>' +
          '<td>' + escapeHtml(r.state || '—') + '</td>' +
          '<td>' + escapeHtml(r.pin || '—') + '</td>' +
          '<td>' + escapeHtml(r.deployed || '—') + '</td>' +
          '<td>' + escapeHtml(r.deactivated || '—') + '</td>' +
          '<td class="num">' + FMT.format(r.devices || 0) + '</td>' +
          '<td><span class="badge badge-' + ((r.devices || 0) > 0 ? 'ok">Yes' : 'muted">No') + '</span></td>' +
          '</tr>';
      }).join('');
    }
    var start = state.cdRaw.page * state.cdRaw.pageSize;
    var end = Math.min(start + state.cdRaw.pageSize, state.cdRaw.total);
    $('cdRawInfo').textContent = state.cdRaw.total
      ? (FMT.format(start + 1) + '–' + FMT.format(end) + ' of ' + FMT.format(state.cdRaw.total) + ' centers')
      : '0 centers';
    var maxPage = Math.max(0, Math.ceil(state.cdRaw.total / state.cdRaw.pageSize) - 1);
    $('cdRawPage').textContent = (state.cdRaw.page + 1) + ' / ' + (maxPage + 1);
    $('cdRawPrev').disabled = state.cdRaw.page <= 0;
    $('cdRawNext').disabled = state.cdRaw.page >= maxPage;
  }

  /* ── Raw Data page (4 sources) ──────────────────────────────────
     Each source applies whatever filter dimensions its own schema supports
     — see RawData.js's file header for exactly which per source. */
  function loadRawTable() {
    $('rawTableInfo').textContent = 'Loading\u2026';
    gsCall('apiGetRawPage', { source: state.rawData.source, page: state.rawData.page, pageSize: state.rawData.pageSize, filters: state.globalFilters })
      .then(function (payload) { state.rawDataFilters = state.globalFilters; renderRawTable(payload); })
      .catch(function (err) {
        $('rawTableInfo').textContent = 'Failed: ' + err.message;
      });
  }

  function renderRawTable(payload) {
    var rows = payload.rows || [];
    var columns = payload.columns || [];
    state.rawData.total = payload.totalRows || 0;

    var table = $('rawTable');
    table.querySelector('thead tr').innerHTML = columns.map(function (c) {
      return '<th scope="col">' + escapeHtml(c) + '</th>';
    }).join('');

    var body = table.querySelector('tbody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="' + Math.max(1, columns.length) + '" class="chart-empty">No rows</td></tr>';
    } else {
      body.innerHTML = rows.map(function (r) {
        return '<tr>' + columns.map(function (c) {
          return '<td>' + escapeHtml(r[c]) + '</td>';
        }).join('') + '</tr>';
      }).join('');
    }

    var start = state.rawData.page * state.rawData.pageSize;
    var end = Math.min(start + state.rawData.pageSize, state.rawData.total);
    $('rawTableInfo').textContent = state.rawData.total
      ? (FMT.format(start + 1) + '\u2013' + FMT.format(end) + ' of ' + FMT.format(state.rawData.total) + ' rows')
      : '0 rows';
    var maxPage = Math.max(0, Math.ceil(state.rawData.total / state.rawData.pageSize) - 1);
    $('rawPage').textContent = (state.rawData.page + 1) + ' / ' + (maxPage + 1);
    $('rawPrev').disabled = state.rawData.page <= 0;
    $('rawNext').disabled = state.rawData.page >= maxPage;
  }

  function csvCell(value) {
    var cell = String(value == null ? '' : value);
    return /[",\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell;
  }

  function exportRawFull() {
    var btn = $('rawExportBtn');
    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Exporting\u2026';
    gsCall('apiGetRawExport', { source: state.rawData.source, filters: state.globalFilters })
      .then(function (payload) {
        var columns = payload.columns || [];
        var rows = payload.rows || [];
        if (!rows.length) { toast('Nothing to export', 'error'); return; }
        var lines = [columns.map(csvCell).join(',')].concat(rows.map(function (row) {
          return columns.map(function (c) { return csvCell(row[c]); }).join(',');
        }));
        var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'sip-raw-' + state.rawData.source + '.csv';
        link.click();
        URL.revokeObjectURL(link.href);
        toast(payload.truncated
          ? 'Exported first ' + FMT.format(rows.length) + ' of ' + FMT.format(payload.totalRows) + ' rows'
          : FMT.format(rows.length) + ' rows exported', 'ok');
      })
      .catch(function (err) { toast('Export failed: ' + err.message, 'error'); })
      .then(function () { btn.disabled = false; btn.textContent = originalText; });
  }

  function numCompare(items) {
    return items.map(function (it) {
      return '<div class="num-cell' + (it.hi ? ' is-hi' : '') + '">' +
        '<span class="num-cell-val">' + FMT.format(it.value || 0) + '</span>' +
        '<span class="num-cell-label">' + escapeHtml(it.label) + '</span></div>';
    }).join('');
  }

  function numTable(title, rows) {
    if (!rows || !rows.length) {
      return '<div class="num-table"><h3>' + escapeHtml(title) + '</h3><p class="num-empty">—</p></div>';
    }
    var body = rows.map(function (r) {
      return '<tr><td>' + escapeHtml(r.k) + '</td><td class="num">' + FMT.format(r.n || 0) + '</td></tr>';
    }).join('');
    return '<div class="num-table"><h3>' + escapeHtml(title) + '</h3>' +
      '<table class="data-table"><tbody>' + body + '</tbody></table></div>';
  }

  function renderNumbers(d) {
    $('numCentersKpi').innerHTML = numCompare([
      { label: 'Centers (center_details)', value: d.centers.total, hi: true }
    ]);
    $('numCentersStatus').innerHTML = numTable('By status', d.centers.by_status);
    $('numCentersSegment').innerHTML = numTable('By segment', d.centers.by_segment);

    $('numHubsKpi').innerHTML = numCompare([
      { label: 'Hubs (center_details)', value: d.hubs.total, hi: true }
    ]);
    $('numHubsStatus').innerHTML = numTable('By center status', d.hubs.by_status);
    $('numHubsSegment').innerHTML = numTable('By master segment', d.hubs.by_segment);

    var devSrc = { 'jira_data': 'jira_data (BigQuery)' }[d.devices.source] || '';
    var mapSrc = { 'center_details': 'center_details serial', 'cloud_devices': 'serial→cloud_devices' }[d.devices.center_source] || 'serial';
    $('numDevicesKpi').innerHTML = numCompare([
      { label: 'Devices', value: d.devices.total, hi: true }
    ]) + (devSrc ? '<div class="num-src">source: ' + escapeHtml(devSrc) + ' · mapped by ' + escapeHtml(mapSrc) + ' (Jira Customer ID ignored)</div>' : '');
    $('numDevicesStatus').innerHTML = numTable('By Jira status', d.devices.by_status);

    $('numTicketsKpi').innerHTML = numCompare([
      { label: 'Total tickets', value: d.tickets.total, hi: true },
      { label: 'Tech', value: d.tickets.tech },
      { label: 'Non-Tech', value: d.tickets.nontech }
    ]);
    $('numTicketsStatus').innerHTML = numTable('By status', d.tickets.by_status);
  }

  function wireTabs() {
    TAB_IDS.forEach(function (id, index) {
      var tab = $(id);
      tab.addEventListener('click', function () { activateTab(id); });
      tab.addEventListener('keydown', function (event) {
        var delta = (event.key === 'ArrowDown' || event.key === 'ArrowRight') ? 1 :
          ((event.key === 'ArrowUp' || event.key === 'ArrowLeft') ? -1 : 0);
        if (!delta) return;
        event.preventDefault();
        var next = TAB_IDS[(index + delta + TAB_IDS.length) % TAB_IDS.length];
        activateTab(next);
        $(next).focus();
      });
    });
  }

  /* ── auto refresh ────────────────────────────────────────────── */
  function refreshAll(bypassCache) {
    // Unconditional, like loadDashboard/loadCenters below — this is
    // also what makes the very first load happen: init() calls refreshAll(false)
    // unconditionally, but activateTab() (which the Step 1 tab-switch/staleness
    // guard lives in) is NOT itself called at boot unless the URL carries a
    // #hash (see applyHashRoute — a no-op with no hash). Gating this behind
    // state.overviewFlowLoaded, mirroring the lazy tabs below, left the
    // Overview landing page permanently empty on a plain cold load (verified
    // in the local preview: trees rendered only after adding #overview to the
    // URL to force applyHashRoute → activateTab). Matches the pre-existing
    // unconditional loadExec() this replaces.
    loadOverviewFlow();
    // Same reasoning as loadOverviewFlow() above — the map now lives on the
    // Overview landing page (merged in 2026-08-21, was its own "Map" tab), so
    // it needs the same unconditional cold-load treatment, not the
    // state.xLoaded gating the still-lazy tabs below use.
    if (mainMap.ensureMap()) loadMapData();
    loadDashboard(bypassCache);
    loadCenters();
    if (state.serviceLoaded) loadService();
    if (state.tomLoaded) loadTom();
    if (state.topLoaded) loadTopCustomers();
    // Numbers page (incl. the Google-Sheet devices count) — only when it's in play.
    if (state.numbersLoaded || state.activeTab === 'tab-numbers') {
      loadNumbers(bypassCache);
      loadCdRaw();
    }
  }

  function tickCountdown() {
    if (!state.autoRefresh) { $('refreshCountdown').textContent = ''; return; }
    state.countdown -= 1;
    if (state.countdown <= 0) {
      // No cache bypass here: the server TTL already bounds staleness, and a
      // bypass forced the full multi-query recompute on every cycle. Only the
      // manual Refresh button bypasses.
      refreshAll(false);
      state.countdown = REFRESH_SECONDS;
    }
    var m = Math.floor(state.countdown / 60);
    var s = String(state.countdown % 60).padStart(2, '0');
    $('refreshCountdown').textContent = m + ':' + s;
  }

  /* ── boot ────────────────────────────────────────────────────── */
  function debounce(fn, wait) {
    var timer;
    return function () {
      clearTimeout(timer);
      var args = arguments, self = this;
      timer = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }

  /* ══════════════ Metric explanations ("how is this calculated?") ══════════════
     One catalog of every metric on the dashboard; a small ⓘ next to each KPI tile
     and card title opens a popover with its code, formula and data source. */
  var METRIC_INFO = {
    // ── Pillar 1 · Asset ──
    uptime: { code: 'M-A1', name: 'Machine Uptime %',
      formula: '(life − downtime) ÷ life × 100, per center, clamped 0–100. Downtime = the union of merged device-failure ticket intervals [created → closed/now]; overlaps are counted once. The headline figure is the average across centers.',
      source: 'zoho_data failure tickets + center_details.deploymentdate (birth). North-Star target ≥ 99%.' },
    mtbf: { code: 'M-A2', name: 'Mean Time Between Failures',
      formula: 'uptime hours ÷ failure count, shown in days. Null when a center has fewer than 2 failures.',
      source: 'Derived in the uptime engine (zoho_data failures over deployment life).' },
    ftf: { code: 'M-A3', name: 'First-Time-Failure by batch',
      formula: 'Per production-year cohort: the share of the cohort whose center has ever logged a device-failure ticket, plus median time-to-first-failure and early fails (<7 days). Failures/device is a CENTER-grain proxy (a device inherits its whole center’s ticket count) — no per-device failure source exists yet.',
      source: 'Batch = year of a device’s first Jira appearance (serial parsed from summary); failures from zoho_data at that center.' },
    batch: { code: 'M-A5', name: 'Batch Failure signal',
      formula: 'The production-year cohort with the worst first-time-failure rate (minimum 30 devices), flagging a likely batch defect; the top failure category is its signature.',
      source: 'Same cohort table as M-A3 (zoho_data failures by birth year).' },
    deployAge: { code: 'M-A4≈', name: 'Deployment / lifecycle age',
      formula: 'today − deploymentdate, per customer (center). Shown in months, or years (1 dp) once ≥ 12 months.',
      source: 'center_details.deploymentdate. True TRD dwell needs the Jira changelog — not yet in the sandbox.' },
    assetLifecycle: { name: 'Asset lifecycle / types',
      formula: 'Distinct Jira assets grouped by lifecycle status or hardware type — COUNT(DISTINCT issue_key).',
      source: 'jira_data (BigQuery), deduped by issue_key.' },
    assetAge: { name: 'Asset lifecycle age',
      formula: 'Device age = today − Created (per device), averaged; 5y+ devices are past the expected life.',
      source: 'jira_data.ticket_created (BigQuery).' },

    // ── Pillar 3 · Service ──
    sla: { code: 'SLA', name: 'SLA compliance',
      formula: 'within% = resolved-within-SLA ÷ resolved. A ticket is resolved when Closed with both dates; “within” means resolution days ≤ the SLA days for its ticket type. Split into Tech / Non-Tech.',
      source: 'zoho_data (Closed tickets) vs the SLA catalog (117 ticket types → days + Tech flag). Uncatalogued types default to 5 days + a keyword-based Tech guess.' },
    slaType: { code: 'SLA', name: 'SLA breach by issue type',
      formula: 'Per ticket type (≥ 20 resolved): the share of resolved tickets that missed the catalog SLA, worst first.',
      source: 'zoho_data resolution time vs SLA-catalog days.' },
    slaBreach: { code: 'SLA', name: 'SLA breach (open)',
      formula: 'Open tickets whose current age already exceeds the SLA days for their ticket type.',
      source: 'zoho_data open tickets vs SLA catalog.' },
    // ── Support distributions ──
    ticketFlow: { name: 'Ticket flow (created vs closed)',
      formula: 'Monthly counts of tickets created vs closed over the last 12 months.',
      source: 'zoho_data CreatedAt / ClosedAt (parsed from the date strings).' },
    attention: { name: 'Centers needing attention',
      formula: 'Centers ranked by number of open tickets (4+ open = flagged).',
      source: 'zoho_data open tickets grouped by center, joined to center_details names.' },
    backlog: { name: 'Active backlog', formula: 'Open (non-terminal) tickets grouped by status. No date window — the whole current backlog.', source: 'zoho_data (status not Closed / Duplicate / Junk).' },
    categories: { name: 'Issue categories', formula: 'Ticket counts grouped by issue category / type.', source: 'zoho_data.IssueCategory.' },
    openAgeBuckets: { name: 'Open ticket age', formula: 'Open (non-terminal) tickets bucketed by days since CreatedAt: Same day, 1-2d, 3-7d, 8-30d, 30d+. Same bands as the Service page’s turnaround-time chart.', source: 'zoho_data (now − CreatedAt).' },
    segment: { name: 'Tickets by segment', formula: 'Tickets grouped by customer / hub segment.', source: 'zoho_data.hub_master_segment.' },
    created7d: { name: 'Created · 7d', formula: 'Tickets created in the last 7 days.', source: 'zoho_data.CreatedAt.' },
    closed7d: { name: 'Closed · 7d', formula: 'Tickets closed in the last 7 days.', source: 'zoho_data.ClosedAt.' },
    openAge: { name: 'Avg open age', formula: 'Average age in days of currently-open tickets — now − CreatedAt, computed in SQL.', source: 'zoho_data (now − CreatedAt).' },
    openTickets: { name: 'Open tickets', formula: 'Tickets not in a terminal status (Closed / Duplicate / Junk).', source: 'zoho_data.' },
    ticketsCount: { name: 'Ticket count', formula: 'All tickets ever recorded (COUNT).', source: 'zoho_data.' },
    // The Overview card's own entry. Kept separate from ticketsCount above
    // (which is Zoho-only and correct for the Numbers page's "Tickets" card):
    // the Overview total sums three systems, so pointing it at ticketsCount
    // had the popover naming one table for a number built from three.
    // Not customersCount: that one documents an unfiltered COUNT(DISTINCT
    // CenterID), and the Overview card counts the rows left AFTER the global
    // filter drawer runs. Same table, different number — worth its own entry
    // rather than a popover that describes a count the card isn't showing.
    ovCustomers: { name: 'Customers',
      formula: 'center_details rows passing the current global filters — a center IS an independent customer; hubs group them under the hub-and-spoke model. Broken down by hub country (top 5 + Others), then by hub segment.',
      source: 'center_details (sole customer source).' },
    allTickets: { name: 'All tickets',
      formula: 'Zoho support tickets + ServiceWRK field-service jobs + TOM CS issues, counted per source and summed. The three outcome taxonomies are deliberately not unified — no shared status exists across them — so each source keeps its own labels under it.',
      source: 'zoho_data (deduped) + servicewrk_Tickets + tom_tickets.' },

    // ── Fleet / device ──
    // fleetStatus/poorSignal/unsynced/firmware (cloud_devices) removed
    // 2026-08-19 along with the Asset-page widgets they documented —
    // cloud_devices data is CDM/Numbers/Raw-Data only now.
    jiraFleetStatus: { name: 'Device status (Jira)',
      formula: 'Jira devices grouped by lifecycle status (Deployed, Store, Hardware, Decommissioned, …). Excludes Issue Type = Task, Epic, or Test.',
      source: 'jira_data (BigQuery), issuetype_name filtered to exclude CONFIG.JIRA_NON_DEVICE_TYPES.' },
    devicesCount: { name: 'Devices',
      formula: 'Count of jira_data devices (deduped by issue_key), excludes Task/Epic/Test housekeeping tickets.',
      source: 'jira_data (BigQuery).' },

    // ── Centers ──
    centersCount: { name: 'Centers',
      formula: 'COUNT(DISTINCT CenterID) — every center, any status (no baseline filter).',
      source: 'center_details (sole center source).' },
    hubs: { name: 'Hubs', formula: 'COUNT(DISTINCT HubID) from center_details.', source: 'center_details.' },
    geo: { name: 'Geographic spread', formula: 'Centers / devices grouped by state (or city).', source: 'center_details.state / city.' },
    deployStatus: { name: 'Deployment / lifecycle status', formula: 'Centers (or assets) grouped by status — active vs ended / lifecycle stage.', source: 'center_details.Status / jira_data.status_name.' },

  function infoDotHtml(key) {
    var m = METRIC_INFO[key];
    if (!m) return '';
    return '<button type="button" class="info-dot" data-metric="' + key +
      '" aria-label="How ' + escapeHtml(m.name) + ' is calculated" tabindex="0">i</button>';
  }

  function setupMetricInfo() {
    var pop = document.createElement('div');
    pop.className = 'info-pop';
    pop.id = 'infoPop';
    pop.setAttribute('role', 'tooltip');
    document.body.appendChild(pop);

    // Inject a dot into every recognised card title (KPI dots come from kpiTile).
    var titles = document.querySelectorAll('.card-title');
    for (var i = 0; i < titles.length; i++) {
      var el = titles[i];
      if (el.querySelector('.info-dot')) continue;
      var key = TITLE_METRIC[(el.textContent || '').trim().toLowerCase()];
      if (key) el.insertAdjacentHTML('beforeend', ' ' + infoDotHtml(key));
    }

    var pinned = false;
    function showPop(dot) {
      var m = METRIC_INFO[dot.getAttribute('data-metric')];
      if (!m) return;
      var head = '<div class="info-pop-head">' +
          (m.code ? '<span class="metric-tag">' + escapeHtml(m.code) + '</span>' : '') +
          '<span class="info-pop-name">' + escapeHtml(m.name) + '</span></div>';
      pop.innerHTML = m.about ?
        head + '<div class="info-pop-row">' + escapeHtml(m.about) + '</div>' :
        head +
        '<div class="info-pop-row"><span class="info-pop-label">How it’s calculated</span>' +
          '<span class="info-pop-formula">' + escapeHtml(m.formula) + '</span></div>' +
        '<div class="info-pop-row"><span class="info-pop-label">Source</span>' + escapeHtml(m.source) + '</div>' +
        (m.note ? '<div class="info-pop-row info-pop-note">' + escapeHtml(m.note) + '</div>' : '');
      pop.classList.add('is-open');
      var r = dot.getBoundingClientRect();
      var pw = pop.offsetWidth, ph = pop.offsetHeight;
      var left = Math.max(12, Math.min(r.left, window.innerWidth - pw - 12));
      var top = r.bottom + 8;
      if (top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
    }
    function hidePop() { pop.classList.remove('is-open'); pinned = false; }

    document.addEventListener('mouseover', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot && !pinned) showPop(dot);
    });
    document.addEventListener('mouseout', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot && !pinned) hidePop();
    });
    document.addEventListener('focusin', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot) showPop(dot);
    });
    document.addEventListener('focusout', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot && !pinned) hidePop();
    });
    document.addEventListener('click', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot) { e.preventDefault(); e.stopPropagation(); pinned = !pinned; if (pinned) showPop(dot); else hidePop(); return; }
      if (pinned && !(e.target.closest && e.target.closest('.info-pop'))) hidePop();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hidePop(); });
    window.addEventListener('resize', hidePop);
  }

  function init() {
    buildKpiSkeletons();
    buildCdmDeviceHeader();
    buildCenterHeader();
    buildServiceHeader();
    buildTomHeader();
    buildSlaRiskHeader();
    setupMetricInfo();
    wireTabs();

    $('refreshBtn').addEventListener('click', function () { refreshAll(true); });
    $('retryBtn').addEventListener('click', function () { loadDashboard(false); });

    // Theme (persisted) — replaces the old auto-refresh toggle.
    applyTheme(localStorage.getItem('sip.theme') || 'dark', false);
    $('themeDark').addEventListener('click', function () { applyTheme('dark', true); });
    $('themeLight').addEventListener('click', function () { applyTheme('light', true); });

    // Sidebar pin (persisted) — unpinned/bubble by default.
    applySidebarPinned(localStorage.getItem('sip.sidebarPinned') === '1', false);
    $('sidebarCollapseBtn').addEventListener('click', function () {
      applySidebarPinned(!document.body.classList.contains('sidebar-pinned'), true);
    });

    // Auto-refresh now runs unconditionally in the background.
    state.autoRefresh = true;
    setInterval(tickCountdown, 1000);

    // Global search — one box drives the active list page. Support has no
    // list to filter, so it's a lookup instead, fired on Enter (not per
    // keystroke — a partial ID mid-type shouldn't trigger a BigQuery call).
    $('globalSearch').addEventListener('input', debounce(function (e) {
      state.search = e.target.value.trim();
      reloadActiveList();
    }, 350));
    $('globalSearch').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && state.activeTab === 'tab-support') {
        e.preventDefault();
        supportSearchLookup_(e.target.value.trim());
      }
    });

    // Global filter drawer (Segment/Status/State/Hub/Date range) — replaces
    // the old per-page Segment dropdowns; one filter set drives every page.
    $('globalFilterBtn').addEventListener('click', function () {
      if ($('filterDrawer').hidden) openFilterDrawer_(); else closeFilterDrawer_();
    });
    $('filterDrawerClose').addEventListener('click', closeFilterDrawer_);
    $('filterScrim').addEventListener('click', function () {
      // Clicking the scrim (not the Apply button) discards pending edits.
      if (!$('filterDrawer').hidden) closeFilterDrawer_();
    });
    // Live badge on the Date range accordion header while the drawer is open
    // (Apply itself re-reads .value directly, so this duplication is harmless).
    ['filterDateFrom', 'filterDateTo'].forEach(function (id) {
      $(id).addEventListener('input', function () {
        state.globalFiltersPending.dateFrom = $('filterDateFrom').value || '';
        state.globalFiltersPending.dateTo = $('filterDateTo').value || '';
        updateFilterGroupCounts_();
      });
    });
    $('filterApplyBtn').addEventListener('click', function () {
      state.globalFiltersPending.dateFrom = $('filterDateFrom').value || '';
      state.globalFiltersPending.dateTo = $('filterDateTo').value || '';
      var changed = !filtersEqual_(state.globalFilters, state.globalFiltersPending);
      state.globalFilters = state.globalFiltersPending;
      closeFilterDrawer_();
      if (changed) commitGlobalFilters_();
    });
    $('filterClearBtn').addEventListener('click', function () {
      state.globalFiltersPending = { segments: [], statuses: ['ACTIVE'], states: [], hubs: [], cities: [], countries: [],
        centers: [],
        deviceTypes: JIRA_DEVICE_TYPE_DEFAULT.slice(), deviceStatusExclude: JIRA_DEVICE_STATUS_EXCLUDE_DEFAULT.slice(),
        billable: [], machineTypes: [], deviceIds: [], macSerialIds: [],
        dateFrom: '', dateTo: '' };
      openFilterDrawer_(true); // re-render the toggle/combos to reflect the cleared state (don't re-snapshot over it)
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !$('filterDrawer').hidden) closeFilterDrawer_();
    });

    $('onboardClose').addEventListener('click', dismissOnboarding_);
    $('onboardGotIt').addEventListener('click', dismissOnboarding_);
    $('onboardScrim').addEventListener('click', dismissOnboarding_);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !$('onboardModal').hidden) dismissOnboarding_();
    });

    $('tomPrevBtn').addEventListener('click', function () {
      state.tom.page = Math.max(0, state.tom.page - 1);
      loadTomTickets();
    });
    $('tomNextBtn').addEventListener('click', function () {
      state.tom.page += 1;
      loadTomTickets();
    });
    $('svcPrevBtn').addEventListener('click', function () {
      state.service.page = Math.max(0, state.service.page - 1);
      loadServiceTickets();
    });
    $('svcNextBtn').addEventListener('click', function () {
      state.service.page += 1;
      loadServiceTickets();
    });
    $('slaRiskPrevBtn').addEventListener('click', function () {
      state.slaRisk.page = Math.max(0, state.slaRisk.page - 1);
      loadSlaRiskTickets();
    });
    $('slaRiskNextBtn').addEventListener('click', function () {
      state.slaRisk.page += 1;
      loadSlaRiskTickets();
    });
    // Band chips: All / Breached / At-risk narrow the worklist server-side.
    ['slaRiskAll', 'slaRiskBreached', 'slaRiskAtrisk'].forEach(function (id) {
      $(id).addEventListener('click', function () {
        state.slaRisk.risk = this.getAttribute('data-risk') || '';
        state.slaRisk.page = 0;
        ['slaRiskAll', 'slaRiskBreached', 'slaRiskAtrisk'].forEach(function (other) {
          $(other).classList.toggle('is-active', other === id);
        });
        loadSlaRiskTickets();
      });
    });
    $('ctrPrevBtn').addEventListener('click', function () {
      state.centers.page = Math.max(0, state.centers.page - 1);
      loadCenters();
    });
    $('ctrNextBtn').addEventListener('click', function () {
      state.centers.page += 1;
      loadCenters();
    });
    $('cdmPrevPageBtn').addEventListener('click', function () {
      state.cdmDevices.page = Math.max(0, state.cdmDevices.page - 1);
      loadCdmDevices();
    });
    $('cdmNextPageBtn').addEventListener('click', function () {
      state.cdmDevices.page += 1;
      loadCdmDevices();
    });
    // Shared center drawer close (button, scrim click, Esc).
    $('centerDrawerClose').addEventListener('click', CenterDetail.close);
    $('centerScrim').addEventListener('click', CenterDetail.close);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !$('centerDrawer').hidden) CenterDetail.close();
    });

    // Clickable ticket-bucket legend on the map. SCOPED to #ticketLegend: the
    // engineer row below reuses .legend-filter for its own toggles, and an
    // unscoped query set ticketBucket from those too — the layer toggle (no
    // data-bucket) blanked it to null and the gap filter set it to 'gap',
    // filtering every center off the map.
    Array.prototype.forEach.call(document.querySelectorAll('#ticketLegend .legend-filter'), function (btn) {
      btn.addEventListener('click', function () {
        var b = btn.getAttribute('data-bucket');
        state.ticketBucket = (state.ticketBucket === b) ? '' : b;
        syncLegendActive();
        applyMapFilters();
      });
    });

    // Engineer layer: show/hide the pins.
    $('fseToggle').addEventListener('click', function () {
      state.fseVisible = !state.fseVisible;
      $('fseToggle').setAttribute('aria-pressed', String(state.fseVisible));
      mainMap.setFseVisible(state.fseVisible);
      if (!state.fseVisible) setFseFocusBar_(null);
    });

    $('cpToggle').addEventListener('click', function () {
      state.cpVisible = !state.cpVisible;
      $('cpToggle').setAttribute('aria-pressed', String(state.cpVisible));
      mainMap.setCpVisible(state.cpVisible);
      if (!state.cpVisible) setCpFocusBar_(null);
    });

    // Coverage gaps: centers with open tickets that no engineer has worked in
    // the window. Re-filters the center set rather than restyling, so the map
    // shows the gap list and nothing else.
    $('fseGapFilter').addEventListener('click', function () {
      state.mapGapsOnly = !state.mapGapsOnly;
      $('fseGapFilter').setAttribute('aria-pressed', String(state.mapGapsOnly));
      applyMapFilters();
    });

    // Escape routes out of focus mode, all three of them: this button, Esc
    // (below), and re-clicking the focused pin (handled in MapView).
    $('fseFocusClear').addEventListener('click', function () {
      mainMap.clearFseFocus();
      setFseFocusBar_(null);
    });
    $('cpFocusClear').addEventListener('click', function () {
      mainMap.clearCpFocus();
      setCpFocusBar_(null);
    });
    document.addEventListener('keydown', function (event) {
      // Ordered after the drawer's own Escape handler above: with the drawer
      // open, Escape should close the drawer and leave the engineer/dealer
      // focused, which is why this checks the drawer is already shut.
      if (event.key !== 'Escape' || !$('centerDrawer').hidden) return;
      if (!$('fseFocusBar').hidden) { mainMap.clearFseFocus(); setFseFocusBar_(null); }
      if (!$('cpFocusBar').hidden) { mainMap.clearCpFocus(); setCpFocusBar_(null); }
    });

    window.addEventListener('hashchange', applyHashRoute);

    // center_details raw-data table pager.
    $('cdRawPrev').addEventListener('click', function () {
      if (state.cdRaw.page > 0) { state.cdRaw.page -= 1; loadCdRaw(); }
    });
    $('cdRawNext').addEventListener('click', function () {
      var maxPage = Math.max(0, Math.ceil(state.cdRaw.total / state.cdRaw.pageSize) - 1);
      if (state.cdRaw.page < maxPage) { state.cdRaw.page += 1; loadCdRaw(); }
    });

    // Raw Data page: source pills, page size, pager, export.
    Array.prototype.forEach.call($('rawSourcePills').querySelectorAll('.raw-pill'), function (pill) {
      pill.addEventListener('click', function () {
        if (pill.classList.contains('is-active')) return;
        Array.prototype.forEach.call($('rawSourcePills').querySelectorAll('.raw-pill'), function (p) {
          p.classList.remove('is-active');
        });
        pill.classList.add('is-active');

    // including defaults the user didn't explicitly set.
    renderFilterBadge_();
    renderFilterChips_();

    updateSearchPlaceholder();
    refreshAll(false);
    applyHashRoute(); // deep-link support: #overview, #asset, …
    maybeShowOnboarding_();

  /** Reloads whichever list the active tab shows, honouring global filters. */
  function reloadActiveList() {
    if (state.activeTab === 'tab-centers') { state.centers.page = 0; loadCenters(); }
    else if (state.activeTab === 'tab-service') { state.service.page = 0; loadServiceTickets(); }
    else if (state.activeTab === 'tab-tom') { state.tom.page = 0; loadTomTickets(); }
    else if (state.activeTab === 'tab-overview') applyMapFilters();
    else if (state.activeTab === 'tab-topcust') renderTcTable(topCustFilteredRows());
    else if (state.activeTab === 'tab-cdm') { state.cdmDevices.page = 0; loadCdmDevices(); }
  }

  function updateSearchPlaceholder() {
    var info = SEARCH_TAB_INFO[state.activeTab] || {};
    var input = $('globalSearch');
    input.placeholder = info.placeholder || 'Search centers, devices, hubs, serials…';
    input.disabled = !!info.disabled;
    if (input.disabled) { input.value = ''; state.search = ''; }
  }

  /**
   * Support/CS search: not a list filter (there's no per-ticket/per-center
   * list on this page) — a lookup. Tries the query as a CenterID, then as a
   * Zoho ticket number, and opens the one shared center-detail drawer either
   * way. Toasts on no match so the box is never silently a no-op.
   */
  function supportSearchLookup_(query) {
    if (!query) return;
    gsCall(ep('apiSupportSearch'), { query: query })
      .then(function (result) {
        if (result.kind === 'center') {
          CenterDetail.open([result.centerId, '', 0, 0, 0, 0, 0, 0]);
        } else if (result.kind === 'ticket') {
          CenterDetail.open([result.centerId, '', 0, 0, 0, 0, 0, 0], { ticketNumber: result.ticketNumber });
        } else {
          toast('No match for "' + query + '"', 'error');
        }
      })
      .catch(function (err) {
        toast('Search failed: ' + err.message, 'error');
      });
  }

  function syncLegendActive() {
    // #ticketLegend only — see the scoping note on the click wiring. An
    // unscoped loop here also stamped aria-pressed="false" onto the engineer
    // toggles, silently un-pressing them whenever a bucket was clicked.
    Array.prototype.forEach.call(document.querySelectorAll('#ticketLegend .legend-filter'), function (btn) {
      btn.setAttribute('aria-pressed', String(btn.getAttribute('data-bucket') === state.ticketBucket));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

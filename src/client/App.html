  /* ── helpers ─────────────────────────────────────────────────── */
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function countUp(el, target) {
    if (REDUCED_MOTION || !isFinite(target) || target === 0) {
      el.textContent = FMT.format(target || 0);
      return;
    }
    var start = performance.now(), duration = 600;
    function frame(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = FMT.format(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /**
   * BigQuery returns LastTimeStamp as "…+00" but the value is IST wall-time
   * (see docs/SOURCES.md) — strip the zone suffix and parse as local time.
   */
  function relTime(tsText) {
    if (!tsText) return '—';
    var localish = String(tsText).replace(/(\+|-)\d\d(:?\d\d)?$/, '').replace(' ', 'T');
    var then = new Date(localish);
    if (isNaN(then)) return tsText;
    var mins = Math.round((Date.now() - then.getTime()) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    if (mins < 1440) return Math.round(mins / 60) + 'h ago';
    return Math.round(mins / 1440) + 'd ago';
  }

  function setKpi(id, value, subText) {

  /** Sets a KPI to a string, count-up animating a leading number + suffix (e.g. "98.9%"). */
  function setKpiText(id, text, subText) {
    var tile = $(id);
    if (!tile) return;
    tile.classList.remove('is-loading');
    countUpText(tile.querySelector('.kpi-value'), text == null ? '—' : String(text));
    if (subText) tile.querySelector('.kpi-sub').textContent = subText;
  }

  /** Animates a "<number><suffix>" string (e.g. "98.9%", "3.2y"); preserves decimals + suffix. */
  function countUpText(el, text) {
    var m = /^(-?\d[\d,]*\.?\d*)(.*)$/.exec(text);
    if (REDUCED_MOTION || !m) { el.textContent = text; return; }
    var target = parseFloat(m[1].replace(/,/g, '')), suffix = m[2];
    var decimals = (m[1].split('.')[1] || '').length;
    if (!isFinite(target) || target === 0) { el.textContent = text; return; }
    var start = performance.now(), duration = 600;
    function frame(now) {
      var t = Math.min(1, (now - start) / duration), eased = 1 - Math.pow(1 - t, 3), v = target * eased;
      el.textContent = (decimals ? v.toFixed(decimals) : FMT.format(Math.round(v))) + suffix;
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  }

  /**
   * Batch-cohort failure analysis (M-A3 First-Time-Failure + M-A5 Batch
   * Failure Detection). Draws the combo chart, the detail table and the
   * "batch signal" callout for the cohort that most warrants attention.
   */
  function renderCohort(rows) {
    Charts.cohort(rows);

    var body = $('cohortTable').querySelector('tbody');
    var signal = $('cohortSignal');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="7" class="chart-empty">No cohort data yet</td></tr>';
      signal.innerHTML = '<p class="batch-signal-empty">No batch data yet</p>';
      return;
    }

    // Fleet-mean FTF rate → flag cohorts materially above it (batch anomaly).
    var mean = rows.reduce(function (a, r) { return a + (r.ftf_rate_pct || 0); }, 0) / rows.length;
    var flagAt = mean + 5;

    body.innerHTML = rows.map(function (r) {
      var ftf = r.ftf_rate_pct || 0;
      var sev = ftf >= flagAt ? 'danger' : (ftf >= mean ? 'warn' : 'ok');
      var ttff = r.median_ttff_days == null ? '—' : humanDays(r.median_ttff_days);
      var flagged = ftf >= flagAt;
      return '<tr' + (flagged ? ' class="row-flagged"' : '') + '>' +
        '<td><strong>' + escapeHtml(r.batch_year) + '</strong>' +
          (flagged ? ' <span class="badge badge-danger">watch</span>' : '') + '</td>' +
        '<td class="num">' + FMT.format(r.devices || 0) + '</td>' +
        '<td class="num"><span class="badge badge-' + sev + '">' + escapeHtml(ftf) + '%</span></td>' +
        '<td class="num">' + ttff + '</td>' +
        '<td class="num">' + FMT.format(r.early_fails || 0) + '</td>' +
        '<td class="num">' + escapeHtml(r.avg_failures == null ? '—' : r.avg_failures) + '</td>' +
        '<td>' + escapeHtml(r.top_issue || '—') + '</td>' +
        '</tr>';
    }).join('');

    // Batch signal = highest-FTF cohort (min 30 devices so it is meaningful).
    var candidates = rows.filter(function (r) { return (r.devices || 0) >= 30; });
    var worst = (candidates.length ? candidates : rows).reduce(function (a, b) {
      return (b.ftf_rate_pct || 0) > (a.ftf_rate_pct || 0) ? b : a;
    });
    // Semantic colour: only red when genuinely above the fleet's flag threshold.
    var wsev = (worst.ftf_rate_pct || 0) >= flagAt ? 'danger'
      : ((worst.ftf_rate_pct || 0) >= mean ? 'warn' : 'ok');
    signal.innerHTML =
      '<div class="batch-signal-year">' + escapeHtml(worst.batch_year) + ' batch</div>' +
      '<div class="batch-signal-rate sev-' + wsev + '">' + escapeHtml(worst.ftf_rate_pct || 0) + '%' +
        '<span class="batch-signal-label">first-time-failure rate</span></div>' +
      '<dl class="batch-signal-meta">' +
        '<div><dt>Devices</dt><dd>' + FMT.format(worst.devices || 0) + '</dd></div>' +
        '<div><dt>Median TTFF</dt><dd>' + (worst.median_ttff_days == null ? '—' : humanDays(worst.median_ttff_days)) + '</dd></div>' +
        '<div><dt>Failures/device</dt><dd>' + escapeHtml(worst.avg_failures == null ? '—' : worst.avg_failures) + '</dd></div>' +
      '</dl>' +
      '<div class="batch-signal-issue">Leading cause · <strong>' + escapeHtml(worst.top_issue || '—') + '</strong></div>';
  }

  /**
   * SLA compliance (CS-team catalog): the within-SLA callout + Tech/Non-Tech
   * split bars, plus the worst-issue-types breach table.
   */
  function renderSla(kpisArr, byType) {
    var k = (kpisArr && kpisArr[0]) || null;
    var el = $('slaCompliance');
    if (el) {
      if (!k || k.resolved_n == null) {
        el.innerHTML = '<p class="batch-signal-empty">No SLA data yet</p>';
      } else {
        var sev = slaSev(k.within_pct);
        el.innerHTML =
          '<div class="sla-pct sev-' + sev + '">' + slaPctText(k.within_pct) +
            '<span class="sla-pct-label">resolved within SLA</span></div>' +
          '<div class="sla-split">' + slaBar('Tech', k.within_tech) + slaBar('Non-Tech', k.within_nontech) + '</div>' +
          '<dl class="batch-signal-meta sla-meta">' +
            '<div><dt>Resolved</dt><dd>' + FMT.format(k.resolved_n || 0) + '</dd></div>' +
            '<div><dt>Open breached</dt><dd class="txt-danger">' + FMT.format(k.breached_open || 0) + '</dd></div>' +
            '<div><dt>At-risk</dt><dd class="txt-warn">' + FMT.format(k.atrisk_open || 0) + '</dd></div>' +
          '</dl>' +
          '<div class="sla-foot">Avg resolution · <strong>' +
            (k.avg_res_days == null ? '—' : k.avg_res_days + ' days') + '</strong></div>';
      }
    }

    var body = $('slaTypeTable').querySelector('tbody');
    if (!byType || !byType.length) {
      body.innerHTML = '<tr><td colspan="6" class="chart-empty">No SLA breakdown yet</td></tr>';
      return;
    }
    body.innerHTML = byType.map(function (r) {
      var bp = r.breach_pct || 0;
      var sev = bp >= 60 ? 'danger' : (bp >= 30 ? 'warn' : 'ok');
      return '<tr>' +
        '<td><strong>' + escapeHtml(r.category) + '</strong></td>' +
        '<td><span class="badge ' + (r.is_tech ? 'badge-info' : 'badge-muted') + '">' +
          (r.is_tech ? 'Tech' : 'Non-Tech') + '</span></td>' +
        '<td class="num">' + escapeHtml(r.sla_days) + 'd</td>' +
        '<td class="num">' + FMT.format(r.tickets || 0) + '</td>' +
        '<td class="num"><span class="badge badge-' + sev + '">' + slaPctText(bp) + '</span></td>' +
        '<td class="num">' + (r.avg_res_days == null ? '—' : r.avg_res_days) + '</td>' +
        '</tr>';
    }).join('');
  }

  /** Within-SLA severity band: ok ≥85, warn ≥70, else danger. */
  function slaSev(p) { return p >= 85 ? 'ok' : (p >= 70 ? 'warn' : 'danger'); }
  function slaPctText(p) { return (p == null ? '—' : p + '%'); }
  function slaBar(label, pct) {
    var v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
    return '<div class="sla-bar-row">' +
      '<span class="sla-bar-label">' + label + '</span>' +
      '<span class="sla-bar-track"><span class="sla-bar-fill sev-' + slaSev(pct || 0) +
        '" style="width:' + v + '%"></span></span>' +
      '<span class="sla-bar-val">' + slaPctText(pct) + '</span></div>';
  }

  /** Compact day count → "18mo" / "2.1y" / "42d". */
  function humanDays(d) {
    d = Number(d);
    if (!isFinite(d)) return '—';
    if (d >= 365) return (d / 365).toFixed(1) + 'y';
    if (d >= 60) return Math.round(d / 30) + 'mo';
    return Math.round(d) + 'd';
  }

  /** Wires rows carrying data-cid to open the center drawer by center id. */
  function wireCenterRowClicks(tableEl) {
    Array.prototype.forEach.call(tableEl.querySelectorAll('tr.is-clickable[data-cid]'), function (tr) {
      var cid = parseInt(tr.getAttribute('data-cid'), 10);
      function go() { CenterDetail.open([cid, 'Center #' + cid, 0, 0, 0, 0, 0, 0]); }
      tr.addEventListener('click', go);
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  function renderCsOwners(rows) {
    var body = $('csOwnerTable').querySelector('tbody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="3"><div class="chart-empty" style="padding:24px 0">CS tracker sheet not available</div></td></tr>';
      return;
    }
    body.innerHTML = rows.map(function (r) {
      return '<tr>' +
        '<td>' + escapeHtml(r.owner) + '</td>' +

  /* ── device explorer (Asset view) ────────────────────────────── */
  var DEVICE_COLUMNS = [
    { key: 'device', label: 'Device', sortable: true },
    { key: 'status', label: 'Status', sortable: false },
    { key: 'center', label: 'Center', sortable: true },
    { key: 'hub', label: 'Hub', sortable: true },
    { key: 'last_seen', label: 'Last seen', sortable: true, num: true },
    { key: 'battery', label: 'Battery', sortable: true, num: true },
    { key: 'csq', label: 'CSQ', sortable: true, num: true },
    { key: 'unsynced', label: 'Unsynced', sortable: true, num: true },
    { key: 'firmware', label: 'Firmware', sortable: false }
  ];

  var STATUS_BADGES = {
    'Live (<1h)': 'ok', 'Online (<24h)': 'info', 'Idle (1-7d)': 'warn',
    'Offline (7-30d)': 'warn', 'Dark (>30d)': 'danger', 'Never seen': 'muted'
  };

  function sortableHeader(col, sort) {
    var cls = col.num ? ' class="num"' : '';
    if (!col.sortable) return '<th scope="col"' + cls + '>' + col.label + '</th>';
    var sorted = sort.sortBy === col.key;
    var aria = sorted ? (sort.sortDir === 'asc' ? 'ascending' : 'descending') : 'none';
    return '<th scope="col"' + cls + ' aria-sort="' + aria + '">' +
      '<button type="button" class="th-sort" data-sort="' + col.key + '" aria-sort="' + aria + '">' +
      col.label +
      '<svg class="sort-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</button></th>';
  }

  function buildDeviceHeader() {
    $('deviceTableHead').innerHTML = DEVICE_COLUMNS.map(function (col) {
      return sortableHeader(col, state.devices);
    }).join('');
    Array.prototype.forEach.call($('deviceTableHead').querySelectorAll('.th-sort'), function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-sort');
        if (state.devices.sortBy === key) {
          state.devices.sortDir = state.devices.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.devices.sortBy = key;
          state.devices.sortDir = 'desc';
        }
        state.devices.page = 0;
        buildDeviceHeader();
        loadDevices();
      });
    });
  }

  function buildStatusChips() {
    var chips = ['All'].concat(Charts.FLEET_ORDER);
    $('statusChips').innerHTML = chips.map(function (name) {
      var value = name === 'All' ? '' : name;
      var pressed = state.devices.status === value ? 'true' : 'false';
      return '<button type="button" class="chip" data-status="' + escapeHtml(value) + '" aria-pressed="' + pressed + '">' + name + '</button>';
    }).join('');
    Array.prototype.forEach.call($('statusChips').querySelectorAll('.chip'), function (chip) {
      chip.addEventListener('click', function () {
        setStatusFilter(chip.getAttribute('data-status'));
      });
    });
  }

  function setStatusFilter(value) {
    state.devices.status = value || '';
    state.devices.page = 0;
    buildStatusChips();
    loadDevices();
  }

  var devicesRequestId = 0;
  function loadDevices() {
    var requestId = ++devicesRequestId;
    $('deviceTableInfo').textContent = 'Loading…';
    var query = Object.assign({}, state.devices, { hub: state.hub, search: state.search });
    gsCall('apiGetDevices', query)
      .then(function (result) {
        if (requestId !== devicesRequestId) return;
        state.deviceRows = result.rows;
        state.deviceTotal = result.totalRows;
        renderDeviceTable();
      })
      .catch(function (err) {
        if (requestId !== devicesRequestId) return;
        $('deviceTableInfo').textContent = 'Failed to load devices';
        toast('Device list failed: ' + err.message, 'error');
      });
  }

  function renderDeviceTable() {
    var body = $('deviceTable').querySelector('tbody');
    if (!state.deviceRows.length) {
      body.innerHTML = '<tr><td colspan="' + DEVICE_COLUMNS.length + '">' +
        '<div class="chart-empty" style="padding:32px 0">' +
        '<strong>No devices match</strong><span>Try clearing the search or status filter</span>' +
        '</div></td></tr>';
    } else {
      body.innerHTML = state.deviceRows.map(function (r) {
        var badge = STATUS_BADGES[r.status] || 'muted';
        var batteryText = r.battery === '' ? '—' :
          (isNaN(parseInt(r.battery, 10)) ? r.battery : parseInt(r.battery, 10) + '%');
        return '<tr>' +
          '<td><strong>' + escapeHtml(r.device) + '</strong></td>' +
          '<td><span class="badge badge-' + badge + '">' + escapeHtml(r.status) + '</span></td>' +
          '<td>' + escapeHtml(r.center || '—') + '</td>' +
          '<td>' + escapeHtml(r.hub || '—') + '</td>' +
          '<td class="num" title="' + escapeHtml(r.last_seen || '') + '">' + relTime(r.last_seen) + '</td>' +
          '<td class="num">' + escapeHtml(batteryText) + '</td>' +
          '<td class="num">' + (r.csq == null ? '—' : escapeHtml(r.csq)) + '</td>' +
          '<td class="num">' + (r.unsynced == null ? '—' : escapeHtml(r.unsynced)) + '</td>' +
          '<td>' + escapeHtml(r.firmware || '—') + '</td>' +
          '</tr>';
      }).join('');
    }
    renderPager(state.deviceTotal, state.devices, 'deviceTableInfo', 'pageIndicator', 'prevPageBtn', 'nextPageBtn', 'devices');

  var CENTER_COLUMNS = [
    { key: 'center', label: 'Center', sortable: true },

    { key: 'hub', label: 'Hub', sortable: false },
    { key: 'city', label: 'City', sortable: false },
    { key: 'state', label: 'State', sortable: true },
    { key: 'devices', label: 'Devices', sortable: true, num: true },
    { key: 'online', label: 'Online', sortable: true, num: true },
    { key: 'open_tickets', label: 'Open tickets', sortable: true, num: true },
    { key: 'last_seen', label: 'Last heartbeat', sortable: true, num: true }
  ];

  function buildCenterHeader() {
    $('centerTableHead').innerHTML = CENTER_COLUMNS.map(function (col) {
      return sortableHeader(col, state.centers);
    }).join('');
    Array.prototype.forEach.call($('centerTableHead').querySelectorAll('.th-sort'), function (btn) {
      btn.addEventListener('click', function () {

        if (state.centers.sortBy === key) {

  var centersRequestId = 0;
  function loadCenters() {
    var requestId = ++centersRequestId;

    var query = Object.assign({}, state.centers, { hub: state.hub, search: state.search, segment: state.segment, activeOnly: state.activeOnly });

  function renderCenterTable() {

          '<td><strong>' + escapeHtml(r.center || '—') + '</strong></td>' +
          '<td class="num">' + escapeHtml(r.center_id) + '</td>' +
          '<td>' + escapeHtml(r.hub || '—') + '</td>' +
          '<td>' + escapeHtml(r.city || '—') + '</td>' +
          '<td>' + escapeHtml(r.state || '—') + '</td>' +
          '<td class="num">' + FMT.format(r.devices || 0) + '</td>' +
          '<td class="num">' + FMT.format(r.online || 0) + '</td>' +
          '<td class="num"><span class="badge badge-' + ticketBadge + '">' + FMT.format(r.open_tickets || 0) + '</span></td>' +
          '<td class="num" title="' + escapeHtml(r.last_seen || '') + '">' + relTime(r.last_seen) + '</td>' +
          '</tr>';
      }).join('');
      Array.prototype.forEach.call($('centerTable').querySelectorAll('tr.is-clickable'), function (tr) {
        function go() { openCenterRow(state.centerRows[parseInt(tr.getAttribute('data-row'), 10)]); }
        tr.addEventListener('click', go);

      });

    renderPager(state.centerTotal, state.centers, 'centerTableInfo', 'ctrPageIndicator', 'ctrPrevBtn', 'ctrNextBtn', 'centers');
  }

  function renderPager(total, pageState, infoId, indicatorId, prevId, nextId, noun) {
    var from = total === 0 ? 0 : pageState.page * pageState.pageSize + 1;
    var to = Math.min(total, (pageState.page + 1) * pageState.pageSize);
    $(infoId).textContent = 'Showing ' + FMT.format(from) + '–' + FMT.format(to) +
      ' of ' + FMT.format(total) + ' ' + noun;
    var totalPages = Math.max(1, Math.ceil(total / pageState.pageSize));
    $(indicatorId).textContent = (pageState.page + 1) + ' / ' + totalPages;
    $(prevId).disabled = pageState.page === 0;
    $(nextId).disabled = pageState.page + 1 >= totalPages;
  }

  function exportCsv() {
    if (!state.deviceRows.length) { toast('Nothing to export yet', 'error'); return; }
    var cols = DEVICE_COLUMNS.map(function (c) { return c.key; });
    var lines = [cols.join(',')].concat(state.deviceRows.map(function (row) {
      return cols.map(function (key) {
        var cell = String(row[key] == null ? '' : row[key]);
        return /[",\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell;
      }).join(',');
    }));
    var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'sip-devices-page' + (state.devices.page + 1) + '.csv';
    link.click();
    URL.revokeObjectURL(link.href);
    toast('CSV exported (current page)', 'ok');
  }

  /* ── map view ────────────────────────────────────────────────── */
  function humanAge(days) {
    if (days == null || !isFinite(days)) return '—';
    if (days < 90) return days + 'd';
    if (days < 730) return Math.round(days / 30.4) + ' mo';
    return (days / 365).toFixed(1) + ' yr';
  }

  /**
   * Center Age display rule: ≥ 12 months → years to 1 decimal (13mo → 1.1 years);
   * below 12 months → whole months. Used everywhere Center Age is shown.
   */
  function centerAge(months) {
    if (months == null || !isFinite(months)) return '—';
    return months >= 12 ? (months / 12).toFixed(1) + ' years' : Math.round(months) + ' months';
  }

  // Compact center array indices (must match Api.js apiGetMapData).
  var CI = { id: 0, name: 1, lat: 2, lng: 3, devices: 4, online: 5, tickets: 6, assets: 7, hub: 8, hubId: 9, segment: 10, state: 11 };
  // Compact asset array indices.
  var AI = { center: 0, type: 1, cat: 2, age: 3, serial: 4 };

  function loadMapData() {
    $('geoProgress').textContent = 'Loading map data…';
    gsCall(ep('apiGetMapData'), { activeOnly: state.activeOnly })
      .then(function (payload) {
        state.mapLoaded = true;
        state.mapBundle = payload;
        applyMapFilters();
        var geo = payload.geo || {};
        $('geoProgress').textContent =
          FMT.format(payload.centers.length) + ' centers on map · located ' +
          FMT.format(geo.located || 0) + ' of ' + FMT.format(geo.total || 0) + ' locations' +
          (geo.pending ? ' · ' + FMT.format(geo.pending) + ' pending — run runGeocodeBatch() in the editor' : ' · geocoding complete');
      })
      .catch(function (err) {
        $('geoProgress').textContent = 'Map data failed: ' + err.message;
        toast('Map data failed: ' + err.message, 'error');
      });
  }

  /** Populates a <select>, preserving the current selection if still present. */
  function fillSelect(id, values, allLabel) {
    var el = $(id);
    if (!el) return;
    var cur = el.value;
    el.innerHTML = '<option value="">' + allLabel + '</option>' +
      values.map(function (v) { return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>'; }).join('');
    el.value = cur;
  }

  /** Applies the global filters to the map centers + assets, then redraws. */
  function applyMapFilters() {
    if (!state.mapBundle) return;
    var q = state.search.toLowerCase().trim();

    // Serial/device search: which center IDs contain a matching asset?
    var serialCenterIds = null;
    if (q) {
      serialCenterIds = {};
      state.mapBundle.assets.forEach(function (a) {
        if (String(a[AI.serial]).toLowerCase().indexOf(q) !== -1) serialCenterIds[a[AI.center]] = true;
      });
    }

    var centers = state.mapBundle.centers.filter(function (c) {
      if (state.hub && c[CI.hub] !== state.hub) return false;
      if (state.segment && c[CI.segment] !== state.segment) return false;
      var ot = c[CI.tickets] || 0;
      if (state.ticketBucket === 'none' && ot !== 0) return false;
      if (state.ticketBucket === 'low' && !(ot >= 1 && ot <= 3)) return false;
      if (state.ticketBucket === 'high' && ot < 4) return false;
      if (q) {
        var textHit = String(c[CI.name]).toLowerCase().indexOf(q) !== -1 ||
          String(c[CI.id]).indexOf(q) !== -1 ||
          String(c[CI.hub]).toLowerCase().indexOf(q) !== -1 ||
          String(c[CI.hubId]).indexOf(q) !== -1 ||
          (serialCenterIds && serialCenterIds[c[CI.id]]);
        if (!textHit) return false;
      }
      return true;
    });

    var keepIds = {};
    centers.forEach(function (c) { keepIds[c[CI.id]] = true; });
    var assets = state.mapBundle.assets.filter(function (a) { return keepIds[a[AI.center]]; });

    mainMap.setData(centers, CenterDetail.open);
    renderMapKpis(centers, assets);
    renderMapCharts(centers, assets);
  }

  function renderMapKpis(centers, assets) {
    var devices = 0, online = 0, tickets = 0;
    centers.forEach(function (c) { devices += c[CI.devices]; online += c[CI.online]; tickets += c[CI.tickets]; });
    setKpi('mapCenters', centers.length, 'on the map');
    setKpi('mapDevices', devices, FMT.format(online) + ' online (24h)');
    setKpi('mapTickets', tickets, 'open across shown centers');
    setKpi('mapAssets', assets.length, 'Jira assets on shown centers');
  }

  function renderMapCharts(centers, assets) {
    var types = state.mapBundle.assetTypes, cats = state.mapBundle.assetCats;
    Charts.assetByType(topCounts(assets, function (a) { return types[a[AI.type]]; }, 10));
    Charts.assetByCategory(topCounts(assets, function (a) { return cats[a[AI.cat]]; }, 10));
    Charts.assetAge(bandCounts(assets, function (a) { return ageBand(a[AI.age]); }, Charts));
    Charts.centersByState(topCounts(centers, function (c) { return c[CI.state] || 'Unknown'; }, 12));
  }

  function ageBand(days) {
    if (days == null) return 'Unknown';
    if (days < 182) return '<6 mo';
    if (days < 365) return '6-12 mo';
    if (days < 730) return '1-2 yr';
    if (days < 1095) return '2-3 yr';
    if (days < 1825) return '3-5 yr';
    return '5+ yr';
  }

  /** Aggregate rows by a key function → sorted [{label,cnt}] top-N. */
  function topCounts(rows, keyFn, limit) {
    var map = {};
    rows.forEach(function (r) { var k = keyFn(r) || 'Other'; map[k] = (map[k] || 0) + 1; });
    return Object.keys(map)
      .map(function (k) { return { label: k, cnt: map[k] }; })
      .sort(function (a, b) { return b.cnt - a.cnt; })
      .slice(0, limit);
  }

  /** Like topCounts but keeps every band (no top-N, no sort by count). */
  function bandCounts(rows, keyFn) {
    var map = {};
    rows.forEach(function (r) { var k = keyFn(r); map[k] = (map[k] || 0) + 1; });
    return Object.keys(map).map(function (k) { return { label: k, cnt: map[k] }; });
  }

  function statBox_(value, label) {
    return '<div class="stat-box"><div class="v">' +
      FMT.format(value || 0) + '</div><div class="l">' + label + '</div></div>';
  }
  function dt_(label, value) {
    return '<dt>' + label + '</dt><dd>' + value + '</dd>';
  }

  /**
   * The single app-level center-detail drawer, opened from map markers and
   * Center 360 rows. `c` is a compact array [id, name, ?, ?, devices, online,
   * open_tickets, assets].
   */
  function makeCenterDetail(ids) {
    function open(c) {
      $(ids.panel).hidden = false;
      if (ids.scrim) $(ids.scrim).hidden = false;
      $(ids.title).textContent = c[1];
      $(ids.sub).textContent = 'Center #' + c[0];
      $(ids.body).innerHTML = '<div class="chart-empty" style="padding:32px 0">Loading details…</div>';
      $(ids.body).scrollTop = 0;
      gsCall(ep('apiGetCenterDetail'), { centerId: c[0] })
        .then(function (detail) { renderInto(c, detail); })
        .catch(function (err) {
          $(ids.body).innerHTML = '<div class="chart-empty" style="padding:32px 0">Failed: ' + escapeHtml(err.message) + '</div>';
        });
    }

    function renderInto(c, d) {
      var info = d.info || {};
      var tix = d.tickets || {};
      $(ids.title).textContent = info.center || c[1];
      $(ids.sub).textContent = 'Center #' + c[0] +
        (info.city ? ' · ' + info.city : '') + (info.state ? ', ' + info.state : '');

      // "Devices" = Jira devices mapped to this center by Summary serial
      // (d.assets, from getAssetIndex_) — NOT cloud_devices telemetry.
      var jiraDevCount = d.assets ? d.assets.length : (c[7] || 0);
      var oldest = d.assets && d.assets.length ? d.assets[0] : null;
      var html =
        '<div class="detail-grid">' +
        statBox_(jiraDevCount, 'Devices') +
        statBox_(tix.open_tickets != null ? tix.open_tickets : c[6], 'Open tickets') +
        statBox_(tix.total_tickets != null ? tix.total_tickets : '—', 'Tickets lifetime') +
        '</div>';

      if (oldest) {
        html += '<div class="first-asset"><strong>First asset:</strong> ' +
          escapeHtml(oldest.serial || oldest.summary) + ' (' + escapeHtml(oldest.type) + ') · ' +
          'born ' + escapeHtml(oldest.birthday || '—') + ' · age ' + humanAge(oldest.age_days) + '</div>';
      }

      html += '<dl class="detail-list">' +
        dt_('Hub', (info.hub || '—') + (info.hub_id != null ? ' · #' + info.hub_id : '')) +
        dt_('Segment', tix.segment || '—') +
        dt_('Center age', info.age_months != null
          ? centerAge(info.age_months) + ' (first deployment ' + (info.first_deployment || '—') + ')' : '—') +
        dt_('Location', [info.city, info.state, info.pin, info.country]
          .filter(Boolean).map(escapeHtml).join(', ') || '—') +
        '</dl>';

      if (d.openTickets && d.openTickets.length) {
        html += '<div class="panel-section-title">Open tickets (' + d.openTickets.length + ')</div>' +
          '<div class="ticket-list">' +
          d.openTickets.map(function (t) {
            var pc = /high/i.test(t.priority) ? 'danger' : (/medium/i.test(t.priority) ? 'warn' : (/low/i.test(t.priority) ? 'ok' : 'muted'));
            var safe = /^https:\/\//i.test(t.link) ? t.link : '';
            var inner =
              '<div class="ticket-row-top"><span class="ticket-id">#' + escapeHtml(t.ticket) +
              ' · ' + escapeHtml(t.status) + '</span>' +
              '<span class="badge badge-' + pc + '">' + escapeHtml(t.priority) + '</span></div>' +
              '<div class="ticket-subj">' + escapeHtml(t.subject) + '</div>';
            return safe
              ? '<a class="ticket-row" href="' + escapeHtml(safe) + '" target="_blank" rel="noopener noreferrer" title="Open ticket #' + escapeHtml(t.ticket) + ' in Zoho Desk">' +
                inner +
                '<svg class="ticket-ext" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>'
              : '<div class="ticket-row">' + inner + '</div>';
          }).join('') +
          '</div>';
      }

      if (d.assets && d.assets.length) {
        html += '<div class="panel-section-title">Jira devices (' + d.assets.length + ', oldest first)</div>' +
          '<div class="table-scroll"><table class="assets-table">' +
          '<thead><tr><th>Key</th><th>Serial</th><th>Type</th><th>Category</th><th class="num">Age</th><th>Since</th></tr></thead><tbody>' +
          d.assets.map(function (asset) {
            var keyCell = asset.key
              ? '<a href="' + escapeHtml(JIRA_BROWSE + encodeURIComponent(asset.key)) +
                '" target="_blank" rel="noopener noreferrer" title="Open ' + escapeHtml(asset.key) + ' in Jira">' +
                escapeHtml(asset.key) + '</a>'
              : '—';
            return '<tr><td>' + keyCell + '</td>' +
              '<td>' + escapeHtml(asset.serial || asset.summary) + '</td>' +
              '<td>' + escapeHtml(asset.type) + '</td>' +
              '<td>' + escapeHtml(asset.category) + '</td>' +
              '<td class="num">' + humanAge(asset.age_days) + '</td>' +
              '<td>' + escapeHtml(asset.birthday || '—') + '</td></tr>';
          }).join('') +
          '</tbody></table></div>';
      } else {
        html += '<div class="panel-section-title">Jira devices</div>' +
          '<p class="card-sub">No Jira devices are linked to this center yet.</p>';
      }

      $(ids.body).innerHTML = html;
    }

    /** Opens the same drawer for a customer (hub): rollup + its centers. */
    function openCustomer(cust, centersOfHub) {
      $(ids.panel).hidden = false;
      if (ids.scrim) $(ids.scrim).hidden = false;
      $(ids.title).textContent = cust.hub;
      $(ids.sub).textContent = 'Hub #' + cust.hub_id + ' · ' + (cust.tier || 'customer');
      $(ids.body).scrollTop = 0;
      var onlinePct = cust.devices ? Math.round((cust.online / cust.devices) * 100) : 0;
      var html =
        '<div class="detail-grid">' +
        statBox_(cust.centers, 'Centers') +
        statBox_(cust.devices, 'Devices') +
        statBox_(cust.online, 'Online 24h') +
        statBox_(cust.open_tickets, 'Open tickets') +
        '</div>' +
        '<dl class="detail-list">' +
        dt_('Jira assets', FMT.format(cust.assets || 0)) +
        dt_('Online rate', onlinePct + '%') +
        '</dl>';
      // Only centers WITH open tickets (per request), most open first.
      var withOpen = (centersOfHub || []).filter(function (c) { return (c[6] || 0) > 0; })
        .sort(function (a, b) { return (b[6] || 0) - (a[6] || 0); });
      if (withOpen.length) {
        html += '<div class="panel-section-title">Centers with open tickets (' + withOpen.length + ')</div>' +
          '<div class="ticket-list">' +
          withOpen.map(function (c, i) {
            var pc = c[6] > 3 ? 'danger' : 'warn';
            return '<button class="ticket-row" type="button" data-ci="' + i + '">' +
              '<div class="ticket-row-top"><span class="ticket-id">' + escapeHtml(c[1]) + '</span>' +
              '<span class="badge badge-' + pc + '">' + c[6] + ' open</span></div>' +
              '<div class="ticket-subj">' + c[4] + ' devices · ' + c[5] + ' online</div></button>';
          }).join('') + '</div>';
      } else {
        html += '<p class="card-sub">No centers with open tickets for this customer.</p>';
      }
      $(ids.body).innerHTML = html;
      Array.prototype.forEach.call($(ids.body).querySelectorAll('button[data-ci]'), function (b) {
        b.addEventListener('click', function () { open(withOpen[parseInt(b.getAttribute('data-ci'), 10)]); });
      });
    }

    function close() {
      $(ids.panel).hidden = true;
      if (ids.scrim) $(ids.scrim).hidden = true;
    }
    return { open: open, openCustomer: openCustomer, close: close };
  }

  var mainMap = MapView('assetMap');
  var tcMap = MapView('tcMap');
  var CenterDetail = makeCenterDetail({
    panel: 'centerDrawer', scrim: 'centerScrim',
    title: 'centerDrawerTitle', sub: 'centerDrawerSub', body: 'centerDrawerBody'
  });
  /** Open the drawer from a Center-360 row object. */
  function openCenterRow(row) {
    CenterDetail.open([row.center_id, row.center, 0, 0, row.devices || 0, row.online || 0, row.open_tickets || 0, 0]);
  }

  /* ── theme ───────────────────────────────────────────────────── */
  function applyTheme(theme, persist) {
    state.theme = (theme === 'light') ? 'light' : 'dark';
    document.body.setAttribute('data-theme', state.theme);
    $('themeDark').setAttribute('aria-pressed', String(state.theme === 'dark'));
    $('themeLight').setAttribute('aria-pressed', String(state.theme === 'light'));
    Charts.applyTheme(state.theme);
    if (persist) localStorage.setItem('sip.theme', state.theme);
    // ECharts colors are baked at build time → rebuild from cached data.
    if (state.lastDashboard) renderDashboard(state.lastDashboard);
    if (state.execLoaded) renderExec(state.execData);
    mainMap.setTheme(state.theme);
    tcMap.setTheme(state.theme);
    if (state.mapLoaded) applyMapFilters();
    if (state.topLoaded) renderTopCustomers(state.topBundle);
  }

  /* ── Executive Overview (landing) ────────────────────────────── */
  function loadExec() {
    Charts.setLoading(['execFleet', 'execTrend', 'execTopCust', 'execGeo']);
    gsCall(ep('apiGetExecOverview'), { activeOnly: state.activeOnly })
      .then(function (data) { state.execLoaded = true; state.execData = data; renderExec(data); })
      .catch(function (err) {
        $('execNarrative').textContent = 'Could not load the overview: ' + err.message;
        toast('Overview failed: ' + err.message, 'error');
      });
  }

  function renderExec(d) {
    var k = d.kpis || {}, z = d.zohoKpis || {}, roll = d.rollup || {}, tt = d.topTotals || {};
    var onlinePct = k.total_devices ? Math.round((k.online_24h / k.total_devices) * 100) : 0;

    /* KPI strip */
    uptimeKpi('exUptime', d.uptimeFleet || null);
    var fleet = d.fleet || {};
    setKpi('exActive', fleet.total != null ? fleet.total : k.total_devices,
      FMT.format(fleet.with_center || 0) + ' mapped to a center');
    setKpi('exCenters', roll.centers, FMT.format(roll.attention_centers || 0) + ' need attention');
    setKpi('exTickets', z.open_tickets, FMT.format(z.created_7d || 0) + ' new this week');
    setKpi('exTopLe', tt.devices, tt.customers + ' Top LE accounts');
    setKpi('exTat', d.cs ? d.cs.avg_tat_days : null, d.cs ? d.cs.total_cases + ' field cases' : 'sheet unavailable');
    var sla = d.slaKpis || {};
    setKpi('exTicketCount', z.total_tickets, FMT.format(z.open_tickets || 0) + ' currently open');
    setKpi('exSlaBreach', sla.breached_open, (sla.within_pct != null ? sla.within_pct + '% within SLA' : 'open tickets past target'));

    /* Fleet-age ring: fills toward a 5-year expected device lifecycle. */
    var LIFECYCLE_YEARS = 5;
    var ageYears = d.avgAgeDays != null ? d.avgAgeDays / 365 : null;
    var agePct = ageYears != null ? Math.min(100, Math.round((ageYears / LIFECYCLE_YEARS) * 100)) : 0;
    var ageColor = ageYears == null ? 'var(--muted)'
      : (ageYears >= 4 ? 'var(--danger)' : (ageYears >= 2.5 ? 'var(--warn)' : 'var(--ok)'));
    var ring = $('execRing');
    if (ring) {
      ring.style.setProperty('--ring-color', ageColor);
      $('execRingPct').textContent = ageYears != null ? ageYears.toFixed(1) + 'y' : '–';
      $('execRingLabel').textContent = 'avg device age';
      $('execRingCap').textContent = 'of ' + LIFECYCLE_YEARS + '-yr life';
      ring.style.setProperty('--pct', REDUCED_MOTION ? agePct : 0);
      if (!REDUCED_MOTION) requestAnimationFrame(function () {
        requestAnimationFrame(function () { ring.style.setProperty('--pct', agePct); });
      });
    }

    /* Narrative sentence */
    $('execNarrative').innerHTML =
      '<b>' + FMT.format(k.total_devices || 0) + '</b> devices across <b>' + FMT.format(roll.centers || 0) +
      '</b> centers. <b class="' + (onlinePct >= 50 ? 'up' : 'down') + '">' + onlinePct + '%</b> reported in the last 24 hours' +
      (k.offline_7d ? ', while <b>' + FMT.format(k.offline_7d) + '</b> have been silent for a week or more' : '') +
      '. <b>' + FMT.format(z.open_tickets || 0) + '</b> support tickets are open' +
      (tt.devices ? ', and your <b>' + tt.customers + '</b> Top LE accounts run <b>' + FMT.format(tt.devices) + '</b> devices' : '') + '.';

    /* Attention flags */
    var flags = [];
    if (roll.attention_centers) flags.push({ cls: 'is-alert', icon: ICONS.inbox, text: FMT.format(roll.attention_centers) + ' centers with 4+ open tickets' });
    if (z.closed_7d >= z.created_7d && z.created_7d) flags.push({ cls: 'is-good', icon: ICONS.online, text: 'Closing tickets faster than they open' });
    else if (z.created_7d) flags.push({ cls: '', icon: ICONS.inbox, text: FMT.format(z.created_7d) + ' new tickets this week' });
    $('execFlags').innerHTML = flags.map(function (f) {
      return '<span class="exec-flag ' + f.cls + '"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' + f.icon + '</svg>' + f.text + '</span>';
    }).join('');

    /* Charts */
    Charts.jiraStatus((d.fleet && d.fleet.by_status) || [], 'execFleet');
    Charts.zohoTrend(d.zohoTrend, 'execTrend');
    Charts.geo((d.geo || []).slice(0, 8), 'execGeo');
    Charts.rankBar('execTopCust',
      (d.topCustomers || []).map(function (c) { return { label: shortName(c.hub), cnt: c.devices }; }),
      { color: '#2E9BD6', empty: 'No customer data' });

    /* Attention tables — rows open the shared center drawer */
    var cbody = $('execCentersTable').querySelector('tbody');
    cbody.innerHTML = (d.worstCenters || []).length
      ? d.worstCenters.map(function (c) {
          return '<tr class="is-clickable" data-cid="' + escapeHtml(c.center_id) + '" tabindex="0" role="button">' +
            '<td><strong>' + escapeHtml(c.center || '—') + '</strong></td>' +
            '<td>' + escapeHtml(c.state || '—') + '</td>' +
            '<td class="num">' + FMT.format(c.devices) + '</td>' +
            '<td class="num">' + FMT.format(c.online) + '</td>' +
            '<td class="num"><span class="badge badge-danger">' + FMT.format(c.open_tickets) + '</span></td></tr>';
        }).join('')
      : '<tr><td colspan="5" class="chart-empty">No open tickets</td></tr>';
    wireCenterRowClicks($('execCentersTable'));

    var rbody = $('execRelTable').querySelector('tbody');
    rbody.innerHTML = (d.reliability || []).length
      ? d.reliability.slice(0, 8).map(function (r) {
          var sev = r.uptime_pct >= 95 ? 'ok' : (r.uptime_pct >= 90 ? 'warn' : 'danger');
          return '<tr class="is-clickable" data-cid="' + escapeHtml(r.centerid) + '" tabindex="0" role="button">' +
            '<td><strong>' + escapeHtml(r.center || ('Center #' + r.centerid)) + '</strong></td>' +
            '<td class="num"><span class="badge badge-' + sev + '">' + escapeHtml(r.uptime_pct) + '%</span></td>' +
            '<td class="num">' + escapeHtml(r.downtime_pct) + '%</td></tr>';
        }).join('')
      : '<tr><td colspan="3" class="chart-empty">No data</td></tr>';
    wireCenterRowClicks($('execRelTable'));
  }

  /* ── Top Customers page ──────────────────────────────────────── */
  function loadTopCustomers() {
    gsCall(ep('apiGetTopCustomers'), { activeOnly: state.activeOnly })
      .then(function (payload) {
        state.topLoaded = true;
        state.topBundle = payload;
        renderTopCustomers(payload);
      })
      .catch(function (err) {
        toast('Top customers failed: ' + err.message, 'error');
      });
  }

  function renderTopCustomers(payload) {
    var t = payload.totals || {};
    setKpi('tcCustomers', t.customers, (t.withData || 0) + ' with live data');
    setKpi('tcCenters', t.centers, 'across top accounts');
    setKpi('tcDevices', t.devices, FMT.format(t.online || 0) + ' online (24h)');
    setKpi('tcAssets', t.assets, 'Jira assets linked');
    setKpi('tcTicketCount', t.ticket_count, FMT.format(t.open_tickets || 0) + ' currently open');
    setKpi('tcSlaBreach', t.sla_breach, (t.sla_within_pct != null ? t.sla_within_pct + '% within SLA' : 'past target'));

    tcMap.setData(payload.mapCenters || [], CenterDetail.open);

    // Charts use the top ~15 by the relevant metric.
    var withDevices = payload.customers.filter(function (c) { return c.devices > 0; });
    var withCenters = payload.customers.filter(function (c) { return c.centers > 0; });
    var withTickets = payload.customers.filter(function (c) { return c.open_tickets > 0; });

    Charts.rankBar('chartTcDevices', asRows(topBy(withDevices, 'devices', 15), 'devices'), { color: '#2E9BD6', empty: 'No device data' });
    Charts.rankBar('chartTcCenters', asRows(topBy(withCenters, 'centers', 15), 'centers'), { color: '#38BDF8', empty: 'No center data' });
    Charts.rankBar('chartTcTickets', asRows(topBy(withTickets, 'open_tickets', 15), 'open_tickets'), { color: '#F5B301', empty: 'No open tickets' });

    renderTcTable(payload.customers);
  }

  function topBy(rows, key, n) {
    return rows.slice().sort(function (a, b) { return b[key] - a[key]; }).slice(0, n);
  }
  function asRows(customers, key) {
    return customers.map(function (c) { return { label: shortName(c.hub), cnt: c[key] }; });
  }
  function shortName(name) {
    return String(name || '').replace(/\s*\(HUB\)\s*/i, '').split(',')[0].slice(0, 34);
  }

  var TC_COLUMNS = [
    { key: 'hub', label: 'Customer', sortable: true },
    { key: 'hub_id', label: 'Hub ID', sortable: true, num: true },
    { key: 'centers', label: 'Centers', sortable: true, num: true },
    { key: 'devices', label: 'Devices', sortable: true, num: true },
    { key: 'online', label: 'Online', sortable: true, num: true },
    { key: 'open_tickets', label: 'Open tickets', sortable: true, num: true },
    { key: 'assets', label: 'Assets', sortable: true, num: true }
  ];
  var tcSort = { key: 'devices', dir: 'desc' };

  function renderTcTable(customers) {
    $('tcTableHead').innerHTML = TC_COLUMNS.map(function (col) {
      var cls = col.num ? ' class="num"' : '';
      var aria = tcSort.key === col.key ? (tcSort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
      return '<th scope="col"' + cls + ' aria-sort="' + aria + '">' +
        '<button type="button" class="th-sort" data-k="' + col.key + '" aria-sort="' + aria + '">' + col.label +
        '<svg class="sort-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button></th>';
    }).join('');
    Array.prototype.forEach.call($('tcTableHead').querySelectorAll('.th-sort'), function (btn) {
      btn.addEventListener('click', function () {
        var k = btn.getAttribute('data-k');
        if (tcSort.key === k) tcSort.dir = tcSort.dir === 'asc' ? 'desc' : 'asc';
        else { tcSort.key = k; tcSort.dir = k === 'hub' ? 'asc' : 'desc'; }
        renderTcTable(customers);
      });
    });

    var sign = tcSort.dir === 'asc' ? 1 : -1;
    var rows = customers.slice().sort(function (a, b) {
      var x = a[tcSort.key], y = b[tcSort.key];
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * sign;
      return String(x).localeCompare(String(y)) * sign;
    });

    $('tcTable').querySelector('tbody').innerHTML = rows.map(function (c, i) {
      var onlinePct = c.devices ? Math.round((c.online / c.devices) * 100) : null;
      var tb = c.open_tickets > 3 ? 'danger' : (c.open_tickets > 0 ? 'warn' : 'ok');
      return '<tr class="is-clickable" data-hub="' + escapeHtml(c.hub_id) + '" tabindex="0" role="button" aria-label="Open ' + escapeHtml(c.hub) + '">' +
        '<td><strong>' + escapeHtml(c.hub) + '</strong> <span class="badge badge-info">' + escapeHtml(c.tier) + '</span></td>' +
        '<td class="num">' + escapeHtml(c.hub_id) + '</td>' +
        '<td class="num">' + FMT.format(c.centers) + '</td>' +
        '<td class="num">' + FMT.format(c.devices) + '</td>' +
        '<td class="num">' + FMT.format(c.online) + (onlinePct != null ? ' <span class="card-sub">(' + onlinePct + '%)</span>' : '') + '</td>' +
        '<td class="num"><span class="badge badge-' + tb + '">' + FMT.format(c.open_tickets) + '</span></td>' +
        '<td class="num">' + FMT.format(c.assets) + '</td>' +
        '</tr>';
    }).join('');
    var byHub = {}; rows.forEach(function (c) { byHub[c.hub_id] = c; });
    Array.prototype.forEach.call($('tcTable').querySelectorAll('tr.is-clickable'), function (tr) {
      var hubId = parseInt(tr.getAttribute('data-hub'), 10);
      function go() {
        var centersOfHub = (state.topBundle && state.topBundle.mapCenters || [])
          .filter(function (mc) { return mc[CI.hubId] === hubId; });
        CenterDetail.openCustomer(byHub[hubId], centersOfHub);
      }
      tr.addEventListener('click', go);
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  /* ── tabs ────────────────────────────────────────────────────── */
  var TAB_IDS = ['tab-overview', 'tab-asset', 'tab-centers', 'tab-support', 'tab-map', 'tab-topcust', 'tab-numbers', 'tab-rawdata'];

  /* ── hash routing (#overview, #asset, …) ─────────────────────── */
  function pageOf(tabId) { return tabId.replace('tab-', ''); }
  function routeHash() { return '#' + pageOf(state.activeTab); }

  function updateHash() {
    var h = routeHash();
    if (location.hash !== h) {
      try { history.replaceState(null, '', h); } catch (e) { location.hash = h; }
    }
  }

  /** Apply the URL hash on boot / back-forward. Legacy #new-<page> links still resolve. */
  function applyHashRoute() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    if (h.indexOf('new-') === 0) h = h.slice(4); // legacy alias from the old edition routes
    var tabId = 'tab-' + h;
    if (TAB_IDS.indexOf(tabId) !== -1) activateTab(tabId);
  }

  function activateTab(tabId) {
    state.activeTab = tabId;
    TAB_IDS.forEach(function (id) {
      var tab = $(id);
      var panel = $(id.replace('tab-', 'panel-'));
      var active = id === tabId;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
      panel.hidden = !active;
      panel.classList.toggle('is-active', active);
    });
    Charts.flushVisible();
    updateSearchPlaceholder();
    if (tabId === 'tab-overview' && !state.execLoaded) loadExec();
    if (tabId === 'tab-map') {
      if (!mainMap.ensureMap()) {
        $('geoProgress').textContent = 'Map library failed to load — check your network and refresh.';
        return;
      }
      if (!state.mapLoaded) loadMapData();
    }
    if (tabId === 'tab-topcust') {
      tcMap.ensureMap();
      if (!state.topLoaded) loadTopCustomers();
    }
    if (tabId === 'tab-numbers') {
      if (!state.numbersLoaded) loadNumbers();
      if (!state.cdRaw.total) loadCdRaw();
    }
    if (tabId === 'tab-rawdata' && !state.rawData.total) loadRawTable();
    updateHash();
  }

  /* ── Numbers page (center_details counts + raw data) ───────────── */
  function loadNumbers(bypass) {
    gsCall('apiGetNumbers', { bypassCache: !!bypass, activeOnly: state.activeOnly })
      .then(function (d) { state.numbersLoaded = true; renderNumbers(d); })
      .catch(function (err) {
        $('numCentersKpi').innerHTML = '<div class="num-empty">Failed: ' + escapeHtml(err.message) + '</div>';
      });
  }

  function loadCdRaw() {
    $('cdRawInfo').textContent = 'Loading…';
    gsCall('apiGetCenterDetailsRaw', { page: state.cdRaw.page, pageSize: state.cdRaw.pageSize, activeOnly: state.activeOnly })
      .then(renderCdRaw)
      .catch(function (err) {
        $('cdRawInfo').textContent = 'Failed: ' + err.message;
      });
  }

  function renderCdRaw(payload) {
    var rows = payload.rows || [];
    state.cdRaw.total = payload.totalRows || 0;
    var body = $('cdRawTable').querySelector('tbody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="14" class="chart-empty">No rows</td></tr>';
    } else {
      body.innerHTML = rows.map(function (r) {
        return '<tr>' +
          '<td class="num">' + escapeHtml(r.center_id) + '</td>' +
          '<td><strong>' + escapeHtml(r.center || '—') + '</strong></td>' +
          '<td>' + escapeHtml(r.status || '—') + '</td>' +
          '<td>' + escapeHtml(r.type || '—') + '</td>' +
          '<td>' + escapeHtml(r.segment || '—') + '</td>' +
          '<td class="num">' + escapeHtml(r.hub_id == null ? '—' : r.hub_id) + '</td>' +
          '<td>' + escapeHtml(r.hub || '—') + '</td>' +
          '<td>' + escapeHtml(r.city || '—') + '</td>' +
          '<td>' + escapeHtml(r.state || '—') + '</td>' +
          '<td>' + escapeHtml(r.pin || '—') + '</td>' +
          '<td>' + escapeHtml(r.deployed || '—') + '</td>' +
          '<td>' + escapeHtml(r.deactivated || '—') + '</td>' +
          '<td class="num">' + FMT.format(r.devices || 0) + '</td>' +
          '<td><span class="badge badge-' + ((r.devices || 0) > 0 ? 'ok">Yes' : 'muted">No') + '</span></td>' +
          '</tr>';
      }).join('');
    }
    var start = state.cdRaw.page * state.cdRaw.pageSize;
    var end = Math.min(start + state.cdRaw.pageSize, state.cdRaw.total);
    $('cdRawInfo').textContent = state.cdRaw.total
      ? (FMT.format(start + 1) + '–' + FMT.format(end) + ' of ' + FMT.format(state.cdRaw.total) + ' centers')
      : '0 centers';
    var maxPage = Math.max(0, Math.ceil(state.cdRaw.total / state.cdRaw.pageSize) - 1);
    $('cdRawPage').textContent = (state.cdRaw.page + 1) + ' / ' + (maxPage + 1);
    $('cdRawPrev').disabled = state.cdRaw.page <= 0;
    $('cdRawNext').disabled = state.cdRaw.page >= maxPage;
  }

  /* ── Raw Data page (all 8 sources, no site filters) ────────────── */
  function loadRawTable() {
    $('rawTableInfo').textContent = 'Loading\u2026';
    gsCall('apiGetRawPage', { source: state.rawData.source, page: state.rawData.page, pageSize: state.rawData.pageSize })
      .then(renderRawTable)
      .catch(function (err) {
        $('rawTableInfo').textContent = 'Failed: ' + err.message;
      });
  }

  function renderRawTable(payload) {
    var rows = payload.rows || [];
    var columns = payload.columns || [];
    state.rawData.total = payload.totalRows || 0;

    var table = $('rawTable');
    table.querySelector('thead tr').innerHTML = columns.map(function (c) {
      return '<th scope="col">' + escapeHtml(c) + '</th>';
    }).join('');

    var body = table.querySelector('tbody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="' + Math.max(1, columns.length) + '" class="chart-empty">No rows</td></tr>';
    } else {
      body.innerHTML = rows.map(function (r) {
        return '<tr>' + columns.map(function (c) {
          return '<td>' + escapeHtml(r[c]) + '</td>';
        }).join('') + '</tr>';
      }).join('');
    }

    var start = state.rawData.page * state.rawData.pageSize;
    var end = Math.min(start + state.rawData.pageSize, state.rawData.total);
    $('rawTableInfo').textContent = state.rawData.total
      ? (FMT.format(start + 1) + '\u2013' + FMT.format(end) + ' of ' + FMT.format(state.rawData.total) + ' rows')
      : '0 rows';
    var maxPage = Math.max(0, Math.ceil(state.rawData.total / state.rawData.pageSize) - 1);
    $('rawPage').textContent = (state.rawData.page + 1) + ' / ' + (maxPage + 1);
    $('rawPrev').disabled = state.rawData.page <= 0;
    $('rawNext').disabled = state.rawData.page >= maxPage;
  }

  function csvCell(value) {
    var cell = String(value == null ? '' : value);
    return /[",\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell;
  }

  function exportRawFull() {
    var btn = $('rawExportBtn');
    var originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Exporting\u2026';
    gsCall('apiGetRawExport', { source: state.rawData.source })
      .then(function (payload) {
        var columns = payload.columns || [];
        var rows = payload.rows || [];
        if (!rows.length) { toast('Nothing to export', 'error'); return; }
        var lines = [columns.map(csvCell).join(',')].concat(rows.map(function (row) {
          return columns.map(function (c) { return csvCell(row[c]); }).join(',');
        }));
        var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'sip-raw-' + state.rawData.source + '.csv';
        link.click();
        URL.revokeObjectURL(link.href);
        toast(payload.truncated
          ? 'Exported first ' + FMT.format(rows.length) + ' of ' + FMT.format(payload.totalRows) + ' rows'
          : FMT.format(rows.length) + ' rows exported', 'ok');
      })
      .catch(function (err) { toast('Export failed: ' + err.message, 'error'); })
      .then(function () { btn.disabled = false; btn.textContent = originalText; });
  }

  function numCompare(items) {
    return items.map(function (it) {
      return '<div class="num-cell' + (it.hi ? ' is-hi' : '') + '">' +
        '<span class="num-cell-val">' + FMT.format(it.value || 0) + '</span>' +
        '<span class="num-cell-label">' + escapeHtml(it.label) + '</span></div>';
    }).join('');
  }

  function numTable(title, rows) {
    if (!rows || !rows.length) {
      return '<div class="num-table"><h3>' + escapeHtml(title) + '</h3><p class="num-empty">—</p></div>';
    }
    var body = rows.map(function (r) {
      return '<tr><td>' + escapeHtml(r.k) + '</td><td class="num">' + FMT.format(r.n || 0) + '</td></tr>';
    }).join('');
    return '<div class="num-table"><h3>' + escapeHtml(title) + '</h3>' +
      '<table class="data-table"><tbody>' + body + '</tbody></table></div>';
  }

  function renderNumbers(d) {
    $('numCentersKpi').innerHTML = numCompare([
      { label: 'Centers (center_details)', value: d.centers.total, hi: true }
    ]);
    $('numCentersStatus').innerHTML = numTable('By status', d.centers.by_status);
    $('numCentersSegment').innerHTML = numTable('By segment', d.centers.by_segment);

    $('numHubsKpi').innerHTML = numCompare([
      { label: 'Hubs (center_details)', value: d.hubs.total, hi: true }
    ]);
    $('numHubsStatus').innerHTML = numTable('By center status', d.hubs.by_status);
    $('numHubsSegment').innerHTML = numTable('By master segment', d.hubs.by_segment);

    var devSrc = { 'google-sheet': 'live Google Sheet', 'dump-snapshot': 'offline dump (Sheets API pending)', 'sheet-unavailable': 'unavailable' }[d.devices.source] || '';
    var mapSrc = { 'center_details': 'center_details serial', 'cloud_devices': 'serial→cloud_devices' }[d.devices.center_source] || 'serial';
    $('numDevicesKpi').innerHTML = numCompare([
      { label: 'Devices (fleet)', value: d.devices.total, hi: true },
      { label: 'Devices mapped', value: d.devices.with_center },
      { label: 'Centers mapped', value: d.devices.jira_centers },
      { label: 'In center_details', value: d.devices.in_cd }
    ]) + (devSrc ? '<div class="num-src">source: ' + escapeHtml(devSrc) + ' · mapped by ' + escapeHtml(mapSrc) + ' (Jira Customer ID ignored)</div>' : '');
    $('numDevicesStatus').innerHTML = numTable('By Jira status', d.devices.by_status);

    $('numTicketsKpi').innerHTML = numCompare([
      { label: 'Total tickets', value: d.tickets.total, hi: true },
      { label: 'Tech', value: d.tickets.tech },
      { label: 'Non-Tech', value: d.tickets.nontech }
    ]);
    $('numTicketsStatus').innerHTML = numTable('By status', d.tickets.by_status);
  }

  function wireTabs() {
    TAB_IDS.forEach(function (id, index) {
      var tab = $(id);
      tab.addEventListener('click', function () { activateTab(id); });
      tab.addEventListener('keydown', function (event) {
        var delta = event.key === 'ArrowRight' ? 1 : (event.key === 'ArrowLeft' ? -1 : 0);
        if (!delta) return;
        event.preventDefault();
        var next = TAB_IDS[(index + delta + TAB_IDS.length) % TAB_IDS.length];
        activateTab(next);
        $(next).focus();
      });
    });
  }

  /* ── auto refresh ────────────────────────────────────────────── */
  function refreshAll(bypassCache) {
    loadExec();
    loadDashboard(bypassCache);
    loadDevices();
    loadCenters();
    if (state.mapLoaded) loadMapData();
    if (state.topLoaded) loadTopCustomers();
    // Numbers page (incl. the Google-Sheet devices count) — only when it's in play.
    if (state.numbersLoaded || state.activeTab === 'tab-numbers') {
      loadNumbers(bypassCache);
      loadCdRaw();
    }
  }

  function tickCountdown() {
    if (!state.autoRefresh) { $('refreshCountdown').textContent = ''; return; }
    state.countdown -= 1;
    if (state.countdown <= 0) {
      refreshAll(true);
      state.countdown = REFRESH_SECONDS;
    }
    var m = Math.floor(state.countdown / 60);
    var s = String(state.countdown % 60).padStart(2, '0');
    $('refreshCountdown').textContent = m + ':' + s;
  }

  /* ── boot ────────────────────────────────────────────────────── */
  function debounce(fn, wait) {
    var timer;
    return function () {
      clearTimeout(timer);
      var args = arguments, self = this;
      timer = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }

      source: 'zoho_data failure tickets + center_details.deploymentdate (birth). North-Star target ≥ 99%.' },
    mtbf: { code: 'M-A2', name: 'Mean Time Between Failures',

    ftf: { code: 'M-A3', name: 'First-Time-Failure by batch',

      source: 'Same cohort table as M-A3 (zoho_data failures by birth year).' },
    deployAge: { code: 'M-A4≈', name: 'Deployment / lifecycle age',
      formula: 'today − deploymentdate, per center. Shown in months, or years (1 dp) once ≥ 12 months.',

    assetLifecycle: { name: 'Asset lifecycle / types',

    document.body.appendChild(pop);

    // Inject a dot into every recognised card title (KPI dots come from kpiTile).
    var titles = document.querySelectorAll('.card-title');
    for (var i = 0; i < titles.length; i++) {
      var el = titles[i];
      if (el.querySelector('.info-dot')) continue;
      var key = TITLE_METRIC[(el.textContent || '').trim().toLowerCase()];
      if (key) el.insertAdjacentHTML('beforeend', ' ' + infoDotHtml(key));
    }

    var pinned = false;
    function showPop(dot) {
      var m = METRIC_INFO[dot.getAttribute('data-metric')];
      if (!m) return;
      pop.innerHTML =
        '<div class="info-pop-head">' +
          (m.code ? '<span class="metric-tag">' + escapeHtml(m.code) + '</span>' : '') +
          '<span class="info-pop-name">' + escapeHtml(m.name) + '</span></div>' +
        '<div class="info-pop-row"><span class="info-pop-label">How it’s calculated</span>' +
          '<span class="info-pop-formula">' + escapeHtml(m.formula) + '</span></div>' +
        '<div class="info-pop-row"><span class="info-pop-label">Source</span>' + escapeHtml(m.source) + '</div>' +
        (m.note ? '<div class="info-pop-row info-pop-note">' + escapeHtml(m.note) + '</div>' : '');
      pop.classList.add('is-open');
      var r = dot.getBoundingClientRect();
      var pw = pop.offsetWidth, ph = pop.offsetHeight;
      var left = Math.max(12, Math.min(r.left, window.innerWidth - pw - 12));
      var top = r.bottom + 8;
      if (top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
    }
    function hidePop() { pop.classList.remove('is-open'); pinned = false; }

    document.addEventListener('mouseover', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot && !pinned) showPop(dot);
    });
    document.addEventListener('mouseout', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot && !pinned) hidePop();
    });
    document.addEventListener('focusin', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot) showPop(dot);
    });
    document.addEventListener('focusout', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot && !pinned) hidePop();
    });
    document.addEventListener('click', function (e) {
      var dot = e.target.closest && e.target.closest('.info-dot');
      if (dot) { e.preventDefault(); e.stopPropagation(); pinned = !pinned; if (pinned) showPop(dot); else hidePop(); return; }
      if (pinned && !(e.target.closest && e.target.closest('.info-pop'))) hidePop();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hidePop(); });
    window.addEventListener('resize', hidePop);
  }

  function init() {
    buildKpiSkeletons();
    buildDeviceHeader();
    buildStatusChips();
    buildCenterHeader();
    setupMetricInfo();
    wireTabs();

    $('refreshBtn').addEventListener('click', function () { refreshAll(true); });
    $('retryBtn').addEventListener('click', function () { loadDashboard(true); });

    // Theme (persisted) — replaces the old auto-refresh toggle.
    applyTheme(localStorage.getItem('sip.theme') || 'dark', false);
    $('themeDark').addEventListener('click', function () { applyTheme('dark', true); });
    $('themeLight').addEventListener('click', function () { applyTheme('light', true); });

    // Auto-refresh now runs unconditionally in the background.
    state.autoRefresh = true;
    setInterval(tickCountdown, 1000);

    // Global search — one box drives the active list page.
    $('globalSearch').addEventListener('input', debounce(function (e) {
      state.search = e.target.value.trim();
      reloadActiveList();
    }, 350));

    // Global hub filter — re-queries the server-side lists + aggregates.
    $('hubFilter').addEventListener('change', function (event) {
      state.hub = event.target.value.trim();
      state.devices.page = 0; state.centers.page = 0;
      refreshAll(false);
    });

    // Global segment filter — applies to centers (server) + map (client).
    $('globalSegment').addEventListener('change', function (event) {
      state.segment = event.target.value;
      state.centers.page = 0;
      if (state.mapLoaded) applyMapFilters();
      loadCenters();
    });

    // "Active centers" toggle — filters center_details to Status = 'ACTIVE' across all pages.
    $('activeOnlyBtn').addEventListener('click', function () {
      state.activeOnly = !state.activeOnly;
      var b = $('activeOnlyBtn');
      b.classList.toggle('is-active', state.activeOnly);
      b.setAttribute('aria-pressed', String(state.activeOnly));
      // Invalidate per-view caches so every page refetches with the new filter.
      state.execLoaded = false; state.mapLoaded = false; state.topLoaded = false;
      state.numbersLoaded = false; state.lastDashboard = null; state.cdRaw.total = 0;
      state.centers.page = 0;
      refreshAll(false);
      if (state.activeTab === 'tab-map') { mainMap.ensureMap(); loadMapData(); }
      if (state.activeTab === 'tab-topcust') { tcMap.ensureMap(); loadTopCustomers(); }
    });

    $('prevPageBtn').addEventListener('click', function () {
      state.devices.page = Math.max(0, state.devices.page - 1);
      loadDevices();
    });
    $('nextPageBtn').addEventListener('click', function () {
      state.devices.page += 1;
      loadDevices();
    });
    $('ctrPrevBtn').addEventListener('click', function () {
      state.centers.page = Math.max(0, state.centers.page - 1);
      loadCenters();
    });
    $('ctrNextBtn').addEventListener('click', function () {
      state.centers.page += 1;
      loadCenters();
    });
    $('exportCsvBtn').addEventListener('click', exportCsv);

    // Shared center drawer close (button, scrim click, Esc).
    $('centerDrawerClose').addEventListener('click', CenterDetail.close);
    $('centerScrim').addEventListener('click', CenterDetail.close);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !$('centerDrawer').hidden) CenterDetail.close();
    });

    // Clickable ticket-bucket legend on the map.
    Array.prototype.forEach.call(document.querySelectorAll('.legend-filter'), function (btn) {
      btn.addEventListener('click', function () {
        var b = btn.getAttribute('data-bucket');
        state.ticketBucket = (state.ticketBucket === b) ? '' : b;
        syncLegendActive();
        applyMapFilters();
      });
    });

    window.addEventListener('hashchange', applyHashRoute);

    // center_details raw-data table pager.
    $('cdRawPrev').addEventListener('click', function () {
      if (state.cdRaw.page > 0) { state.cdRaw.page -= 1; loadCdRaw(); }
    });
    $('cdRawNext').addEventListener('click', function () {
      var maxPage = Math.max(0, Math.ceil(state.cdRaw.total / state.cdRaw.pageSize) - 1);
      if (state.cdRaw.page < maxPage) { state.cdRaw.page += 1; loadCdRaw(); }
    });

    // Raw Data page: source pills, page size, pager, export.
    Array.prototype.forEach.call($('rawSourcePills').querySelectorAll('.raw-pill'), function (pill) {
      pill.addEventListener('click', function () {
        if (pill.classList.contains('is-active')) return;
        Array.prototype.forEach.call($('rawSourcePills').querySelectorAll('.raw-pill'), function (p) {
          p.classList.remove('is-active');
        });
        pill.classList.add('is-active');
        state.rawData.source = pill.getAttribute('data-source');
        state.rawData.page = 0;
        state.rawData.total = 0;
        $('rawTableTitle').textContent = pill.textContent + ' \u00b7 raw data';
        loadRawTable();
      });
    });
    $('rawPageSize').addEventListener('change', function () {
      state.rawData.pageSize = parseInt($('rawPageSize').value, 10) || 25;
      state.rawData.page = 0;
      loadRawTable();
    });
    $('rawPrev').addEventListener('click', function () {
      if (state.rawData.page > 0) { state.rawData.page -= 1; loadRawTable(); }
    });
    $('rawNext').addEventListener('click', function () {
      var maxPage = Math.max(0, Math.ceil(state.rawData.total / state.rawData.pageSize) - 1);
      if (state.rawData.page < maxPage) { state.rawData.page += 1; loadRawTable(); }
    });
    $('rawExportBtn').addEventListener('click', exportRawFull);

    updateSearchPlaceholder();
    refreshAll(false);
    applyHashRoute(); // deep-link support: #overview, #asset, …
  }

  /** Reloads whichever list the active tab shows, honouring global filters. */
  function reloadActiveList() {
    if (state.activeTab === 'tab-asset') { state.devices.page = 0; loadDevices(); }
    else if (state.activeTab === 'tab-centers') { state.centers.page = 0; loadCenters(); }
    else if (state.activeTab === 'tab-map') applyMapFilters();
  }

  function updateSearchPlaceholder() {
    var map = {
      'tab-asset': 'Search devices by ID, center or hub…',
      'tab-centers': 'Search centers by name, ID, hub or state…',
      'tab-map': 'Search the map: center, hub, device or serial…'
    };
    $('globalSearch').placeholder = map[state.activeTab] || 'Search centers, devices, hubs, serials…';
  }

  function syncLegendActive() {
    Array.prototype.forEach.call(document.querySelectorAll('.legend-filter'), function (btn) {
      btn.setAttribute('aria-pressed', String(btn.getAttribute('data-bucket') === state.ticketBucket));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

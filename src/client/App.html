  function toast(message, kind) {
    var region = $('toastRegion');
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' toast-' + kind : '');
    el.textContent = message;
    region.appendChild(el);
    setTimeout(function () {
      el.classList.add('is-leaving');
      setTimeout(function () { el.remove(); }, 220);
    }, 4200);
  }

  /* ── helpers ─────────────────────────────────────────────────── */
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function countUp(el, target) {
    if (REDUCED_MOTION || !isFinite(target) || target === 0) {
      el.textContent = FMT.format(target || 0);
      return;
    }
    var start = performance.now(), duration = 600;
    function frame(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = FMT.format(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /**
   * BigQuery returns LastTimeStamp as "…+00" but the value is IST wall-time
   * (see docs/SOURCES.md) — strip the zone suffix and parse as local time.
   */
  function relTime(tsText) {
    if (!tsText) return '—';
    var localish = String(tsText).replace(/(\+|-)\d\d(:?\d\d)?$/, '').replace(' ', 'T');
    var then = new Date(localish);
    if (isNaN(then)) return tsText;
    var mins = Math.round((Date.now() - then.getTime()) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    if (mins < 1440) return Math.round(mins / 60) + 'h ago';
    return Math.round(mins / 1440) + 'd ago';
  }

  /**
   * Prior-period delta chip for a FLOW metric — a count over a window that can
   * be shifted back and compared (created/closed per 7d). NEVER call this for a
   * STOCK (open backlog, device/center counts): those are snapshots of now, and
   * this schema keeps no historical snapshot, so a "change" figure for them
   * would be fabricated. See the zohoKpis spec in Queries.js.
   *
   * Direction is reported separately from goodness so colour is never the only
   * signal: the arrow states which way the number moved, the class states
   * whether that is good. `invert` marks metrics where rising is bad (tickets
   * created), as opposed to good (tickets closed).
   *
   * @param {?number} curr this window
   * @param {?number} prev the window immediately before
   * @param {{invert:(boolean|undefined), label:(string|undefined)}=} opts
   * @return {string} HTML, or '' when there is no usable baseline
   */
  function deltaChip(curr, prev, opts) {
    var o = opts || {};
    var label = o.label || 'vs prior 7d';
    if (curr == null || prev == null) return '';
    // No baseline to divide by — say so rather than rendering a fake +100%.
    if (!prev) return '<span class="kpi-delta is-flat">no prior ' + escapeHtml(label.replace(/^vs /, '')) + '</span>';
    var pct = Math.round(((curr - prev) / prev) * 1000) / 10;
    if (pct === 0) return '<span class="kpi-delta is-flat">± 0% ' + escapeHtml(label) + '</span>';
    var rising = pct > 0;
    var good = o.invert ? !rising : rising;
    return '<span class="kpi-delta ' + (good ? 'is-good' : 'is-bad') + '">' +
      (rising ? '▲' : '▼') + ' ' + Math.abs(pct) + '% ' + escapeHtml(label) + '</span>';
  }

  /**
   * @param {string} id
   * @param {?number} value
   * @param {string=} subText
   * @param {string=} subHtml pre-built markup (e.g. deltaChip) rendered INSTEAD
   *   of subText. Only ever pass generated markup — this is the one innerHTML
   *   path on a KPI tile; server strings must go through subText/textContent.
   */
  function setKpi(id, value, subText, subHtml) {
    var tile = $(id);
    if (!tile) return;
    tile.classList.remove('is-loading');
    // An ABSENT value renders as '—', never as 0. A missing server key, a
    // renamed field, or a panel whose BigQuery spec failed used to animate a
    // confident zero into the tile — indistinguishable from a real zero, and
    // therefore worse than an error, because nothing prompts anyone to look.
    // Only a genuine numeric 0 prints "0".
    if (value == null) tile.querySelector('.kpi-value').textContent = '—';
    else countUp(tile.querySelector('.kpi-value'), value);
    if (subHtml) tile.querySelector('.kpi-sub').innerHTML = subHtml;
    else if (subText) tile.querySelector('.kpi-sub').textContent = subText;
  }

  /** Sets a KPI to a string, count-up animating a leading number + suffix (e.g. "98.9%"). */
  function setKpiText(id, text, subText) {
    var tile = $(id);
    if (!tile) return;
    tile.classList.remove('is-loading');
    countUpText(tile.querySelector('.kpi-value'), text == null ? '—' : String(text));
    if (subText) tile.querySelector('.kpi-sub').textContent = subText;
  }

  /** Animates a "<number><suffix>" string (e.g. "98.9%", "3.2y"); preserves decimals + suffix. */
  function countUpText(el, text) {
    var m = /^(-?\d[\d,]*\.?\d*)(.*)$/.exec(text);
    if (REDUCED_MOTION || !m) { el.textContent = text; return; }
    var target = parseFloat(m[1].replace(/,/g, '')), suffix = m[2];
    var decimals = (m[1].split('.')[1] || '').length;
    if (!isFinite(target) || target === 0) { el.textContent = text; return; }
    var start = performance.now(), duration = 600;
    function frame(now) {
      var t = Math.min(1, (now - start) / duration), eased = 1 - Math.pow(1 - t, 3), v = target * eased;
      el.textContent = (decimals ? v.toFixed(decimals) : FMT.format(Math.round(v))) + suffix;
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function uptimeKpi(id, up) {
    setKpiText(id,
      up && up.avg_uptime != null ? up.avg_uptime.toFixed(1) + '%' : '—',
      // Kept short deliberately: KPI subs must fit ONE line at the narrowest
      // (6-column) tile width, or the tile's value breaks the row's shared
      // baseline. "N% of centers ≥ 99%" wrapped to two lines and did exactly that.
      up && up.pct99 != null ? up.pct99 + '% at ≥ 99%' : 'ticket-based proxy');
  }

  /* ── dashboard load ──────────────────────────────────────────── */
  var CHART_IDS = ['chartDeviceAges',
    'chartAssetStatus', 'chartAssetTypes', 'chartGeo', 'chartDeploymentAge', 'chartActiveEnded',
    'chartZohoTrend', 'chartZohoStatus', 'chartZohoCategories',
    'chartZohoOpenAge', 'chartZohoSegment', 'chartCohort'];

  var dashboardRequestId = 0;
  function loadDashboard(bypassCache) {
    // Latest-wins: a filter change (or manual refresh) mid-flight supersedes
    // the in-flight request instead of being dropped, so KPIs/charts can never
    // stay pinned to a stale filter set. Mirrors loadDevices/loadCenters.
    var requestId = ++dashboardRequestId;
    state.loading = true;
    $('refreshBtn').classList.add('is-busy');
    $('refreshBtn').disabled = true;
    $('errorBanner').hidden = true;
    // Silent refresh: blank the charts only on the very first load. Later
    // refreshes keep the rendered dashboard on screen and swap data on arrival
    // (the latest-wins requestId above already guards against races).
    if (!state.lastDashboard) Charts.setLoading(CHART_IDS);

    gsCall(ep('apiGetDashboard'), { filters: state.globalFilters, bypassCache: !!bypassCache })
      .then(function (data) {
        if (requestId !== dashboardRequestId) return;
        renderDashboard(data);
      })
      .catch(function (err) {
        if (requestId !== dashboardRequestId) return;
        $('errorBanner').hidden = false;
        $('errorMessage').textContent = 'Could not load dashboard: ' + err.message;
        $('statusStrip').classList.add('is-stale');
        toast('Dashboard refresh failed', 'error');
      })
      .finally(function () {
        if (requestId !== dashboardRequestId) return; // a newer load now owns the UI
        state.loading = false;
        $('refreshBtn').classList.remove('is-busy');
        $('refreshBtn').disabled = false;
        state.countdown = REFRESH_SECONDS;
      });
  }

  /**
   * Ranked-bar input: the top `n` rows plus one trailing "Other (N)" row
   * summing the remainder, so a truncated breakdown states what it dropped
   * instead of just ending at n. The two Asset breakdowns previously sliced to
   * 8 with nothing on screen to say more existed — which started mattering
   * more once JIRA_DEVICE_TYPE_DEFAULT went empty (`8c02469`) and Asset types
   * began spanning every Jira type instead of Connector + ECG.
   *
   * Rows arrive already sorted descending (`assetsDonutFromIndex_`,
   * EditionCD.js), so the top n really is the top n — this does not re-sort,
   * and must not, or it would disagree with the server about what "top" means.
   * Server-side counterpart: OverviewFlow.js's topNPlusOthers_.
   */
  function topNPlusOther_(rows, n) {
    if (rows.length <= n) return rows;
    var rest = rows.slice(n);
    var sum = rest.reduce(function (s, r) { return s + (r.cnt || 0); }, 0);
    return rows.slice(0, n).concat([{ label: 'Other (' + rest.length + ')', cnt: sum }]);
  }

  function renderDashboard(data) {
    state.lastDashboard = data; // kept so theme changes can re-render charts offline
    state.dashFilters = data.filters || null; // the filter set this payload was fetched with
    // Sticky filter-drawer option lists: captured from the first payload that
    // carries them and never cleared, so the drawer stays populated on tabs that
    // don't share this payload and while a refetch is in flight (finding I3).
    // Keep the `|| state.*` fallback — a partial/failed spec must not blank a
    // list that already loaded.
    state.segmentOptions = data.segmentOptions || state.segmentOptions || [];
    state.stateOptions = data.stateOptions || state.stateOptions || [];
    state.cityOptions = data.cityOptions || state.cityOptions || [];
    state.countryOptions = data.countryOptions || state.countryOptions || [];
    state.deviceTypeOptions = data.deviceTypeOptions || state.deviceTypeOptions || [];
    state.deviceStatusOptions = data.deviceStatusOptions || state.deviceStatusOptions || [];
    state.machineTypeOptions = data.machineTypeOptions || state.machineTypeOptions || [];
    /* Asset KPIs (device grain) — every tile reads data.fleet, i.e.
       jiraDeviceStats_. This page is jira_data only (per user, 2026-08-19);
       the cloud_devices `kpis`/`fleetStatus`/`firmware` specs and the Device
       Explorer they backed were removed entirely the same day. kpiTotal used
       to fall back to kpis.total_devices when fleet.total was null, which
       quietly swapped in a communicator count for a Jira device count — a
       null now shows as 0, from the one grain the tile claims to report. */
    var fleet = data.fleet || {};
    setKpi('kpiTotal', fleet.total);
    setKpiText('kpiAvgAge',
      fleet.avg_age_days != null ? (fleet.avg_age_days / 365).toFixed(1) + 'y' : '—',
      'across ' + FMT.format(fleet.aged_devices || 0) + ' dated devices');
    setKpi('kpiPastLife', fleet.past_life,
      fleet.total ? Math.round((fleet.past_life || 0) / fleet.total * 100) + '% of devices' : 'devices 5y+');

    /* Customers KPIs (center grain — a center IS an independent customer) */
    var up = (data.uptimeFleet && data.uptimeFleet[0]) || null;
    var ck = (data.centerKpis && data.centerKpis[0]) || {};
    setKpi('kpiCenters', ck.centers, 'all customers');
    uptimeKpi('kpiUptime', up);
    setKpi('kpiStates', ck.centers_with_open_tickets, 'at least 1 open ticket');
    setKpi('kpiMtbf', up && up.avg_mtbf_days != null ? up.avg_mtbf_days : null, 'avg days between failures');

    /* Support KPIs (all Zoho tickets) */
    var zoho = (data.zohoKpis && data.zohoKpis[0]) || {};
    setKpi('kpiZOpen', zoho.open_tickets, 'active backlog');
    // Flow metrics — comparable against the preceding 7 days. More tickets
    // created is bad (invert), more closed is good. The old subs ("new this
    // week" / "resolved this week") are dropped rather than passed and
    // overridden: they only restated the "Created · 7d" / "Closed · 7d" tile
    // labels, so the delta is strictly more informative in the same space.
    setKpi('kpiZIn', zoho.created_7d, null,
      deltaChip(zoho.created_7d, zoho.created_7d_prev, { invert: true }));
    setKpi('kpiZOut', zoho.closed_7d, null,
      deltaChip(zoho.closed_7d, zoho.closed_7d_prev));
    setKpi('kpiZAge', zoho.avg_open_age_days, 'days per open ticket');

    // Service KPIs: awaiting its own data source (2026-08-12), no longer
    // wired to Zoho like Support — setKpiText's null→'—' fallback clears the
    // loading shimmer instead of leaving it spinning forever.
    // Service KPIs are filled by renderService() from apiGetServiceCD — this
    // page no longer piggybacks on the shared Zoho dashboard payload.

    /* Asset charts */
    // Device status donut + Firmware spread (cloud_devices) removed 2026-08-19
    // along with the Device Explorer table they linked to — cloud_devices
    // data is CDM/Numbers/Raw-Data only now.
    Charts.deviceAges((data.fleet && data.fleet.age_bands) || []);
    var assets = data.assets || [];
    Charts.assetStatus(topNPlusOther_(assets.filter(function (r) { return r.dim === 'status'; }), 8));
    Charts.assetTypes(topNPlusOther_(assets.filter(function (r) { return r.dim === 'type'; }), 8));
    renderCohort(data.cohortReliability || []);

    /* Centers charts */
    Charts.geo(data.geoCustomers);
    renderGeoCustomersHeading_();
    Charts.deploymentAge(data.deploymentAge);
    Charts.activeVsEnded(data.activeVsEnded);

    /* Support charts (all Zoho tickets) */
    Charts.zohoTrend(data.zohoTrend);
    Charts.zohoStatus(data.zohoOpenByStatus);
    Charts.zohoCategories(data.zohoCategories);
    Charts.zohoOpenAge(data.zohoOpenAge);
    Charts.zohoSegment(data.zohoSegment);
    renderSla(data.slaKpis, data.slaByType || []);
    renderSlaRisk(data.slaRisk || [], data.slaKpis);

    // Service charts: awaiting its own data source (2026-08-12) — the
    // Zoho-Tech scope this used to read no longer exists server-side, so
    // these are left unrendered (each Charts.* call's own showEmpty()
    // fallback keeps the cards from looking broken in the meantime).

    $('statusStrip').classList.remove('is-stale');
    $('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }

  /**
   * Batch-cohort failure analysis (M-A3 First-Time-Failure + M-A5 Batch
   * Failure Detection). Draws the combo chart, the detail table and the
   * "batch signal" callout for the cohort that most warrants attention.
   */
  /**
   * Swaps the "Customers by state" card's title/subtitle to "by city" once
   * the Filters drawer has exactly one State selected — matches the data
   * switch in EditionCD.js's `geoCustomers` spec (per user, 2026-08-13).
   */
  function renderGeoCustomersHeading_() {
    var singleState = state.globalFilters.states.length === 1;
    $('chartGeoTitle').textContent = singleState ? 'Customers by city' : 'Customers by state';
    $('chartGeoSub').textContent = singleState ?
      'Distinct active customers per city in ' + state.globalFilters.states[0] :
      'Distinct active customers per state';
    $('chartGeo').setAttribute('aria-label', singleState ?
      'Bar chart of customers per city in ' + state.globalFilters.states[0] :
      'Bar chart of customers per state');
  }

  function renderCohort(rows) {
    Charts.cohort(rows);

    var body = $('cohortTable').querySelector('tbody');
    var signal = $('cohortSignal');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="7" class="chart-empty">No cohort data yet</td></tr>';
      signal.innerHTML = '<p class="batch-signal-empty">No batch data yet</p>';
      return;
    }

    // Fleet-mean FTF rate → flag cohorts materially above it (batch anomaly).
    var mean = rows.reduce(function (a, r) { return a + (r.ftf_rate_pct || 0); }, 0) / rows.length;
    var flagAt = mean + 5;

    body.innerHTML = rows.map(function (r) {
      var ftf = r.ftf_rate_pct || 0;
      var sev = ftf >= flagAt ? 'danger' : (ftf >= mean ? 'warn' : 'ok');
      var ttff = r.median_ttff_days == null ? '—' : humanDays(r.median_ttff_days);
      var flagged = ftf >= flagAt;
      return '<tr' + (flagged ? ' class="row-flagged"' : '') + '>' +
        '<td><strong>' + escapeHtml(r.batch_year) + '</strong>' +
          (flagged ? ' <span class="badge badge-danger">watch</span>' : '') + '</td>' +
        '<td class="num">' + FMT.format(r.devices || 0) + '</td>' +
        '<td class="num"><span class="badge badge-' + sev + '">' + escapeHtml(ftf) + '%</span></td>' +
        '<td class="num">' + ttff + '</td>' +
        '<td class="num">' + FMT.format(r.early_fails || 0) + '</td>' +
        '<td class="num">' + escapeHtml(r.avg_failures == null ? '—' : r.avg_failures) + '</td>' +
        '<td>' + escapeHtml(r.top_issue || '—') + '</td>' +
        '</tr>';
    }).join('');

    // Batch signal = highest-FTF cohort (min 30 devices so it is meaningful).
    var candidates = rows.filter(function (r) { return (r.devices || 0) >= 30; });
    var worst = (candidates.length ? candidates : rows).reduce(function (a, b) {
      return (b.ftf_rate_pct || 0) > (a.ftf_rate_pct || 0) ? b : a;
    });
    // Semantic colour: only red when genuinely above the fleet's flag threshold.
    var wsev = (worst.ftf_rate_pct || 0) >= flagAt ? 'danger'
      : ((worst.ftf_rate_pct || 0) >= mean ? 'warn' : 'ok');
    signal.innerHTML =
      '<div class="batch-signal-year">' + escapeHtml(worst.batch_year) + ' batch</div>' +
      '<div class="batch-signal-rate sev-' + wsev + '">' + escapeHtml(worst.ftf_rate_pct || 0) + '%' +
        '<span class="batch-signal-label">first-time-failure rate</span></div>' +
      '<dl class="batch-signal-meta">' +
        '<div><dt>Devices</dt><dd>' + FMT.format(worst.devices || 0) + '</dd></div>' +
        '<div><dt>Median TTFF</dt><dd>' + (worst.median_ttff_days == null ? '—' : humanDays(worst.median_ttff_days)) + '</dd></div>' +
        '<div><dt>Failures/device</dt><dd>' + escapeHtml(worst.avg_failures == null ? '—' : worst.avg_failures) + '</dd></div>' +
      '</dl>' +
      '<div class="batch-signal-issue">Leading cause · <strong>' + escapeHtml(worst.top_issue || '—') + '</strong></div>';
  }

  /**
   * SLA compliance (CS-team catalog): the within-SLA callout + Tech/Non-Tech
   * split bars, plus the worst-issue-types breach table.
   */
  function renderSla(kpisArr, byType) {
    var k = (kpisArr && kpisArr[0]) || null;
    var el = $('slaCompliance');
    if (el) {
      if (!k || k.resolved_n == null) {
        el.innerHTML = '<p class="batch-signal-empty">No SLA data yet</p>';
      } else {
        var sev = slaSev(k.within_pct);
        el.innerHTML =
          '<div class="sla-pct sev-' + sev + '">' + slaPctText(k.within_pct) +
            '<span class="sla-pct-label">resolved within SLA</span></div>' +
          '<div class="sla-split">' + slaBar('Tech', k.within_tech) + slaBar('Non-Tech', k.within_nontech) + '</div>' +
          '<dl class="batch-signal-meta sla-meta">' +
            '<div><dt>Resolved</dt><dd>' + FMT.format(k.resolved_n || 0) + '</dd></div>' +
            '<div><dt>Open breached</dt><dd class="txt-danger">' + FMT.format(k.breached_open || 0) + '</dd></div>' +
            '<div><dt>At-risk</dt><dd class="txt-warn">' + FMT.format(k.atrisk_open || 0) + '</dd></div>' +
          '</dl>' +
          '<div class="sla-foot">Avg resolution · <strong>' +
            (k.avg_res_days == null ? '—' : k.avg_res_days + ' days') + '</strong></div>';
      }
    }

    var body = $('slaTypeTable').querySelector('tbody');
    if (!byType || !byType.length) {
      body.innerHTML = '<tr><td colspan="6" class="chart-empty">No SLA breakdown yet</td></tr>';
      return;
    }
    body.innerHTML = byType.map(function (r) {
      var bp = r.breach_pct || 0;
      var sev = bp >= 60 ? 'danger' : (bp >= 30 ? 'warn' : 'ok');
      return '<tr>' +
        '<td><strong>' + escapeHtml(r.category) + '</strong></td>' +
        '<td><span class="badge ' + (r.is_tech ? 'badge-info' : 'badge-muted') + '">' +
          (r.is_tech ? 'Tech' : 'Non-Tech') + '</span></td>' +
        '<td class="num">' + escapeHtml(r.sla_days) + 'd</td>' +
        '<td class="num">' + FMT.format(r.tickets || 0) + '</td>' +
        '<td class="num"><span class="badge badge-' + sev + '">' + slaPctText(bp) + '</span></td>' +
        '<td class="num">' + (r.avg_res_days == null ? '—' : r.avg_res_days) + '</td>' +
        '</tr>';
    }).join('');
  }

  /** Within-SLA severity band: ok ≥85, warn ≥70, else danger. */
  function slaSev(p) { return p >= 85 ? 'ok' : (p >= 70 ? 'warn' : 'danger'); }
  function slaPctText(p) { return (p == null ? '—' : p + '%'); }
  function slaBar(label, pct) {
    var v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
    return '<div class="sla-bar-row">' +
      '<span class="sla-bar-label">' + label + '</span>' +
      '<span class="sla-bar-track"><span class="sla-bar-fill sev-' + slaSev(pct || 0) +
        '" style="width:' + v + '%"></span></span>' +
      '<span class="sla-bar-val">' + slaPctText(pct) + '</span></div>';
  }

  /** Compact day count → "18mo" / "2.1y" / "42d". */
  function humanDays(d) {
    d = Number(d);
    if (!isFinite(d)) return '—';
    if (d >= 365) return (d / 365).toFixed(1) + 'y';
    if (d >= 60) return Math.round(d / 30) + 'mo';
    return Math.round(d) + 'd';
  }

  /** Wires rows carrying data-cid to open the center drawer by center id. */
  function wireCenterRowClicks(tableEl) {
    Array.prototype.forEach.call(tableEl.querySelectorAll('tr.is-clickable[data-cid]'), function (tr) {
      var cid = parseInt(tr.getAttribute('data-cid'), 10);
      function go() { CenterDetail.open([cid, 'Center #' + cid, 0, 0, 0, 0, 0, 0]); }
      tr.addEventListener('click', go);
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  /** Shared status→badge-color map (CDM communicator explorer). */
  var STATUS_BADGES = {
    'Live (<1h)': 'ok', 'Online (<24h)': 'info', 'Idle (1-7d)': 'warn',
    'Offline (7-30d)': 'warn', 'Dark (>30d)': 'danger', 'Never seen': 'muted'
  };

  /** Shared sortable <th>, used by every paginated table's header (CDM/TOM/Service/SlaRisk/Centers). */
  function sortableHeader(col, sort) {
    var cls = col.num ? ' class="num"' : '';
    if (!col.sortable) return '<th scope="col"' + cls + '>' + col.label + '</th>';
    var sorted = sort.sortBy === col.key;
    var aria = sorted ? (sort.sortDir === 'asc' ? 'ascending' : 'descending') : 'none';
    return '<th scope="col"' + cls + ' aria-sort="' + aria + '">' +
      '<button type="button" class="th-sort" data-sort="' + col.key + '" aria-sort="' + aria + '">' +
      col.label +
      '<svg class="sort-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</button></th>';
  }

  /* ── communicator explorer (CDM view) ───────────────────────────
     The Asset page's own Device explorer (same shape, minus Latency/Retries/
     free-space/ECG-count/hardware-version) was removed 2026-08-19 — cloud_devices
     data is CDM/Numbers/Raw-Data only now. No status chips/hub filter here —
     global filters + search already cover it. */
  var CDM_COLUMNS = [
    { key: 'device', label: 'Device', sortable: true },
    { key: 'status', label: 'Status', sortable: false },
    { key: 'center', label: 'Center', sortable: true },
    { key: 'hub', label: 'Hub', sortable: true },
    { key: 'last_seen', label: 'Last seen', sortable: true, num: true },
    { key: 'csq', label: 'Signal', sortable: true, num: true },
    { key: 'battery', label: 'Battery', sortable: true, num: true },
    { key: 'latency', label: 'Latency', sortable: true, num: true },
    { key: 'retries', label: 'Retries', sortable: true, num: true },
    { key: 'space', label: 'Free space', sortable: true, num: true },
    { key: 'ecg', label: 'ECG count', sortable: true, num: true },
    { key: 'hardware', label: 'Hardware', sortable: false }
  ];

  function buildCdmDeviceHeader() {
    $('cdmDeviceTableHead').innerHTML = CDM_COLUMNS.map(function (col) {
      return sortableHeader(col, state.cdmDevices);
    }).join('');
    Array.prototype.forEach.call($('cdmDeviceTableHead').querySelectorAll('.th-sort'), function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-sort');
        if (state.cdmDevices.sortBy === key) {
          state.cdmDevices.sortDir = state.cdmDevices.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.cdmDevices.sortBy = key;
          state.cdmDevices.sortDir = 'desc';
        }
        state.cdmDevices.page = 0;
        buildCdmDeviceHeader();
        loadCdmDevices();
      });
    });
  }

  var cdmDevicesRequestId = 0;
  function loadCdmDevices() {
    var requestId = ++cdmDevicesRequestId;
    $('cdmDeviceTableInfo').textContent = 'Loading…';
    var sentFilters = JSON.parse(JSON.stringify(state.globalFilters));
    var query = Object.assign({}, state.cdmDevices, { search: state.search, filters: state.globalFilters });
    gsCall('apiGetCdmDevices', query)
      .then(function (result) {
        if (requestId !== cdmDevicesRequestId) return;
        state.cdmDeviceFilters = sentFilters;
        state.cdmDeviceRows = result.rows;
        state.cdmDeviceTotal = result.totalRows;
        renderCdmDeviceTable();
      })
      .catch(function (err) {
        if (requestId !== cdmDevicesRequestId) return;
        $('cdmDeviceTableInfo').textContent = 'Failed to load communicators';
        toast('Communicator list failed: ' + err.message, 'error');
      });
  }

  function renderCdmDeviceTable() {
    var body = $('cdmDeviceTable').querySelector('tbody');
    if (!state.cdmDeviceRows.length) {
      body.innerHTML = '<tr><td colspan="' + CDM_COLUMNS.length + '">' +
        '<div class="chart-empty" style="padding:32px 0">' +
        '<strong>No communicators match</strong><span>Try clearing the search</span>' +
        '</div></td></tr>';
    } else {
      body.innerHTML = state.cdmDeviceRows.map(function (r) {
        var badge = STATUS_BADGES[r.status] || 'muted';
        var batteryText = r.battery === '' ? '—' :
          (isNaN(parseInt(r.battery, 10)) ? r.battery : parseInt(r.battery, 10) + '%');
        return '<tr>' +
          '<td><strong>' + escapeHtml(r.device) + '</strong></td>' +
          '<td><span class="badge badge-' + badge + '">' + escapeHtml(r.status) + '</span></td>' +
          '<td>' + escapeHtml(r.center || '—') + '</td>' +
          '<td>' + escapeHtml(r.hub || '—') + '</td>' +
          '<td class="num" title="' + escapeHtml(r.last_seen || '') + '">' + escapeHtml(relTime(r.last_seen)) + '</td>' +
          '<td class="num">' + (r.csq == null ? '—' : escapeHtml(r.csq)) + '</td>' +
          '<td class="num">' + escapeHtml(batteryText) + '</td>' +
          '<td class="num">' + (r.latency == null ? '—' : FMT.format(r.latency) + ' ms') + '</td>' +

  /**
   * Each card's header carries the metric's total; the breakdown renders
   * lazily the first time that card is expanded, not eagerly for all three on
   * load. An expanded card takes the full page width (see
   * .flow-card:has(details[open]) in Styles.html), which the flow spends on
   * two label columns and the ribbon span between them — the horizontal reach
   * that makes the decomposition read as a flow rather than as an indented
   * list. The total lives here and only here: Charts.decompFlow draws the
   * payload root's children, never the root itself, so the number isn't
   * printed twice on the same card.
   *
   * `levels` names the two ranks for each card. It is not decoration —
   * decompFlow prints them as the two column captions (which is what tells a
   * reader which way the diagram flows), uses the singular AND the plural in
   * its aggregate labels and tooltips (a device type really can have exactly
   * "1 age band"), and needs `ordinal2` to know that device age bands are an
   * ORDERED scale. That flag does two things: it keeps the breakdown in
   * server order (the other two cards' level-2 children are re-sorted by
   * count, so their fold folds the genuinely smallest members — ServiceWRK's
   * outcomes arrive unsorted from BigQuery), and it makes a partial fold a
   * contiguous range ("2-3y → 5y+") rather than a "+2 more" bag that would
   * stand for two non-adjacent bands. A band too short to split at all is
   * labelled by COUNT either way ("5 age bands"), never by its full range,
   * which would read as one band. Plurals are spelled out because "Country"
   * does not pluralise by suffix.
   */
  var OVERVIEW_FLOW_CARDS = [
    { details: 'flowDetailsCustomers', chart: 'flowCustomers', total: 'flowTotalCustomers', key: 'customers',
      levels: { l1: 'Country', l1s: 'countries', l2: 'Segment', l2s: 'segments', ordinal2: false } },
    { details: 'flowDetailsDevices', chart: 'flowDevices', total: 'flowTotalDevices', key: 'devices',
      levels: { l1: 'Device type', l1s: 'device types', l2: 'Age band', l2s: 'age bands', ordinal2: true } },
    { details: 'flowDetailsTickets', chart: 'flowTickets', total: 'flowTotalTickets', key: 'tickets',
      levels: { l1: 'Source system', l1s: 'source systems', l2: 'Outcome', l2s: 'outcomes', ordinal2: false } }
  ];

  function renderOverviewFlowCard_(card) {
    var payload = state.overviewFlowData;
    if (!payload) return;
    Charts.decompFlow(card.chart, payload[card.key],
      { levels: card.levels });
  }

  // Wired once: an open card's flow re-renders whenever fresh data arrives
  // (see renderOverviewFlow); a closed card renders the first time a user
  // opens it, always against state.overviewFlowData at that moment (never
  // stale, since renderOverviewFlow above always updates it first).
  var overviewFlowTogglesWired_ = false;
  function setupOverviewFlowToggles_() {
    if (overviewFlowTogglesWired_) return;
    overviewFlowTogglesWired_ = true;
    OVERVIEW_FLOW_CARDS.forEach(function (card) {
      $(card.details).addEventListener('toggle', function () {
        if (this.open) renderOverviewFlowCard_(card);
      });
    });
  }

  function renderOverviewFlow(payload) {
    setupOverviewFlowToggles_();
    OVERVIEW_FLOW_CARDS.forEach(function (card) {
      var node = payload[card.key];
      countUp($(card.total), node ? node.value : 0);
      if ($(card.details).open) renderOverviewFlowCard_(card);
    });
  }

  function renderPager(total, pageState, infoId, indicatorId, prevId, nextId, noun) {
    var from = total === 0 ? 0 : pageState.page * pageState.pageSize + 1;
    var to = Math.min(total, (pageState.page + 1) * pageState.pageSize);
    $(infoId).textContent = 'Showing ' + FMT.format(from) + '–' + FMT.format(to) +
      ' of ' + FMT.format(total) + ' ' + noun;
    var totalPages = Math.max(1, Math.ceil(total / pageState.pageSize));
    $(indicatorId).textContent = (pageState.page + 1) + ' / ' + totalPages;
    $(prevId).disabled = pageState.page === 0;
    $(nextId).disabled = pageState.page + 1 >= totalPages;

  function humanAge(days) {
    if (days == null || !isFinite(days)) return '—';
    if (days < 90) return days + 'd';
    if (days < 730) return Math.round(days / 30.4) + ' mo';
    return (days / 365).toFixed(1) + ' yr';

   * below 12 months → whole months. Used everywhere Center Age is shown.

  function centerAge(months) {

    return months >= 12 ? (months / 12).toFixed(1) + ' years' : Math.round(months) + ' months';
  }

  var CDMI = { id: 0, name: 1, lat: 2, lng: 3, devices: 4, online: 5, lowBattery: 6, avgCsq: 7, hub: 8, hubId: 9, state: 10 };

  /** Populates a <select>, preserving the current selection if still present. */
  function fillSelect(id, values, allLabel) {

  /* ── Global filter drawer: state helpers, chips, badge ─────────
   * A single state.globalFilters object (segments/statuses/states/hubs/
   * dateFrom/dateTo) replaces the old v5.8-era per-page/per-tab segment
   * system and applies across every page (Numbers/Raw Data are exempt). */

  /** Deep-enough equality for two filter objects (arrays + strings only). */
  function filtersEqual_(a, b) {
    if (!a || !b) return a === b;
    function arrEq(x, y) {
      if (x.length !== y.length) return false;
      var sx = x.slice().sort(), sy = y.slice().sort();
      return sx.every(function (v, i) { return v === sy[i]; });
    }
    return arrEq(a.segments, b.segments) && arrEq(a.statuses, b.statuses) &&
      arrEq(a.states, b.states) && arrEq(a.hubs, b.hubs) &&
      arrEq(a.cities, b.cities) && arrEq(a.countries, b.countries) &&
      arrEq(a.centers || [], b.centers || []) &&
      arrEq(a.deviceTypes, b.deviceTypes) && arrEq(a.deviceStatusExclude, b.deviceStatusExclude) &&
      arrEq(a.billable || [], b.billable || []) && arrEq(a.machineTypes || [], b.machineTypes || []) &&
      arrEq(a.deviceIds || [], b.deviceIds || []) && arrEq(a.macSerialIds || [], b.macSerialIds || []) &&
      a.dateFrom === b.dateFrom && a.dateTo === b.dateTo;
  }

  function filterActiveCount_(f) {
    return f.segments.length + f.statuses.length + f.states.length + f.hubs.length +
      f.cities.length + f.countries.length + (f.centers || []).length +
      f.deviceTypes.length + f.deviceStatusExclude.length +
      (f.billable || []).length + (f.machineTypes || []).length +
      (f.deviceIds || []).length + (f.macSerialIds || []).length +
      (f.dateFrom ? 1 : 0) + (f.dateTo ? 1 : 0);
  }

  function renderFilterBadge_() {
    var n = filterActiveCount_(state.globalFilters);
    var badge = $('filterBadge');
    badge.textContent = String(n);
    badge.hidden = false; // ALWAYS visible per the design spec — a default Status:Active still counts
  }

  /** Renders one removable chip per active filter VALUE (not per dimension). */
  function renderFilterChips_() {
    var f = state.globalFilters;
    var chips = [];
    f.segments.forEach(function (v) { chips.push({ dim: 'segments', label: 'Segment: ' + v, value: v }); });
    f.statuses.forEach(function (v) { chips.push({ dim: 'statuses', label: 'Status: ' + (v === 'ACTIVE' ? 'Active' : v), value: v }); });
    f.states.forEach(function (v) { chips.push({ dim: 'states', label: 'State: ' + v, value: v }); });
    f.hubs.forEach(function (v) { chips.push({ dim: 'hubs', label: 'Hub: ' + v, value: v }); });
    f.cities.forEach(function (v) { chips.push({ dim: 'cities', label: 'City: ' + v, value: v }); });
    f.countries.forEach(function (v) { chips.push({ dim: 'countries', label: 'Country: ' + v, value: v }); });
    // Center stores a CenterID but shows its name — see filterLabelFor_.
    (f.centers || []).forEach(function (v) { chips.push({ dim: 'centers', label: 'Center: ' + filterLabelFor_('centers', v), value: v }); });
    f.deviceTypes.forEach(function (v) { chips.push({ dim: 'deviceTypes', label: 'Device type: ' + v, value: v }); });
    f.deviceStatusExclude.forEach(function (v) { chips.push({ dim: 'deviceStatusExclude', label: 'Hides: ' + v, value: v }); });
    (f.billable || []).forEach(function (v) { chips.push({ dim: 'billable', label: 'Billable: ' + v, value: v }); });
    (f.machineTypes || []).forEach(function (v) { chips.push({ dim: 'machineTypes', label: 'Machine type: ' + v, value: v }); });
    (f.deviceIds || []).forEach(function (v) { chips.push({ dim: 'deviceIds', label: 'Device ID: ' + v, value: v }); });
    (f.macSerialIds || []).forEach(function (v) { chips.push({ dim: 'macSerialIds', label: 'Mac Serial ID: ' + v, value: v }); });
    if (f.dateFrom || f.dateTo) chips.push({ dim: 'date', label: 'Date: ' + (f.dateFrom || '…') + '–' + (f.dateTo || '…'), value: null });

    $('filterChips').innerHTML = chips.map(function (c, i) {
      return '<span class="filter-chip-item" data-i="' + i + '">' + escapeHtml(c.label) +
        '<button type="button" aria-label="Remove ' + escapeHtml(c.label) + '">×</button></span>';
    }).join('');

    Array.prototype.forEach.call($('filterChips').querySelectorAll('.filter-chip-item button'), function (btn, i) {
      btn.addEventListener('click', function () {
        var c = chips[i];
        if (c.dim === 'date') { state.globalFilters.dateFrom = ''; state.globalFilters.dateTo = ''; }
        else state.globalFilters[c.dim] = state.globalFilters[c.dim].filter(function (v) { return v !== c.value; });
        commitGlobalFilters_();
      });
    });
  }

  /** Display label for a stored filter VALUE. Only dimensions whose stored
   *  value differs from what the user should read have entries — Center filters
   *  on the unique CenterID but must display the center's name. Everything else
   *  falls back to the value itself. Populated by renderFilterCombo_ and kept
   *  in state so labels survive the drawer closing and reopening. */
  function filterLabelFor_(dim, value) {
    var byDim = state.filterLabels && state.filterLabels[dim];
    return (byDim && byDim[value]) || value;
  }

  var FILTER_DIM_LABELS = { segments: 'segment', statuses: 'status', states: 'state', hubs: 'hub', cities: 'city', countries: 'country',
    centers: 'center', deviceTypes: 'device type', deviceStatusExclude: 'device status',
    billable: 'billable', machineTypes: 'machine type', deviceIds: 'device ID', macSerialIds: 'MAC serial ID' };
  // Plain "+ 's'" mispluralizes status -> statuss and city -> citys; the only
  // two dimensions that need their own irregular plural (the others already
  // end cleanly in a consonant).
  var FILTER_DIM_PLURAL = { segments: 'segments', statuses: 'statuses', states: 'states', hubs: 'hubs', cities: 'cities', countries: 'countries',
    centers: 'centers', deviceTypes: 'device types', deviceStatusExclude: 'device statuses',
    billable: 'billable', machineTypes: 'machine types', deviceIds: 'device IDs', macSerialIds: 'MAC serial IDs' };

  /**
   * Filter-drawer accordion groups (declutter pass, per user 2026-08-18):
   * 10 dimensions in one flat scroll read as undifferentiated blocks, so
   * they're grouped into 4 collapsible <details> sections. Each group's
   * badge (and open/closed state on drawer-open) is driven from this map —
   * add a new dimension to the matching group's array and both the badge
   * count and the auto-expand-if-active behaviour pick it up for free.
   */
  var FILTER_GROUPS_ = {
    fgCore: ['statuses', 'segments'],
    fgLocation: ['states', 'hubs', 'centers', 'cities', 'countries'],
    fgDevice: ['deviceTypes', 'deviceStatusExclude'],
    // Billable/MachineType/DeviceID/MacSerialID (per user, 2026-08-21) — all 4
    // are center_details columns, distinct from fgDevice's Jira-sourced
    // dimensions, so they get their own group rather than blurring what
    // "Device (Jira)" means.
    fgHardware: ['billable', 'machineTypes', 'deviceIds', 'macSerialIds']
    // fgDate is date-range, handled separately (not an array dimension).
  };

  /** Live "N selected" badge per accordion group, read from the STAGED (pending) filters. */
  function updateFilterGroupCounts_() {
    var f = state.globalFiltersPending || {};
    Object.keys(FILTER_GROUPS_).forEach(function (groupId) {
      var n = FILTER_GROUPS_[groupId].reduce(function (sum, dim) { return sum + ((f[dim] || []).length); }, 0);
      var badge = $('fgCount' + groupId.slice(2));
      if (badge) { badge.hidden = !n; badge.textContent = n; }
    });
    var dateN = (f.dateFrom ? 1 : 0) + (f.dateTo ? 1 : 0);
    var dateBadge = $('fgCountDate');
    if (dateBadge) { dateBadge.hidden = !dateN; dateBadge.textContent = dateN; }
  }

  /** Opens a group by id if it has an active filter, leaves user's own toggle alone otherwise. */
  function autoExpandFilterGroups_() {
    var f = state.globalFiltersPending || {};
    Object.keys(FILTER_GROUPS_).forEach(function (groupId) {
      var has = FILTER_GROUPS_[groupId].some(function (dim) { return (f[dim] || []).length; });
      var el = $(groupId);
      if (el && has) el.open = true;
    });
    var fgDate = $('fgDate');
    if (fgDate && (f.dateFrom || f.dateTo)) fgDate.open = true;
  }

  /**
   * Focus-trap + focus-restore for a modal drawer (`#filterDrawer` and
   * `#centerDrawer` both already carry role="dialog"/aria-modal="true" and a
   * tabindex="-1" panel — this supplies the JS behavior that markup alone
   * doesn't: keyboard focus was previously free to escape into the
   * background page while a drawer was open (live-reproduced on both).
   * One implementation, not two: both drawers need the identical behavior,
   * only the panel id differs.
   * @param {string} panelId
   * @return {{activate: function(), deactivate: function()}}
   */
  function makeFocusTrap_(panelId) {
    var lastFocused = null;
    var FOCUSABLE_SELECTOR = 'a[href], button:not([disabled]), textarea:not([disabled]), ' +
      'input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';

    function focusableEls_() {
      var panel = $(panelId);
      return Array.prototype.filter.call(panel.querySelectorAll(FOCUSABLE_SELECTOR),
        function (el) { return el.offsetParent !== null; }); // visible only
    }

    function onKeydown_(event) {
      if (event.key !== 'Tab') return;
      var els = focusableEls_();
      if (!els.length) return; // nothing inside yet (e.g. still loading) — leave focus on the panel
      var first = els[0], last = els[els.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault(); last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault(); first.focus();
      }
    }

    return {
      // Called right after the drawer becomes visible. Focus lands on the
      // panel itself (not its first control): both drawers render content
      // asynchronously (filter groups/center details load after open()), so
      // there is no reliable "first focusable element" at the moment of
      // opening — the panel's own aria-label is what a screen reader has to
      // announce regardless.
      activate: function () {
        lastFocused = document.activeElement;
        document.addEventListener('keydown', onKeydown_);
        $(panelId).focus();
      },
      // Called right before the drawer hides. Restores focus to whatever
      // opened it (a table row, a nav button, etc.) rather than dropping
      // focus to <body>, which is what "hidden = true" alone does.
      deactivate: function () {
        document.removeEventListener('keydown', onKeydown_);
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
        lastFocused = null;
      }
    };
  }

  var filterFocusTrap_ = makeFocusTrap_('filterDrawer');
  var onboardFocusTrap_ = makeFocusTrap_('onboardModal');

  /** Shows the first-run welcome panel once, gated by localStorage (HANDOFF #13). */
  function maybeShowOnboarding_() {
    if (localStorage.getItem('sip.onboardingSeen') === '1') return;
    $('onboardScrim').hidden = false;
    $('onboardModal').hidden = false;
    onboardFocusTrap_.activate();
  }

  function dismissOnboarding_() {
    if ($('onboardModal').hidden) return;
    localStorage.setItem('sip.onboardingSeen', '1');
    onboardFocusTrap_.deactivate();
    $('onboardScrim').hidden = true;
    $('onboardModal').hidden = true;
  }

  function openFilterDrawer_(preserveStaged) {
    // preserveStaged: true when the caller (Clear all) already staged the
    // pending edits it wants shown — a plain open must still snapshot the
    // LIVE filters into pending, but Clear must not have that snapshot
    // clobber the cleared values it just set.
    if (!preserveStaged) state.globalFiltersPending = JSON.parse(JSON.stringify(state.globalFilters));
    // Segment/State read the STICKY option lists, not state.lastDashboard: the
    // drawer opens from every tab, including the four that never populate a
    // dashboard payload (Map/Top Customers/Numbers/Raw Data), where reading it
    // off the payload rendered empty lists (review finding I3).
    renderFilterCombo_('filterSegment', 'segments', (state.segmentOptions || []).map(function (s) { return s.segment; }));
    // Only 2 real values (ACTIVE/DEACTIVATED, plus a handful of blank rows not
    // offered here — same known gap the old toggle had) — a static list like
    // Segment/State, not a remote search.
    renderFilterCombo_('filterStatus', 'statuses', ['ACTIVE', 'DEACTIVATED']);
    renderFilterCombo_('filterState', 'states', (state.stateOptions || []).map(function (s) { return s.state; }));
    // Hub has no option list to read — 13,721 distinct values, searched
    // server-side per keystroke instead (review finding C1).
    renderFilterCombo_('filterHub', 'hubs', [], searchHubs_);
    // Center is server-searched for the same reason as Hub — ~28k centers is
    // far too many to ship as a static list. Options are {value: CenterID,
    // label: "Name · #id"} so the filter keys on the unique id.
    renderFilterCombo_('filterCenter', 'centers', [], searchCenters_);
    renderFilterCombo_('filterCity', 'cities', (state.cityOptions || []).map(function (s) { return s.city; }));
    renderFilterCombo_('filterCountry', 'countries', (state.countryOptions || []).map(function (s) { return s.country; }));
    renderFilterCombo_('filterDeviceType', 'deviceTypes', (state.deviceTypeOptions || []).map(function (s) { return s.type; }));
    renderFilterCombo_('filterDeviceStatus', 'deviceStatusExclude', (state.deviceStatusOptions || []).map(function (s) { return s.status; }));
    // Billable/MachineType/DeviceID/MacSerialID (per user, 2026-08-21) — 4 more
    // center_details filter dimensions. Billable has only 2 real values
    // (YES/NO), a static list like Status; MachineType (18 distinct values)
    // ships a static server list like City/Country; DeviceID (~7.4k) and
    // MacSerialID (~16k) are Hub-scale, so both are server-searched instead.
    renderFilterCombo_('filterBillable', 'billable', ['YES', 'NO']);
    renderFilterCombo_('filterMachineType', 'machineTypes', (state.machineTypeOptions || []).map(function (s) { return s.machineType; }));
    renderFilterCombo_('filterDeviceId', 'deviceIds', [], searchDeviceIds_);
    renderFilterCombo_('filterMacSerialId', 'macSerialIds', [], searchMacSerialIds_);
    $('filterDateFrom').value = state.globalFiltersPending.dateFrom;
    $('filterDateTo').value = state.globalFiltersPending.dateTo;
    autoExpandFilterGroups_();
    updateFilterGroupCounts_();
    $('filterScrim').hidden = false;
    $('filterDrawer').hidden = false;
    $('globalFilterBtn').setAttribute('aria-expanded', 'true');
    filterFocusTrap_.activate();
  }

  function closeFilterDrawer_() {
    filterFocusTrap_.deactivate();
    state.globalFiltersPending = null;
    $('filterScrim').hidden = true;
    $('filterDrawer').hidden = true;
    $('globalFilterBtn').setAttribute('aria-expanded', 'false');
  }

  /**
   * Debounced server-side Hub search (review finding C1).
   *
   * Hub can't use the static-option-list path State/Segment use: center_details
   * holds 13,721 distinct HubName values, so the server has no hubOptions spec
   * at all any more — apiSearchHubsCD answers per keystroke instead (top 50 by
   * center count when the box is empty, name matches once there are 2+ chars).
   * Results are memoised per query string for the life of the page: reopening
   * the drawer and retyping the same prefix costs no round-trip.
   * @param {string} query
   * @param {function(Array<string>, Error=)} done
   */
  var hubSearchCache = {};

  var FILTER_COMBO_DEBOUNCE_MS = 275;

  /**
   * Searchable multi-select combobox (State/Hub — large, unbounded value sets).
   * @param {string} containerId
   * @param {string} dim key into state.globalFiltersPending
   * @param {Array<string>} allOptions the complete option list, filtered in JS
   *   as the user types. Pass [] when `remoteSearch` is supplied.
   * @param {function(string, function(Array<string>, Error=))=} remoteSearch
   *   when given, the list is populated by this debounced async lookup instead
   *   of by filtering allOptions (Hub — see searchHubs_). Everything else about
   *   the control is identical, so State and Hub look and behave the same.
   */
  function renderFilterCombo_(containerId, dim, allOptions, remoteSearch) {
    var container = $(containerId);
    container.innerHTML =
      '<input type="text" class="input filter-combo-input" placeholder="Search ' + FILTER_DIM_PLURAL[dim] + '…">' +
      '<div class="filter-combo-list" hidden></div>' +
      '<div class="filter-combo-selected"></div>';
    var input = container.querySelector('.filter-combo-input');
    var list = container.querySelector('.filter-combo-list');
    var selectedEl = container.querySelector('.filter-combo-selected');
    var debounceTimer = null;
    var searchSeq = 0;

    /* An option is either a plain string (value === label, how
       Segment/Status/State/Hub have always worked) or a {value, label} pair,
       which Center needs: it must FILTER on the unique CenterID but DISPLAY the
       human name, since center names are not unique. */
    function normOpt(o) {
      return (o && typeof o === 'object')
        ? { value: String(o.value), label: String(o.label) }
        : { value: String(o), label: String(o) };
    }
    /* Labels are remembered in state (not a local closure) so a selected value
       still shows its name after the drawer is closed and reopened, and so the
       top-level chip row can render "Center: Demo Center 345 · #8552" rather
       than a bare id. */
    function rememberLabel(opt) {
      var n = normOpt(opt);
      if (n.value === n.label) return;
      state.filterLabels[dim] = state.filterLabels[dim] || {};
      state.filterLabels[dim][n.value] = n.label;
    }

    function renderSelected() {
      var arr = state.globalFiltersPending[dim];
      selectedEl.innerHTML = arr.map(function (v) {
        var label = filterLabelFor_(dim, v);
        return '<span class="filter-chip-item" data-v="' + escapeHtml(v) + '">' + escapeHtml(label) +
          '<button type="button" aria-label="Remove ' + escapeHtml(label) + '">×</button></span>';
      }).join('');
      Array.prototype.forEach.call(selectedEl.querySelectorAll('button'), function (btn) {
        btn.addEventListener('click', function () {
          var v = btn.parentElement.getAttribute('data-v');
          state.globalFiltersPending[dim] = state.globalFiltersPending[dim].filter(function (x) { return x !== v; });
          renderSelected();
        });
      });
      updateFilterGroupCounts_();
    }

    /** Paints the checkbox list. Identical markup for both code paths. */
    function paintList(values) {
      // No staged state = the drawer closed under us (see renderList's note).
      if (!state.globalFiltersPending) return;
      var opts = values.map(normOpt);
      opts.forEach(rememberLabel);
      list.innerHTML = opts.map(function (o) {
        var checked = state.globalFiltersPending[dim].indexOf(o.value) !== -1 ? ' checked' : '';
        return '<label><input type="checkbox" value="' + escapeHtml(o.value) + '"' + checked + '> ' +
          escapeHtml(o.label) + '</label>';
      }).join('');
      Array.prototype.forEach.call(list.querySelectorAll('input'), function (cb) {
        cb.addEventListener('change', function () {
          var v = cb.value, arr = state.globalFiltersPending[dim];
          if (cb.checked && arr.indexOf(v) === -1) arr.push(v);
          else if (!cb.checked) state.globalFiltersPending[dim] = arr.filter(function (x) { return x !== v; });
          renderSelected();
        });
      });
    }

    /** A plain non-interactive row (searching/failed/no-match states). */
    function paintNote(text) {
      list.innerHTML = '<label class="filter-combo-note">' + escapeHtml(text) + '</label>';
    }

    function renderList(query) {
      if (!remoteSearch) {
        var q = query.toLowerCase();
        // Matches against the LABEL, which for string options is the value too.
        paintList(allOptions.filter(function (v) {
          return normOpt(v).label.toLowerCase().indexOf(q) !== -1;
        }).slice(0, 50));
        return;
      }
      // Latest-wins: an older in-flight lookup must never overwrite the list a
      // newer keystroke already owns (same guard as loadDashboard's requestId).
      var seq = ++searchSeq;
      paintNote('Searching…');
      remoteSearch(query, function (values, err) {
        if (seq !== searchSeq) return;
        // The drawer can close (Escape / scrim / Apply) while a lookup is in
        // flight, which clears the staged edits this list renders against —
        // painting then threw on state.globalFiltersPending[dim]. Reopening
        // re-renders from scratch, so dropping the late result is correct.
        if (!state.globalFiltersPending) return;
        if (err) { paintNote('Search failed — try again'); return; }
        if (!values.length) { paintNote('No ' + FILTER_DIM_LABELS[dim] + ' matches'); return; }
        paintList(values);
      });
    }

    /** Debounces only the remote path; local filtering is instant. */
    function requestList(query) {
      if (!remoteSearch) { renderList(query); return; }
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () { renderList(query); }, FILTER_COMBO_DEBOUNCE_MS);
    }

    // .filter-combo-list is position:fixed (see Styles.html for why — the
    // drawer body's own overflow-y:auto clips absolutely-positioned dropdowns
    // that open below the visible area, which is exactly what hid the LAST
    // field's dropdown in each accordion group). Fixed positioning needs its
    // coordinates computed here, since "float below this input" isn't
    // expressible in CSS once the element is out of normal flow.
    var drawerBody = container.closest('.center-panel-body');
    function positionList_() {
      var r = input.getBoundingClientRect();
      // Anchor input scrolled out of the drawer's visible area (the accordion
      // body scrolled, but the dropdown isn't clipped anymore so it would
      // otherwise float disconnected from its input) — close it instead of
      // showing a floating list nothing points at.
      if (drawerBody) {
        var br = drawerBody.getBoundingClientRect();
        if (r.bottom < br.top || r.top > br.bottom) { list.hidden = true; return; }
      }
      list.style.left = r.left + 'px';
      list.style.width = r.width + 'px';
      // Flip above the input when there isn't 200px (max-height) of room
      // below — same reasoning as the clipping this replaces: never let the
      // list run off the visible viewport either.
      var spaceBelow = window.innerHeight - r.bottom;
      if (spaceBelow < 200 && r.top > spaceBelow) {
        list.style.top = 'auto';
        list.style.bottom = (window.innerHeight - r.top + 4) + 'px';
      } else {
        list.style.bottom = 'auto';
        list.style.top = (r.bottom + 4) + 'px';
      }
    }

    input.addEventListener('focus', function () {
      list.hidden = false;
      positionList_();
      renderList(input.value); // no debounce: focus shows the default set at once
    });
    input.addEventListener('input', function () { requestList(input.value); });
    document.addEventListener('click', function (e) {
      if (!container.contains(e.target)) list.hidden = true;
    });
    // Capture phase: the drawer body's scroll event doesn't bubble to window,
    // but capture-phase listeners on window still see it trickle down. Cheap
    // no-op when this combobox's own list is closed, so this doesn't get
    // meaningfully worse each time the drawer reopens (renderFilterCombo_
    // already re-adds its click listener per open — a pre-existing, separate
    // issue, not one this change should compound further).
    window.addEventListener('scroll', function () { if (!list.hidden) positionList_(); }, true);
    window.addEventListener('resize', function () { if (!list.hidden) positionList_(); });
    renderSelected();
  }

  /** Copies the staged (pending) edits into the live filter, closes the drawer, reapplies. */
  function commitGlobalFilters_() {
    renderFilterBadge_();
    renderFilterChips_();
    // Reset every lazy-load flag so every page refetches fresh under the new
    // filter set — mirrors the old v5.7/5.8 Active-only toggle's invalidation.
    // Numbers/Raw Data now respect the global filter too (per user,
    // 2026-08-13); they refetch below when active, and via activateTab's
    // numbersFilters/rawDataFilters staleness check otherwise.
    state.execLoaded = false; state.mapLoaded = false; state.topLoaded = false; state.cdmLoaded = false;
    // Invalidate the dashboard payload by marking WHICH filters it belongs to as
    // unknown — NOT by nulling the payload itself. activateTab's refetch guard
    // reads `state.lastDashboard && !filtersEqual_(state.dashFilters, ...)`, so
    // nulling lastDashboard permanently disarmed it on the tabs that never
    // repopulate it (Map/Top Customers/Numbers/Raw Data): tabbing back to
    // Asset/Centers/Support then showed stale pre-filter numbers until the 300s
    // auto-refresh (review finding I2). dashFilters = null keeps the guard armed
    // and forces a definite mismatch (null !== state.globalFilters).
    // Side effect, deliberate: keeping lastDashboard truthy means loadDashboard
    // no longer blanks the charts on a filter change, it swaps them on arrival —
    // the same "silent refresh" the auto-refresh path already uses.
    state.dashFilters = null; state.cdRaw.total = 0; state.cdRaw.page = 0;
    if (state.activeTab === 'tab-centers') { state.centers.page = 0; loadCenters(); }
    var sharesPayload = ['tab-asset', 'tab-centers', 'tab-support', 'tab-service'].indexOf(state.activeTab) !== -1;

    if (state.activeTab === 'tab-topcust') { state.topLoaded = false; loadTopCustomers(); }
    if (state.activeTab === 'tab-cdm') {

    }
    if (state.activeTab === 'tab-overview') { loadOverviewFlow(); state.mapLoaded = false; loadMapData(); }
    if (state.activeTab === 'tab-numbers') { loadNumbers(); loadCdRaw(); }
    if (state.activeTab === 'tab-rawdata') { state.rawData.page = 0; loadRawTable(); }
    // The SLA-risk worklist rides on the Support page but fetches its own rows,
    // so loadDashboard above only refreshes its chart half — the table needs
    // its own reload. Off-tab staleness is caught by activateTab.
    if (state.activeTab === 'tab-support') { state.slaRisk.page = 0; loadSlaRiskTickets(); }
  }

  /** Applies the global filters to the map centers + assets, then redraws. */
  function applyMapFilters() {
    if (!state.mapBundle) return;
    var q = state.search.toLowerCase().trim();

    // Serial/device search: which center IDs contain a matching asset?
    var serialCenterIds = null;
    if (q) {
      serialCenterIds = {};
      state.mapBundle.assets.forEach(function (a) {
        if (String(a[AI.serial]).toLowerCase().indexOf(q) !== -1) serialCenterIds[a[AI.center]] = true;
      });
    }

    // Coverage-gap set: centers with open tickets that no engineer has worked
    // inside the coverage window. Computed from the payload's own
    // coveredCenterIds rather than re-derived here, so the client and
    // buildFseLayer_ can't disagree about who covers what.
    var fse = state.mapBundle.fse || null;
    var coveredIds = {};
    if (fse) (fse.coveredCenterIds || []).forEach(function (id) { coveredIds[String(id)] = true; });

    var centers = state.mapBundle.centers.filter(function (c) {
      var ot = c[CI.tickets] || 0;
      if (state.ticketBucket === 'none' && ot !== 0) return false;
      if (state.ticketBucket === 'low' && !(ot >= 1 && ot <= 3)) return false;
      if (state.ticketBucket === 'high' && ot < 4) return false;
      if (state.mapGapsOnly && (ot === 0 || coveredIds[String(c[CI.id])])) return false;
      if (q) {
        var textHit = String(c[CI.name]).toLowerCase().indexOf(q) !== -1 ||
          String(c[CI.id]).indexOf(q) !== -1 ||
          String(c[CI.hub]).toLowerCase().indexOf(q) !== -1 ||
          String(c[CI.hubId]).indexOf(q) !== -1 ||
          (serialCenterIds && serialCenterIds[c[CI.id]]);
        if (!textHit) return false;
      }
      return true;
    });

    mainMap.setData(centers, CenterDetail.open, { stateIdx: CI.state });
    renderFseLayer_(fse);
    renderCpLayer_(state.mapBundle.cp || null);
  }

<script>
/* ═══════════════════════════════════════════════════════════════════
   Charts.html — every ECharts config in one place.
   Charts render lazily: options are staged per element id and applied
   only while the element is visible (hidden tab panels have zero size),
   then re-applied/resized when a tab becomes active.
   ═══════════════════════════════════════════════════════════════════ */
var Charts = (function () {
  'use strict';

  var REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FMT = new Intl.NumberFormat('en-IN');

  // Series colors are shared across themes (they read well on both). Only the
  // chart "chrome" (text, grid, axis, tooltip, slice borders) flips with theme.
  // Tricog data palette: blue-led data, red for emphasis, teal accent.
  var C = {
    primary: '#2E9BD6', info: '#38BDF8', accent: '#E5344F', ok: '#2FD39B',
    warn: '#F5B301', danger: '#FF6262', violet: '#A78BFA', orange: '#FB923C',
    teal: '#04E0B8', muted: '#64748B',
    // chrome — reassigned by applyTheme()
    text: '#A2B4C8', textDim: '#869AB2',
    grid: 'rgba(46,155,214,0.12)', axis: 'rgba(46,155,214,0.24)',
    tooltipBg: '#0A2340', tooltipText: '#EAF1F8', sliceBorder: '#04182C'
  };

  // Read by decompPalette_(), which needs to know the theme by name rather
  // than infer it from a chrome color it happens to share a value with.
  var THEME = 'dark';

  /** Repoints chart chrome colors for the given theme. */
  function applyTheme(theme) {
    var light = theme === 'light';
    THEME = light ? 'light' : 'dark';
    C.text = light ? '#3E546B' : '#A2B4C8';
    C.textDim = light ? '#566A80' : '#869AB2';
    C.grid = light ? 'rgba(1,41,78,0.08)' : 'rgba(46,155,214,0.12)';
    C.axis = light ? 'rgba(1,41,78,0.20)' : 'rgba(46,155,214,0.24)';
    C.tooltipBg = light ? '#FFFFFF' : '#0A2340';
    C.tooltipText = light ? '#01294E' : '#EAF1F8';
    C.sliceBorder = light ? '#FFFFFF' : '#04182C';
  }

  var instances = {};   // id → echarts instance
  var staged = {};      // id → option waiting to be applied
  var handlers = {};    // id → desired click handler (see onClick/bindClick_)

  function isVisible(el) {
    return !!(el && el.offsetWidth > 0 && el.offsetHeight > 0);
  }

  function base(extra) {
    return Object.assign({
      animation: !REDUCED_MOTION,
      animationDuration: 400,
      animationEasing: 'cubicOut',
      textStyle: { fontFamily: "'Fira Sans', sans-serif", color: C.text },
      tooltip: {
        trigger: 'item',
        backgroundColor: C.tooltipBg,
        borderColor: C.axis,
        textStyle: { color: C.tooltipText, fontSize: 13 },
        confine: true
      },
      grid: { left: 8, right: 16, top: 32, bottom: 8, containLabel: true }
    }, extra || {});
  }

  function catAxis(overrides) {
    return Object.assign({
      type: 'category',
      axisLine: { lineStyle: { color: C.axis } },
      axisTick: { show: false },
      axisLabel: { color: C.textDim, fontSize: 11, hideOverlap: true }
    }, overrides || {});
  }

  function valAxis(overrides) {
    return Object.assign({
      type: 'value',
      splitLine: { lineStyle: { color: C.grid } },
      axisLabel: { color: C.textDim, fontSize: 11 }
    }, overrides || {});
  }

  /** Stage an option; apply immediately when the element is visible. */
  function render(id, option) {
    staged[id] = option;
    var el = document.getElementById(id);
    if (el) {
      el.classList.remove('is-loading');
      if (isVisible(el)) apply_(id);
    }
  }

  function apply_(id) {
    var el = document.getElementById(id);
    if (!el || !staged[id]) return;
    if (!instances[id]) instances[id] = echarts.init(el);
    instances[id].setOption(staged[id], true);
    instances[id].resize();
    bindClick_(id);
  }

  /**
   * (Re)binds the click handler registered for `id` via onClick(), if any.
   * Called from apply_() every time it runs (not just on first init), so a
   * handler registered while the instance didn't exist yet (e.g. the first
   * render landed in a hidden tab panel) still gets attached the first time
   * apply_() actually creates the instance. off() first makes repeat calls
   * idempotent — re-renders never accumulate duplicate listeners, since the
   * one listener that stays bound always reads the CURRENT handlers[id].
   */
  function bindClick_(id) {
    if (!instances[id]) return;
    instances[id].off('click');
    if (handlers[id]) instances[id].on('click', handlers[id]);
  }

  /** Called on tab switch: materialise anything staged inside the panel. */
  function flushVisible() {
    Object.keys(staged).forEach(function (id) {
      var el = document.getElementById(id);
      if (isVisible(el)) apply_(id);
    });
  }

  function setLoading(ids) {
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('is-loading');
    });
  }

  function showEmpty(id, message) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('is-loading');
    if (instances[id]) { instances[id].dispose(); delete instances[id]; }
    delete staged[id];
    el.innerHTML = '<div class="chart-empty"><span>' + (message || 'No data available') + '</span></div>';
  }

  function onClick(id, handler) {
    handlers[id] = handler;
    bindClick_(id);
  }

  window.addEventListener('resize', function () {
    Object.keys(instances).forEach(function (id) {
      var el = document.getElementById(id);
      if (isVisible(el)) instances[id].resize();
    });
  });

  /* ── panel-specific builders ─────────────────────────────────── */

  var FLEET_ORDER = ['Live (<1h)', 'Online (<24h)', 'Idle (1-7d)', 'Offline (7-30d)', 'Dark (>30d)', 'Never seen'];
  var FLEET_COLORS = {
    'Live (<1h)': C.ok, 'Online (<24h)': C.primary, 'Idle (1-7d)': C.warn,
    'Offline (7-30d)': C.orange, 'Dark (>30d)': C.danger, 'Never seen': C.muted
  };

  function fleetStatus(rows, onSlice, id) {
    id = id || 'chartFleetStatus';
    if (!rows || !rows.length) return showEmpty(id);
    var byStatus = {};
    rows.forEach(function (r) { byStatus[r.status] = r.cnt; });
    var data = FLEET_ORDER.filter(function (s) { return byStatus[s]; })
      .map(function (s) {
        return { name: s, value: byStatus[s], itemStyle: { color: FLEET_COLORS[s] } };
      });
    render(id, base({
      legend: {
        bottom: 0, icon: 'circle',
        textStyle: { color: C.text, fontSize: 12 },
        itemWidth: 9, itemHeight: 9
      },
      series: [{
        type: 'pie', radius: ['58%', '80%'], center: ['50%', '44%'],
        avoidLabelOverlap: true,
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        emphasis: {
          label: {
            show: true, fontSize: 14, fontWeight: 700, color: C.tooltipText,
            formatter: function (p) { return p.name + '\n' + FMT.format(p.value); }
          },
          scaleSize: 4
        },
        data: data
      }]
    }));
    if (onSlice) onClick(id, function (p) { onSlice(p.name); });
  }

  // Jira lifecycle-status categories are open-ended (Deployed/Store/Hardware/
  // Decommissioned/Field/Exported/…), unlike the fixed 6-bucket FLEET_ORDER —
  // so colors cycle through this palette by rank instead of a name lookup.
  // ok and teal are both green/turquoise and read as the same color in a
  // legend at a glance — kept apart here so they don't land in the same
  // chart together (most lifecycle breakdowns only use the first 5-6).
  var STATUS_PALETTE = [C.primary, C.ok, C.warn, C.violet, C.info, C.orange, C.teal, C.danger, C.muted];

  function jiraStatus(rows, id) {
    id = id || 'execFleet';
    if (!rows || !rows.length) return showEmpty(id);
    var sorted = rows.slice().sort(function (a, b) { return (b.n || 0) - (a.n || 0); });
    var data = sorted.map(function (r, i) {
      return { name: r.k, value: r.n, itemStyle: { color: STATUS_PALETTE[i % STATUS_PALETTE.length] } };
    });
    render(id, base({
      legend: {
        bottom: 0, icon: 'circle',
        textStyle: { color: C.text, fontSize: 12 },
        itemWidth: 9, itemHeight: 9
      },
      series: [{
        type: 'pie', radius: ['58%', '80%'], center: ['50%', '44%'],
        avoidLabelOverlap: true,
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        emphasis: {
          label: {
            show: true, fontSize: 14, fontWeight: 700, color: C.tooltipText,
            formatter: function (p) { return p.name + '\n' + FMT.format(p.value); }
          },
          scaleSize: 4
        },
        data: data
      }]
    }));
  }


  function geo(rows, id) {
    id = id || 'chartGeo';
    if (!rows || !rows.length) return showEmpty(id);
    var sorted = rows.slice().reverse();
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: 8, right: 24, top: 12, bottom: 8, containLabel: true },
      xAxis: valAxis(),
      yAxis: catAxis({ data: sorted.map(function (r) { return r.state; }),
        axisLabel: { color: C.text, fontSize: 11, width: 110, overflow: 'truncate' } }),
      series: [{
        name: 'Centers',
        type: 'bar', barMaxWidth: 14,
        itemStyle: {
          borderRadius: [0, 6, 6, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: 'rgba(56,189,248,0.55)' },
            { offset: 1, color: C.info }
          ])
        },
        data: sorted.map(function (r) { return r.devices; })
      }]
    }));
  }

  function horizontalBar(id, rows, labelKey, valueKey, color) {
    if (!rows || !rows.length) return showEmpty(id);
    var sorted = rows.slice().reverse();
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      // right: 44 (was 28) to fit the value label these bars draw outside their
      // own end. containLabel only reserves room for AXIS labels, not series
      // labels, so the longest bar — which by definition reaches the axis max —
      // pushed its label past the chart edge and got clipped ("4,979" rendered
      // as "4,97"). 44 matches rankBar below, which already reserved enough.
      grid: { left: 8, right: 44, top: 12, bottom: 8, containLabel: true },
      xAxis: valAxis(),
      yAxis: catAxis({ data: sorted.map(function (r) { return r[labelKey]; }),
        axisLabel: { color: C.text, fontSize: 11, width: 170, overflow: 'truncate' } }),
      series: [{
        type: 'bar', barMaxWidth: 15,
        itemStyle: { borderRadius: [0, 6, 6, 0], color: color },
        label: {
          show: true, position: 'right', color: C.textDim, fontSize: 11,
          formatter: function (p) { return FMT.format(p.value); }
        },
        data: sorted.map(function (r) { return r[valueKey]; })
      }]
    }));
  }

  function assetStatus(rows) { horizontalBar('chartAssetStatus', rows, 'label', 'cnt', C.primary); }
  function assetTypes(rows)  { horizontalBar('chartAssetTypes', rows, 'label', 'cnt', C.violet); }
  function zohoCategories(rows) { horizontalBar('chartZohoCategories', rows, 'category', 'cnt', C.info); }
  function firmware(rows)    { horizontalBar('chartFirmware', rows, 'firmware', 'devices', C.info); }
  function cdmHardware(rows) { horizontalBar('chartCdmHardware', rows, 'hw', 'devices', C.violet); }

  // Fixed band order (0/1-5/6-20/21+), not by count — this is a natural
  // progression, not a ranked breakdown (mirrors deploymentAge's AGE_ORDER pattern).
  var ECG_ORDER = ['0', '1-5', '6-20', '21+'];
  function cdmEcg(rows) {
    if (!rows || !rows.length) return showEmpty('chartCdmEcg');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.k] = r.n; });
    var cats = ECG_ORDER.filter(function (b) { return byBand[b]; });
    render('chartCdmEcg', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        itemStyle: {
          borderRadius: [6, 6, 0, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: C.teal }, { offset: 1, color: 'rgba(4,224,184,0.3)' }])
        },
        data: cats.map(function (b) { return byBand[b]; })
      }]
    }));
  }
  function zohoSegment(rows) { horizontalBar('chartZohoSegment', rows, 'segment', 'cnt', C.primary); }

  // Matches the Asset-page Device age chart's bands exactly (see deviceAges below).
  var AGE_ORDER = ['<1y', '1-2y', '2-3y', '3-5y', '5y+'];

  function deploymentAge(rows) {
    if (!rows || !rows.length) return showEmpty('chartDeploymentAge');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.band] = r.devices; });
    var cats = AGE_ORDER.filter(function (b) { return byBand[b]; });
    render('chartDeploymentAge', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        itemStyle: {
          borderRadius: [6, 6, 0, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: C.primary },
            { offset: 1, color: 'rgba(46,155,214,0.45)' }
          ])
        },
        data: cats.map(function (b) { return byBand[b]; })
      }]
    }));
  }

  /** Device-age distribution (Jira fleet). rows = [{k,n}] in
   *  band order; the 5y+ band (past the 5-yr expected life) is coloured danger. */
  function deviceAges(rows) {
    if (!rows || !rows.length) return showEmpty('chartDeviceAges');
    var cats = rows.map(function (r) { return r.k; });
    render('chartDeviceAges', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
        valueFormatter: function (v) { return (+v).toLocaleString() + ' devices'; } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        label: { show: true, position: 'top', color: C.textDim, fontSize: 11,
          formatter: function (p) { return (+p.value).toLocaleString(); } },
        data: rows.map(function (r) {
          return { value: r.n, itemStyle: {
            borderRadius: [6, 6, 0, 0],
            color: r.k === '5y+' ? C.danger : new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: C.primary },
              { offset: 1, color: 'rgba(46,155,214,0.45)' }
            ])
          } };
        })
      }]
    }));
  }

  function activeVsEnded(rows) {
    if (!rows || !rows.length) return showEmpty('chartActiveEnded');
    // Card was repurposed to a hub_master_segment breakdown — color each known
    // segment deliberately; unknown values take the rotating palette.
    // Keys are the MERGED names (segmentGroupSql_, server-side — SME/LE
    // variants collapsed), not the old raw "Private - SME"/"LE - Cath Lab" etc.
    var SEGMENT_COLORS = {
      'sme': C.primary, 'government': C.info, 'le': C.violet,
      'echo': C.warn, 'project': C.muted
    };
    function segColor(name, i) {
      return SEGMENT_COLORS[String(name || '').trim().toLowerCase()] || STATUS_PALETTE[i % STATUS_PALETTE.length];
    }
    render('chartActiveEnded', base({
      legend: { bottom: 0, icon: 'circle', textStyle: { color: C.text, fontSize: 12 }, itemWidth: 9, itemHeight: 9 },
      series: [{
        type: 'pie', radius: ['55%', '78%'], center: ['50%', '44%'],
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        emphasis: {
          label: {
            show: true, fontSize: 14, fontWeight: 700, color: C.tooltipText,
            formatter: function (p) { return p.name + '\n' + FMT.format(p.value); }
          }
        },
        data: rows.map(function (r, i) {
          return { name: r.status, value: r.devices,
            itemStyle: { color: segColor(r.status, i) } };
        })
      }]
    }));
  }

  // SQL returns bands alphabetically; this is the order a human reads them
  // in. Same buckets as the Service page's TAT chart (SVC_TAT_ORDER) — one
  // consistent "how long has this been open" vocabulary across the app.
  var ZOHO_OPEN_AGE_ORDER = ['Same day', '1-2d', '3-7d', '8-30d', '30d+'];

  function zohoOpenAge(rows) {
    if (!rows || !rows.length) return showEmpty('chartZohoOpenAge');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.band] = r.cnt; });
    var cats = ZOHO_OPEN_AGE_ORDER.filter(function (b) { return byBand[b]; });
    render('chartZohoOpenAge', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        data: cats.map(function (b) {
          return {
            value: byBand[b],
            // The oldest band is the one that costs SLA — colour it as a
            // warning rather than leaving the reader to find it.
            itemStyle: {
              borderRadius: [6, 6, 0, 0],
              color: b === '30d+' ? C.danger : C.primary
            }
          };
        })
      }]
    }));
  }

  /**
   * SLA risk by issue type — stacked horizontal bar, breached (already past
   * target) alongside at-risk (past 75% of target but not yet breached).
   * Same two thresholds as the "Open breached" / "At-risk" figures on the SLA
   * compliance card, so each bar's total reconciles with those numbers.
   *
   * Rows are pre-sorted biggest-first by the server; reversed here for the
   * same reason rankBar does it — ECharts draws a category axis bottom-up, so
   * the largest lands at the top of the card.
   */
  function slaRisk(rows) {
    if (!rows || !rows.length) return showEmpty('chartSlaRisk', 'Nothing at SLA risk');
    var sorted = rows.slice().reverse();
    // Total sits on the outermost segment; ECharts anchors 'right' to the end
    // of the whole stack, so it reads as one number per issue type.
    function total(i) { return (sorted[i].breached || 0) + (sorted[i].atrisk || 0); }
    render('chartSlaRisk', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { top: 0, textStyle: { color: C.text, fontSize: 12 }, icon: 'circle', itemWidth: 9, itemHeight: 9 },
      grid: { left: 8, right: 48, top: 32, bottom: 0, containLabel: true },
      xAxis: valAxis({ axisLabel: { show: false }, splitLine: { show: false }, axisLine: { show: false } }),
      yAxis: catAxis({ data: sorted.map(function (r) { return r.category; }),
        axisLabel: { color: C.text, fontSize: 11, width: 150, overflow: 'truncate' } }),
      series: [
        {
          name: 'Breached', type: 'bar', stack: 'risk', barMaxWidth: 16,
          itemStyle: { color: C.danger },
          data: sorted.map(function (r) { return r.breached || 0; })
        },
        {
          name: 'At-risk', type: 'bar', stack: 'risk', barMaxWidth: 16,
          itemStyle: { borderRadius: [0, 6, 6, 0], color: C.warn },
          label: {
            show: true, position: 'right', color: C.textDim, fontSize: 11,
            formatter: function (p) { return FMT.format(total(p.dataIndex)); }
          },
          data: sorted.map(function (r) { return r.atrisk || 0; })
        }
      ]
    }));
  }

  function zohoTrend(rows, id) {
    id = id || 'chartZohoTrend';
    if (!rows || !rows.length) return showEmpty(id);
    render(id, base({
      tooltip: { trigger: 'axis' },
      legend: { top: 0, textStyle: { color: C.text, fontSize: 12 }, icon: 'circle', itemWidth: 9, itemHeight: 9 },
      // boundaryGap:false puts the last point ON the right edge, so its month
      // label ("2026-08") centres there and half of it fell outside the chart.
      // Wider right gutter than base's 16 so the final label renders whole.
      grid: { left: 8, right: 34, top: 32, bottom: 8, containLabel: true },
      xAxis: catAxis({ data: rows.map(function (r) { return r.month; }), boundaryGap: false }),
      yAxis: valAxis(),
      series: [
        {
          name: 'Created', type: 'line', smooth: true, symbolSize: 6,
          lineStyle: { width: 2.5, color: C.accent }, itemStyle: { color: C.accent },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(229,52,79,0.24)' },
              { offset: 1, color: 'rgba(229,52,79,0.02)' }
            ])
          },
          data: rows.map(function (r) { return r.created; })
        },
        {
          name: 'Closed', type: 'line', smooth: true, symbolSize: 6,
          lineStyle: { width: 2.5, color: C.ok }, itemStyle: { color: C.ok },
          data: rows.map(function (r) { return r.closed; })
        }
      ]
    }));
  }

  function zohoStatus(rows) {
    if (!rows || !rows.length) return showEmpty('chartZohoStatus');
    render('chartZohoStatus', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: rows.map(function (r) { return r.status; }),
        axisLabel: { color: C.textDim, fontSize: 10, interval: 0, rotate: 28, width: 110, overflow: 'truncate' } }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 30,
        itemStyle: { borderRadius: [6, 6, 0, 0], color: C.warn },
        data: rows.map(function (r) { return r.cnt; })
      }]
    }));
  }

  /* ── Map page charts (fed pre-aggregated {label,cnt} arrays) ──── */
  function verticalBar(id, rows, labelKey, valueKey, color, emptyMsg) {
    if (!rows || !rows.length) return showEmpty(id, emptyMsg);
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: rows.map(function (r) { return r[labelKey]; }),
        axisLabel: { color: C.textDim, fontSize: 10, interval: 0, rotate: 28, width: 90, overflow: 'truncate' } }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 40,
        itemStyle: {
          borderRadius: [6, 6, 0, 0],
          color: (typeof color === 'function') ? color
            : new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: color }, { offset: 1, color: 'rgba(46,155,214,0.3)' }])
        },
        data: rows.map(function (r) { return r[valueKey]; })
      }]
    }));
  }

  /**
   * Ranked horizontal bar for leaderboards. rows: [{label,cnt}] (already
   * ordered largest→smallest). opts: { color, pct, max, empty }.
   */
  function rankBar(id, rows, opts) {
    opts = opts || {};
    if (!rows || !rows.length) return showEmpty(id, opts.empty);
    var sorted = rows.slice().reverse(); // largest at top
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      // bottom:0 — nothing is drawn down there any more, so the axis gutter
      // would just be dead space the bars could be using.
      grid: { left: 8, right: 44, top: 12, bottom: 0, containLabel: true },
      // No value axis drawn. Every bar already carries its own value at the
      // right-hand end, so the ticks were duplicating it — and in a span-4
      // card (Top service types, the three Top Customers charts, five of the
      // TOM charts) they overlapped into an unreadable smear like
      // "1,0002,0003,000". opts.max still fixes the SCALE; it just isn't drawn.
      xAxis: valAxis(Object.assign({
        axisLabel: { show: false }, splitLine: { show: false }, axisLine: { show: false }
      }, opts.max ? { max: opts.max } : {})),
      yAxis: catAxis({ data: sorted.map(function (r) { return r.label; }),
        axisLabel: { color: C.text, fontSize: 11, width: 170, overflow: 'truncate' } }),
      series: [{
        type: 'bar', barMaxWidth: 16,
        itemStyle: { borderRadius: [0, 6, 6, 0], color: opts.color || C.primary },
        label: {
          show: true, position: 'right', color: C.textDim, fontSize: 11,
          formatter: function (p) { return opts.pct ? p.value + '%' : FMT.format(p.value); }
        },
        data: sorted.map(function (r) { return r.cnt; })
      }]
    }));
  }

  /**
   * Batch-cohort failure combo (M-A3 + M-A5): FTF rate % bars (coloured by
   * severity vs the fleet mean) + failures/device line on a second axis.
   */
  function cohort(rows) {
    if (!rows || !rows.length) return showEmpty('chartCohort');
    var mean = rows.reduce(function (a, r) { return a + (r.ftf_rate_pct || 0); }, 0) / rows.length;
    var byYear = {};
    rows.forEach(function (r) { byYear[r.batch_year] = r; });
    render('chartCohort', base({
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'shadow' },
        formatter: function (ps) {
          if (!ps || !ps.length) return '';
          var r = byYear[ps[0].axisValue] || {};
          var out = '<strong>' + ps[0].axisValue + ' batch</strong> · ' + FMT.format(r.devices || 0) + ' devices';
          ps.forEach(function (p) {
            var val = p.seriesName === 'FTF rate' ? (p.value == null ? '—' : p.value + '%')
              : (p.value == null ? '—' : p.value + ' /device');
            out += '<br>' + p.marker + ' ' + p.seriesName + ': <strong>' + val + '</strong>';
          });
          return out;
        }
      },
      legend: { top: 0, textStyle: { color: C.text, fontSize: 12 }, icon: 'circle', itemWidth: 9, itemHeight: 9 },
      grid: { left: 8, right: 8, top: 36, bottom: 8, containLabel: true },
      xAxis: catAxis({ data: rows.map(function (r) { return r.batch_year; }) }),
      yAxis: [
        valAxis({ name: 'FTF %', axisLabel: { color: C.textDim, fontSize: 11, formatter: '{value}%' } }),
        valAxis({ name: 'fails/device', splitLine: { show: false } })
      ],
      series: [
        {
          name: 'FTF rate', type: 'bar', barMaxWidth: 34,
          // value labels shown by default so the metric never depends on colour/hover alone
          label: { show: true, position: 'top', formatter: '{c}%', color: C.textDim, fontSize: 11, fontWeight: 600 },
          // Two tiers, not three. The old blue/warn/danger ramp graded every
          // bar by the same number its own height already showed, so colour
          // carried nothing new. Red is now reserved for the one thing height
          // can't tell you: that a cohort has crossed the fleet's watch
          // threshold, which is mean+5 and derived from the data rather than
          // fixed. The markLine below draws that threshold so the red has a
          // visible cause instead of an unexplained cutoff.
          markLine: {
            silent: true, symbol: 'none',
            lineStyle: { color: C.danger, type: 'dashed', width: 1.5, opacity: 0.7 },
            label: {
              formatter: 'watch threshold', position: 'insideEndTop',
              color: C.textDim, fontSize: 10
            },
            data: [{ yAxis: Math.round((mean + 5) * 10) / 10 }]
          },
          data: rows.map(function (r) {
            var v = r.ftf_rate_pct || 0;
            return {
              value: v,
              itemStyle: { borderRadius: [6, 6, 0, 0], color: v >= mean + 5 ? C.danger : C.primary }
            };
          })
        },
        {
          // Teal, not C.accent: C.accent is the brand red, which put this line
          // in the same hue as the flagged bars above — one colour standing for
          // two unrelated things in a single chart.
          name: 'Failures/device', type: 'line', yAxisIndex: 1, smooth: true, symbolSize: 7,
          lineStyle: { width: 2.5, color: C.teal }, itemStyle: { color: C.teal },
          data: rows.map(function (r) { return r.avg_failures; })
        }
      ]
    }));
  }

  /* ── Service page (ServiceWRK) ───────────────────────────────── */

  // SQL returns bands alphabetically; this is the order a human reads them in.
  var SVC_TAT_ORDER = ['Same day', '1-2d', '3-7d', '8-30d', '30d+'];

  function svcTatBands(rows) {
    if (!rows || !rows.length) return showEmpty('chartSvcTat');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.band] = r.cnt; });
    var cats = SVC_TAT_ORDER.filter(function (b) { return byBand[b]; });
    render('chartSvcTat', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        data: cats.map(function (b) {
          return {
            value: byBand[b],
            // The slowest band is the one that costs money — colour it as a
            // warning rather than leaving the reader to find it.
            itemStyle: {
              borderRadius: [6, 6, 0, 0],
              color: b === '30d+' ? C.danger : C.primary
            }
          };
        })
      }]
    }));
  }

  function svcResolution(rows) {
    if (!rows || !rows.length) return showEmpty('chartSvcResolution');
    // Explicit colors for the two real outcomes, grey for everything else.
    // NOT STATUS_PALETTE as a fallback: its index 2 IS C.warn, so an "Unknown"
    // slice landed on exactly the same amber as CENTER_VISIT and the two were
    // indistinguishable in the legend.
    var COLORS = { CENTER_VISIT: C.warn, OVERCALL_RESOLUTION: C.ok };
    render('chartSvcResolution', base({
      legend: { bottom: 0, icon: 'circle', textStyle: { color: C.text, fontSize: 12 },
        itemWidth: 9, itemHeight: 9 },
      series: [{
        type: 'pie', radius: ['55%', '78%'], center: ['50%', '44%'],
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        data: rows.map(function (r) {
          return {
            name: r.label, value: r.cnt,
            itemStyle: { color: COLORS[r.label] || C.muted }
          };
        })
      }]
    }));
  }

  /* ── Decomposition treemaps (Overview) ───────────────────────── */

  /**
   * The treemap's two tones, per theme. Colour is deliberately NOT a data
   * channel here: area already carries every value, so a per-node ramp would
   * only restate what a rectangle's size says. (The old tree needed one
   * because its fixed boxes had no size channel to spend.) Each theme gets
   * exactly two tones — BAND, behind a parent's name strip, and TILE, which
   * its children fill. BAND is always the higher-contrast tone against the
   * card: lighter than the tile on navy, darker on white. That's what keeps
   * "this strip labels the block below it" reading correctly in both themes
   * without inverting the palette. Every text pair clears WCAG AA for normal
   * text — dark 10.3 (band) / 4.7 (tile), light 9.5 / 4.7.
   *
   * The tone tracks a rectangle's ROLE, not its depth: band means "this is a
   * label strip", tile means "this is data". That distinction matters for the
   * level-1 nodes that have nothing drawn under them (the inert "Others"
   * bucket, a source folded by decompPrepLevel1_) — styling those by depth
   * made an 18% residual the heaviest block on the card while the 65% one sat
   * lighter, so they take the tile tone like every other data rectangle and
   * the band tone is left to mean one thing.
   *
   * Captions are single-tone. A faded second line was tried for the count
   * under each name and dropped: white at 82% over either tile tone measures
   * 3.7, and even 92% only reaches 4.2, so the hierarchy comes from weight
   * and size instead. A count is data; it doesn't get to be hard to read.
   */
  function decompPalette_() {
    return THEME === 'light'
      ? { band: '#124A67', bandText: '#FFFFFF', tile: '#2E7BA6', tileText: '#FFFFFF' }
      : { band: '#9BCBE4', bandText: '#04182C', tile: '#1F7AAE', tileText: '#FFFFFF' };
  }

  /** Minimal HTML escape for tooltip text built from raw BigQuery values
   *  (ServiceWRK's `closure_type` reaches the label unprettified). */
  function decompEsc_(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /**
   * A tile's two-line caption: name over count, anchored top-left. Top-left
   * rather than centred so the caption stays put as a tile changes shape
   * between filter states, and so it can't drift into the parent band above
   * it. ECharts drops the whole label when the tile is too small to hold it,
   * which is the intended fallback — the tooltip still carries the value.
   */
  function decompTileLabel_(color) {
    return {
      show: true, position: 'insideTopLeft', padding: [4, 6], overflow: 'truncate',
      formatter: function (p) { return '{n|' + p.name + '}\n{v|' + FMT.format(p.value) + '}'; },
      rich: {
        n: { fontSize: 12, fontWeight: 700, color: color, lineHeight: 15, align: 'left' },
        v: { fontSize: 11, fontWeight: 500, color: color, lineHeight: 14, align: 'left' }
      }
    };
  }

  /** `n` as a share of `total`, e.g. "12.4%" — "" when there's no total. */
  function decompShare_(n, total) {
    if (!total) return '';
    var pct = (n / total) * 100;
    return (pct >= 10 ? pct.toFixed(0) : pct.toFixed(1)) + '%';
  }

  // A level-1 block needs the 26px name band plus ~34px for one captioned
  // child before its breakdown is worth drawing — about 60px of height, which
  // in the 340px-tall canvas (see .chart-flow in Styles.html) means roughly a
  // 5% share once ECharts' squarify has picked a shape for it.
  var DECOMP_COLLAPSE_SHARE = 0.05;

  /**
   * Prepares the level-1 row: flattens any child too small to host a readable
   * breakdown into a single tile (recording on `__collapsed` how many children
   * were folded), and repaints every childless child in the tile tone, since
   * what it draws is a data rectangle rather than a label strip.
   *
   * Necessary because ECharts draws a non-leaf node's upperLabel band at its
   * configured height whether or not the node is that tall: a 1%-share source
   * (TOM, in the preview's mock) got a ~7px strip with a 26px band painted
   * over it, clipped mid-glyph by the canvas edge. `childrenVisibleMin` looks
   * like the fix and isn't — it stops the children rendering but the parent
   * still lays out and labels as a parent, so the band still overflows
   * (verified in the preview at 340/420/500px canvas heights). Removing the
   * children in the DATA does work: ECharts then treats the node as the leaf
   * it now is, and leaf labels are the kind it drops when they don't fit.
   *
   * Nothing is lost silently — the tooltip says what was folded, and every
   * one of these nodes is already clickable into the same breakdown (a
   * country/type click filters down to it; a ticket-source click opens that
   * source's own page).
   */
  function decompPrepLevel1_(children, total, P) {
    return children.map(function (child) {
      var kids = child.children || [];
      var folding = kids.length && total && child.value / total < DECOMP_COLLAPSE_SHARE;
      if (kids.length && !folding) return child;   // big enough to keep its band
      var flat = Object.assign({}, child);
      delete flat.children;
      if (folding) flat.__collapsed = kids.length;
      // Per-node, because the level's own colour still has a job to do: it
      // fills the gaps between a parent's children, which is what makes them
      // read as sitting inside their parent.
      flat.itemStyle = { color: P.tile };
      return flat;
    });
  }

  /**
   * Renders a two-level decomposition treemap: each of `treeNode`'s children
   * gets a rectangle sized by its share of the total, subdivided in turn by
   * that child's own children (country → segment, device type → age band,
   * ticket source → outcome).
   *
   * `treeNode` is the exact {name, value, children, stats?, filterDim?,
   * filterValue?, clearDims?, navTab?, navDeviceType?} shape
   * OverviewFlow.js's builders return — the metadata fields ride along on
   * ECharts' node data untouched, so handleTreeNodeClick_ still reads them
   * straight off `params.data`. The server payload needed no change.
   *
   * Replaces the `tree`-series renderer this file shipped through @76. That
   * series lays out by TOPOLOGY, not by value: every node drew at a fixed
   * 88×52 / 70×48 box whatever its count, so magnitude lived only in the
   * label text, and same-depth siblings split one span whether a branch held
   * 3% or 65% of its parent. Six passes tried to buy the labels room (size by
   * depth @69, hard-wrapped names @70, 8%→2% margins @72, TB→LR + depth
   * colour ramp @76, 34px→72px leaf slots in c977a00) and each moved the
   * collision instead of removing it, because the layout never consulted the
   * numbers. Rectangles that partition their parent by share cannot collide:
   * skew changes a rectangle's proportions, and the worst case is a tile too
   * small to caption — its tooltip still carries the value — rather than a
   * label overrunning its neighbour or a node clipped off the canvas edge.
   * Two further things fall out of the swap: the root box is gone (it used to
   * restate the total already printed in the card header), and the canvas
   * fills whatever width it is given instead of needing a minimum, so a
   * narrow viewport reshapes the tiles rather than cutting them off.
   */
  function decompTreemap(id, treeNode, opts) {
    opts = opts || {};
    if (!treeNode || !treeNode.children || !treeNode.children.length) return showEmpty(id);
    var P = decompPalette_();
    var total = treeNode.value || 0;

    render(id, base({
      tooltip: {
        trigger: 'item', confine: true,
        backgroundColor: C.tooltipBg, borderColor: C.axis,
        textStyle: { color: C.tooltipText, fontSize: 13 },
        formatter: function (info) {
          var d = info.data || {};
          var value = d.value != null ? d.value : info.value;
          // treePathInfo[0] is the series' own synthetic root (we pass the
          // children as `data`, so the payload root is never a node); the
          // rest is the real path, e.g. "India › SME".
          var path = (info.treePathInfo || []).slice(1).map(function (n) { return n.name; });
          var lines = ['<strong>' + decompEsc_(path.join(' › ') || d.name) + '</strong>: ' + FMT.format(value)];
          var share = decompShare_(value, total);
          if (share) lines.push(share + ' of ' + FMT.format(total));
          if (d.stats) {
            if (d.stats.devices != null) lines.push(FMT.format(d.stats.devices) + ' devices');
            if (d.stats.uptimePct != null) lines.push(d.stats.uptimePct + '% uptime');
            if (d.stats.openTickets != null) lines.push(FMT.format(d.stats.openTickets) + ' open tickets');
            if (d.stats.topCity) lines.push('Top city: ' + decompEsc_(d.stats.topCity));
          }
          if (d.__collapsed) {
            lines.push('Too small to break out here · click to see its ' + d.__collapsed + ' sub-categories');
          }
          return lines.join('<br/>');
        }
      },
      series: [{
        type: 'treemap', data: decompPrepLevel1_(treeNode.children, total, P),
        left: 0, top: 0, right: 0, bottom: 0,
        // Clicks belong to onNodeClick (filter / tab switch) — the default
        // 'zoomToNode' would swallow them and drill in instead.
        nodeClick: false, roam: false, breadcrumb: { show: false },
        // 0, not the default 10px²: a category small enough to fall under
        // that threshold would vanish from the page with nothing to say it
        // had been dropped. A one-pixel sliver is honest; a silent omission
        // from a total the card header still counts is not.
        visibleMin: 0,
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 0, gapWidth: 2 },
        levels: [
          {
            // levels[0] is the SYNTHETIC ROOT, not the first row of data:
            // passing an array as `data` makes ECharts wrap it in a root node
            // of its own, and every levels[] index shifts down by one to
            // match. Left unlabelled and uncoloured — the total is already in
            // the card header, and giving this level an upperLabel reserves a
            // 26px strip of empty band across the top of the whole chart.
            itemStyle: { color: 'transparent', gapWidth: 0, borderWidth: 0 },
            upperLabel: { show: false }, label: { show: false }
          },
          {
            // Level 1 (country / device type / ticket source). borderColor,
            // not just color, carries the band tone: ECharts paints a
            // parent's upperLabel strip out of its BORDER region, so a band
            // left on the chrome colour renders as a dark empty bar over
            // every block (seen in the preview before this line). color
            // matters too — it's what shows through the gaps between this
            // node's children, which is what makes them read as sitting
            // inside their parent rather than merely next to each other.
            itemStyle: { color: P.band, borderColor: P.band, borderWidth: 0, gapWidth: 3 },
            upperLabel: {
              show: true, height: 26, padding: [0, 8], align: 'left', overflow: 'truncate',
              color: P.bandText, fontSize: 12, fontWeight: 700,
              formatter: function (p) {
                var share = decompShare_(p.value, total);
                return p.name + '  ' + FMT.format(p.value) + (share ? '  ·  ' + share : '');
              }
            },
            // Reached only by a level-1 node with nothing under it, which
            // decompPrepLevel1_ has already repainted in the tile tone —
            // ECharts picks label vs upperLabel per node, so the two cases
            // are covered without branching on the data here.
            label: decompTileLabel_(P.tileText)
          },
          {
            // Level 2 (segment / age band / outcome). No band of its own —
            // these are leaves — so borderWidth stays 0 and the 1px gaps show
            // the parent's band tone through.
            itemStyle: { color: P.tile, borderColor: P.band, borderWidth: 0, gapWidth: 1 },
            label: decompTileLabel_(P.tileText)
          }
        ]
      }]
    }));

    if (opts.onNodeClick) {
      onClick(id, function (params) {
        if (params.data) {
          // Explicitly tear down the tooltip on THIS instance before the click
          // handler (which mutates global filters and re-renders via
          // renderOverviewFlow → Charts.decompTreemap → render()/apply_())
          // swaps the option out from under it — otherwise ECharts can still
          // be mid-flight showing/moving the old tooltip when apply_()
          // replaces the option, and throws trying to update a tooltip DOM
          // node that no longer matches (TypeError: Cannot set properties of
          // null (setting 'innerHTML'), confirmed reproducible via
          // hover-then-click in the local preview).
          if (instances[id]) instances[id].dispatchAction({ type: 'hideTip' });
          opts.onNodeClick(params.data);
        }
      });
    }
  }

  return {
    setLoading: setLoading,
    flushVisible: flushVisible,
    showEmpty: showEmpty,
    decompTreemap: decompTreemap,
    svcTatBands: svcTatBands,
    svcResolution: svcResolution,
    // Exported for the TOM monthly-volume chart; previously only used
    // internally by assetByType.
    verticalBar: verticalBar,
    cohort: cohort,
    applyTheme: applyTheme,
    rankBar: rankBar,
    fleetStatus: fleetStatus,
    jiraStatus: jiraStatus,
    geo: geo,
    firmware: firmware,
    cdmHardware: cdmHardware,
    cdmEcg: cdmEcg,
    deploymentAge: deploymentAge,
    deviceAges: deviceAges,
    activeVsEnded: activeVsEnded,
    assetStatus: assetStatus,
    assetTypes: assetTypes,
    zohoTrend: zohoTrend,
    zohoStatus: zohoStatus,
    zohoCategories: zohoCategories,
    zohoOpenAge: zohoOpenAge,
    slaRisk: slaRisk,
    zohoSegment: zohoSegment,
    FLEET_ORDER: FLEET_ORDER
  };
})();
</script>

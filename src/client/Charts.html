<script>
/* ═══════════════════════════════════════════════════════════════════
   Charts.html — every ECharts config in one place.
   Charts render lazily: options are staged per element id and applied
   only while the element is visible (hidden tab panels have zero size),
   then re-applied/resized when a tab becomes active.
   ═══════════════════════════════════════════════════════════════════ */
var Charts = (function () {
  'use strict';

  var REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FMT = new Intl.NumberFormat('en-IN');

  // Series colors are shared across themes (they read well on both). Only the
  // chart "chrome" (text, grid, axis, tooltip, slice borders) flips with theme.
  // Tricog data palette: blue-led data, red for emphasis, teal accent.
  var C = {
    primary: '#2E9BD6', info: '#38BDF8', accent: '#E5344F', ok: '#2FD39B',
    warn: '#F5B301', danger: '#FF6262', violet: '#A78BFA', orange: '#FB923C',
    teal: '#04E0B8', muted: '#64748B',
    // chrome — reassigned by applyTheme()
    text: '#A2B4C8', textDim: '#869AB2',
    grid: 'rgba(46,155,214,0.12)', axis: 'rgba(46,155,214,0.24)',
    tooltipBg: '#0A2340', tooltipText: '#EAF1F8', sliceBorder: '#04182C'
  };

  // Read by flowPalette_(), which needs to know the theme by name rather
  // than infer it from a chrome color it happens to share a value with.
  var THEME = 'dark';

  /** Repoints chart chrome colors for the given theme. */
  function applyTheme(theme) {
    var light = theme === 'light';
    THEME = light ? 'light' : 'dark';
    C.text = light ? '#3E546B' : '#A2B4C8';
    C.textDim = light ? '#566A80' : '#869AB2';
    C.grid = light ? 'rgba(1,41,78,0.08)' : 'rgba(46,155,214,0.12)';
    C.axis = light ? 'rgba(1,41,78,0.20)' : 'rgba(46,155,214,0.24)';
    C.tooltipBg = light ? '#FFFFFF' : '#0A2340';
    C.tooltipText = light ? '#01294E' : '#EAF1F8';
    C.sliceBorder = light ? '#FFFFFF' : '#04182C';
  }

  var instances = {};   // id → echarts instance
  var staged = {};      // id → option waiting to be applied
  var handlers = {};    // id → desired click handler (see onClick/bindClick_)

  function isVisible(el) {
    return !!(el && el.offsetWidth > 0 && el.offsetHeight > 0);
  }

  function base(extra) {
    return Object.assign({
      animation: !REDUCED_MOTION,
      animationDuration: 400,
      animationEasing: 'cubicOut',
      textStyle: { fontFamily: "'Fira Sans', sans-serif", color: C.text },
      tooltip: {
        trigger: 'item',
        backgroundColor: C.tooltipBg,
        borderColor: C.axis,
        textStyle: { color: C.tooltipText, fontSize: 13 },
        confine: true
      },
      grid: { left: 8, right: 16, top: 32, bottom: 8, containLabel: true }
    }, extra || {});
  }

  function catAxis(overrides) {
    return Object.assign({
      type: 'category',
      axisLine: { lineStyle: { color: C.axis } },
      axisTick: { show: false },
      axisLabel: { color: C.textDim, fontSize: 11, hideOverlap: true }
    }, overrides || {});
  }

  function valAxis(overrides) {
    return Object.assign({
      type: 'value',
      splitLine: { lineStyle: { color: C.grid } },
      axisLabel: { color: C.textDim, fontSize: 11 }
    }, overrides || {});
  }

  /** Stage an option; apply immediately when the element is visible. */
  function render(id, option) {
    staged[id] = option;
    var el = document.getElementById(id);
    if (el) {
      el.classList.remove('is-loading');
      if (isVisible(el)) apply_(id);
    }
  }

  function apply_(id) {
    var el = document.getElementById(id);
    if (!el || !staged[id]) return;
    if (!instances[id]) instances[id] = echarts.init(el);
    instances[id].setOption(staged[id], true);
    instances[id].resize();
    bindClick_(id);
  }

  /**
   * (Re)binds the click handler registered for `id` via onClick(), if any.
   * Called from apply_() every time it runs (not just on first init), so a
   * handler registered while the instance didn't exist yet (e.g. the first
   * render landed in a hidden tab panel) still gets attached the first time
   * apply_() actually creates the instance. off() first makes repeat calls
   * idempotent — re-renders never accumulate duplicate listeners, since the
   * one listener that stays bound always reads the CURRENT handlers[id].
   */
  function bindClick_(id) {
    if (!instances[id]) return;
    instances[id].off('click');
    if (handlers[id]) instances[id].on('click', handlers[id]);
  }

  /** Called on tab switch: materialise anything staged inside the panel. */
  function flushVisible() {
    Object.keys(staged).forEach(function (id) {
      var el = document.getElementById(id);
      if (isVisible(el)) apply_(id);
    });
  }

  function setLoading(ids) {
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('is-loading');
    });
  }

  function showEmpty(id, message) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('is-loading');
    if (instances[id]) { instances[id].dispose(); delete instances[id]; }
    delete staged[id];
    el.innerHTML = '<div class="chart-empty"><span>' + (message || 'No data available') + '</span></div>';
  }

  function onClick(id, handler) {
    handlers[id] = handler;
    bindClick_(id);
  }

  window.addEventListener('resize', function () {
    Object.keys(instances).forEach(function (id) {
      var el = document.getElementById(id);
      if (isVisible(el)) instances[id].resize();
    });
  });

  /* ── panel-specific builders ─────────────────────────────────── */

  var FLEET_ORDER = ['Live (<1h)', 'Online (<24h)', 'Idle (1-7d)', 'Offline (7-30d)', 'Dark (>30d)', 'Never seen'];
  var FLEET_COLORS = {
    'Live (<1h)': C.ok, 'Online (<24h)': C.primary, 'Idle (1-7d)': C.warn,
    'Offline (7-30d)': C.orange, 'Dark (>30d)': C.danger, 'Never seen': C.muted
  };

  function fleetStatus(rows, onSlice, id) {
    id = id || 'chartFleetStatus';
    if (!rows || !rows.length) return showEmpty(id);
    var byStatus = {};
    rows.forEach(function (r) { byStatus[r.status] = r.cnt; });
    var data = FLEET_ORDER.filter(function (s) { return byStatus[s]; })
      .map(function (s) {
        return { name: s, value: byStatus[s], itemStyle: { color: FLEET_COLORS[s] } };
      });
    render(id, base({
      legend: {
        bottom: 0, icon: 'circle',
        textStyle: { color: C.text, fontSize: 12 },
        itemWidth: 9, itemHeight: 9
      },
      series: [{
        type: 'pie', radius: ['58%', '80%'], center: ['50%', '44%'],
        avoidLabelOverlap: true,
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        emphasis: {
          label: {
            show: true, fontSize: 14, fontWeight: 700, color: C.tooltipText,
            formatter: function (p) { return p.name + '\n' + FMT.format(p.value); }
          },
          scaleSize: 4
        },
        data: data
      }]
    }));
    if (onSlice) onClick(id, function (p) { onSlice(p.name); });
  }

  // Jira lifecycle-status categories are open-ended (Deployed/Store/Hardware/
  // Decommissioned/Field/Exported/…), unlike the fixed 6-bucket FLEET_ORDER —
  // so colors cycle through this palette by rank instead of a name lookup.
  // ok and teal are both green/turquoise and read as the same color in a
  // legend at a glance — kept apart here so they don't land in the same
  // chart together (most lifecycle breakdowns only use the first 5-6).
  var STATUS_PALETTE = [C.primary, C.ok, C.warn, C.violet, C.info, C.orange, C.teal, C.danger, C.muted];

  function jiraStatus(rows, id) {
    id = id || 'execFleet';
    if (!rows || !rows.length) return showEmpty(id);
    var sorted = rows.slice().sort(function (a, b) { return (b.n || 0) - (a.n || 0); });
    var data = sorted.map(function (r, i) {
      return { name: r.k, value: r.n, itemStyle: { color: STATUS_PALETTE[i % STATUS_PALETTE.length] } };
    });
    render(id, base({
      legend: {
        bottom: 0, icon: 'circle',
        textStyle: { color: C.text, fontSize: 12 },
        itemWidth: 9, itemHeight: 9
      },
      series: [{
        type: 'pie', radius: ['58%', '80%'], center: ['50%', '44%'],
        avoidLabelOverlap: true,
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        emphasis: {
          label: {
            show: true, fontSize: 14, fontWeight: 700, color: C.tooltipText,
            formatter: function (p) { return p.name + '\n' + FMT.format(p.value); }
          },
          scaleSize: 4
        },
        data: data
      }]
    }));
  }


  function geo(rows, id) {
    id = id || 'chartGeo';
    if (!rows || !rows.length) return showEmpty(id);
    var sorted = rows.slice().reverse();
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: 8, right: 24, top: 12, bottom: 8, containLabel: true },
      xAxis: valAxis(),
      yAxis: catAxis({ data: sorted.map(function (r) { return r.state; }),
        axisLabel: { color: C.text, fontSize: 11, width: 110, overflow: 'truncate' } }),
      series: [{
        name: 'Centers',
        type: 'bar', barMaxWidth: 14,
        itemStyle: {
          borderRadius: [0, 6, 6, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: 'rgba(56,189,248,0.55)' },
            { offset: 1, color: C.info }
          ])
        },
        data: sorted.map(function (r) { return r.devices; })
      }]
    }));
  }

  function horizontalBar(id, rows, labelKey, valueKey, color) {
    if (!rows || !rows.length) return showEmpty(id);
    var sorted = rows.slice().reverse();
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      // right: 44 (was 28) to fit the value label these bars draw outside their
      // own end. containLabel only reserves room for AXIS labels, not series
      // labels, so the longest bar — which by definition reaches the axis max —
      // pushed its label past the chart edge and got clipped ("4,979" rendered
      // as "4,97"). 44 matches rankBar below, which already reserved enough.
      grid: { left: 8, right: 44, top: 12, bottom: 8, containLabel: true },
      xAxis: valAxis(),
      yAxis: catAxis({ data: sorted.map(function (r) { return r[labelKey]; }),
        axisLabel: { color: C.text, fontSize: 11, width: 170, overflow: 'truncate' } }),
      series: [{
        type: 'bar', barMaxWidth: 15,
        itemStyle: { borderRadius: [0, 6, 6, 0], color: color },
        label: {
          show: true, position: 'right', color: C.textDim, fontSize: 11,
          formatter: function (p) { return FMT.format(p.value); }
        },
        data: sorted.map(function (r) { return r[valueKey]; })
      }]
    }));
  }

  function assetStatus(rows) { horizontalBar('chartAssetStatus', rows, 'label', 'cnt', C.primary); }
  function assetTypes(rows)  { horizontalBar('chartAssetTypes', rows, 'label', 'cnt', C.violet); }
  function zohoCategories(rows) { horizontalBar('chartZohoCategories', rows, 'category', 'cnt', C.info); }
  function firmware(rows)    { horizontalBar('chartFirmware', rows, 'firmware', 'devices', C.info); }
  function cdmHardware(rows) { horizontalBar('chartCdmHardware', rows, 'hw', 'devices', C.violet); }

  // Fixed band order (0/1-5/6-20/21+), not by count — this is a natural
  // progression, not a ranked breakdown (mirrors deploymentAge's AGE_ORDER pattern).
  var ECG_ORDER = ['0', '1-5', '6-20', '21+'];
  function cdmEcg(rows) {
    if (!rows || !rows.length) return showEmpty('chartCdmEcg');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.k] = r.n; });
    var cats = ECG_ORDER.filter(function (b) { return byBand[b]; });
    render('chartCdmEcg', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        itemStyle: {
          borderRadius: [6, 6, 0, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: C.teal }, { offset: 1, color: 'rgba(4,224,184,0.3)' }])
        },
        data: cats.map(function (b) { return byBand[b]; })
      }]
    }));
  }
  function zohoSegment(rows) { horizontalBar('chartZohoSegment', rows, 'segment', 'cnt', C.primary); }

  // Matches the Asset-page Device age chart's bands exactly (see deviceAges below).
  var AGE_ORDER = ['<1y', '1-2y', '2-3y', '3-5y', '5y+'];

  function deploymentAge(rows) {
    if (!rows || !rows.length) return showEmpty('chartDeploymentAge');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.band] = r.devices; });
    var cats = AGE_ORDER.filter(function (b) { return byBand[b]; });
    render('chartDeploymentAge', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        itemStyle: {
          borderRadius: [6, 6, 0, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: C.primary },
            { offset: 1, color: 'rgba(46,155,214,0.45)' }
          ])
        },
        data: cats.map(function (b) { return byBand[b]; })
      }]
    }));
  }

  /** Device-age distribution (Jira fleet). rows = [{k,n}] in
   *  band order; the 5y+ band (past the 5-yr expected life) is coloured danger. */
  function deviceAges(rows) {
    if (!rows || !rows.length) return showEmpty('chartDeviceAges');
    var cats = rows.map(function (r) { return r.k; });
    render('chartDeviceAges', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
        valueFormatter: function (v) { return (+v).toLocaleString() + ' devices'; } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        label: { show: true, position: 'top', color: C.textDim, fontSize: 11,
          formatter: function (p) { return (+p.value).toLocaleString(); } },
        data: rows.map(function (r) {
          return { value: r.n, itemStyle: {
            borderRadius: [6, 6, 0, 0],
            color: r.k === '5y+' ? C.danger : new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: C.primary },
              { offset: 1, color: 'rgba(46,155,214,0.45)' }
            ])
          } };
        })
      }]
    }));
  }

  function activeVsEnded(rows) {
    if (!rows || !rows.length) return showEmpty('chartActiveEnded');
    // Card was repurposed to a hub_master_segment breakdown — color each known
    // segment deliberately; unknown values take the rotating palette.
    // Keys are the MERGED names (segmentGroupSql_, server-side — SME/LE
    // variants collapsed), not the old raw "Private - SME"/"LE - Cath Lab" etc.
    var SEGMENT_COLORS = {
      'sme': C.primary, 'government': C.info, 'le': C.violet,
      'echo': C.warn, 'project': C.muted
    };
    function segColor(name, i) {
      return SEGMENT_COLORS[String(name || '').trim().toLowerCase()] || STATUS_PALETTE[i % STATUS_PALETTE.length];
    }
    render('chartActiveEnded', base({
      legend: { bottom: 0, icon: 'circle', textStyle: { color: C.text, fontSize: 12 }, itemWidth: 9, itemHeight: 9 },
      series: [{
        type: 'pie', radius: ['55%', '78%'], center: ['50%', '44%'],
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        emphasis: {
          label: {
            show: true, fontSize: 14, fontWeight: 700, color: C.tooltipText,
            formatter: function (p) { return p.name + '\n' + FMT.format(p.value); }
          }
        },
        data: rows.map(function (r, i) {
          return { name: r.status, value: r.devices,
            itemStyle: { color: segColor(r.status, i) } };
        })
      }]
    }));
  }

  // SQL returns bands alphabetically; this is the order a human reads them
  // in. Same buckets as the Service page's TAT chart (SVC_TAT_ORDER) — one
  // consistent "how long has this been open" vocabulary across the app.
  var ZOHO_OPEN_AGE_ORDER = ['Same day', '1-2d', '3-7d', '8-30d', '30d+'];

  function zohoOpenAge(rows) {
    if (!rows || !rows.length) return showEmpty('chartZohoOpenAge');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.band] = r.cnt; });
    var cats = ZOHO_OPEN_AGE_ORDER.filter(function (b) { return byBand[b]; });
    render('chartZohoOpenAge', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        data: cats.map(function (b) {
          return {
            value: byBand[b],
            // The oldest band is the one that costs SLA — colour it as a
            // warning rather than leaving the reader to find it.
            itemStyle: {
              borderRadius: [6, 6, 0, 0],
              color: b === '30d+' ? C.danger : C.primary
            }
          };
        })
      }]
    }));
  }

  /**
   * SLA risk by issue type — stacked horizontal bar, breached (already past
   * target) alongside at-risk (past 75% of target but not yet breached).
   * Same two thresholds as the "Open breached" / "At-risk" figures on the SLA
   * compliance card, so each bar's total reconciles with those numbers.
   *
   * Rows are pre-sorted biggest-first by the server; reversed here for the
   * same reason rankBar does it — ECharts draws a category axis bottom-up, so
   * the largest lands at the top of the card.
   */
  function slaRisk(rows) {
    if (!rows || !rows.length) return showEmpty('chartSlaRisk', 'Nothing at SLA risk');
    var sorted = rows.slice().reverse();
    // Total sits on the outermost segment; ECharts anchors 'right' to the end
    // of the whole stack, so it reads as one number per issue type.
    function total(i) { return (sorted[i].breached || 0) + (sorted[i].atrisk || 0); }
    render('chartSlaRisk', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { top: 0, textStyle: { color: C.text, fontSize: 12 }, icon: 'circle', itemWidth: 9, itemHeight: 9 },
      grid: { left: 8, right: 48, top: 32, bottom: 0, containLabel: true },
      xAxis: valAxis({ axisLabel: { show: false }, splitLine: { show: false }, axisLine: { show: false } }),
      yAxis: catAxis({ data: sorted.map(function (r) { return r.category; }),
        axisLabel: { color: C.text, fontSize: 11, width: 150, overflow: 'truncate' } }),
      series: [
        {
          name: 'Breached', type: 'bar', stack: 'risk', barMaxWidth: 16,
          itemStyle: { color: C.danger },
          data: sorted.map(function (r) { return r.breached || 0; })
        },
        {
          name: 'At-risk', type: 'bar', stack: 'risk', barMaxWidth: 16,
          itemStyle: { borderRadius: [0, 6, 6, 0], color: C.warn },
          label: {
            show: true, position: 'right', color: C.textDim, fontSize: 11,
            formatter: function (p) { return FMT.format(total(p.dataIndex)); }
          },
          data: sorted.map(function (r) { return r.atrisk || 0; })
        }
      ]
    }));
  }

  function zohoTrend(rows, id) {
    id = id || 'chartZohoTrend';
    if (!rows || !rows.length) return showEmpty(id);
    render(id, base({
      tooltip: { trigger: 'axis' },
      legend: { top: 0, textStyle: { color: C.text, fontSize: 12 }, icon: 'circle', itemWidth: 9, itemHeight: 9 },
      // boundaryGap:false puts the last point ON the right edge, so its month
      // label ("2026-08") centres there and half of it fell outside the chart.
      // Wider right gutter than base's 16 so the final label renders whole.
      grid: { left: 8, right: 34, top: 32, bottom: 8, containLabel: true },
      xAxis: catAxis({ data: rows.map(function (r) { return r.month; }), boundaryGap: false }),
      yAxis: valAxis(),
      series: [
        {
          name: 'Created', type: 'line', smooth: true, symbolSize: 6,
          lineStyle: { width: 2.5, color: C.accent }, itemStyle: { color: C.accent },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(229,52,79,0.24)' },
              { offset: 1, color: 'rgba(229,52,79,0.02)' }
            ])
          },
          data: rows.map(function (r) { return r.created; })
        },
        {
          name: 'Closed', type: 'line', smooth: true, symbolSize: 6,
          lineStyle: { width: 2.5, color: C.ok }, itemStyle: { color: C.ok },
          data: rows.map(function (r) { return r.closed; })
        }
      ]
    }));
  }

  /**
   * Same-month resolution: for each month, tickets OPENED vs the subset of
   * those ALSO closed within that same month, plus the completion % that
   * subset implies (right axis). A same-cohort read — different from
   * zohoTrend above, whose created/closed lines mix cohorts across months.
   */
  function zohoMonthlyCompletion(rows) {
    if (!rows || !rows.length) return showEmpty('chartZohoMonthlyCompletion');
    var byMonth = {};
    rows.forEach(function (r) { byMonth[r.month] = r; });
    render('chartZohoMonthlyCompletion', base({
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'shadow' },
        formatter: function (ps) {
          if (!ps || !ps.length) return '';
          var r = byMonth[ps[0].axisValue] || {};
          return '<strong>' + ps[0].axisValue + '</strong>' +
            '<br>Opened: <strong>' + FMT.format(r.opened || 0) + '</strong>' +
            '<br>Closed same month: <strong>' + FMT.format(r.closed_same_month || 0) + '</strong>' +
            '<br>Completion: <strong>' + (r.completion_pct == null ? '—' : r.completion_pct + '%') + '</strong>';
        }
      },
      legend: { top: 0, textStyle: { color: C.text, fontSize: 12 }, icon: 'circle', itemWidth: 9, itemHeight: 9 },
      grid: { left: 8, right: 8, top: 36, bottom: 8, containLabel: true },
      xAxis: catAxis({ data: rows.map(function (r) { return r.month; }) }),
      yAxis: [
        valAxis({ name: 'tickets' }),
        valAxis({ name: 'completion %', min: 0, max: 100, splitLine: { show: false },
          axisLabel: { color: C.textDim, fontSize: 11, formatter: '{value}%' } })
      ],
      series: [
        {
          name: 'Opened', type: 'bar', barMaxWidth: 20,
          itemStyle: { borderRadius: [4, 4, 0, 0], color: C.primary },
          data: rows.map(function (r) { return r.opened; })
        },
        {
          name: 'Closed same month', type: 'bar', barMaxWidth: 20,
          itemStyle: { borderRadius: [4, 4, 0, 0], color: C.ok },
          data: rows.map(function (r) { return r.closed_same_month; })
        },
        {
          name: 'Completion %', type: 'line', yAxisIndex: 1, smooth: true, symbolSize: 6,
          lineStyle: { width: 2.5, color: C.teal }, itemStyle: { color: C.teal },
          data: rows.map(function (r) { return r.completion_pct; })
        }
      ]
    }));
  }

  function zohoStatus(rows) {
    if (!rows || !rows.length) return showEmpty('chartZohoStatus');
    render('chartZohoStatus', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: rows.map(function (r) { return r.status; }),
        axisLabel: { color: C.textDim, fontSize: 10, interval: 0, rotate: 28, width: 110, overflow: 'truncate' } }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 30,
        itemStyle: { borderRadius: [6, 6, 0, 0], color: C.warn },
        data: rows.map(function (r) { return r.cnt; })
      }]
    }));
  }

  /* ── Map page charts (fed pre-aggregated {label,cnt} arrays) ──── */
  function verticalBar(id, rows, labelKey, valueKey, color, emptyMsg) {
    if (!rows || !rows.length) return showEmpty(id, emptyMsg);
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: rows.map(function (r) { return r[labelKey]; }),
        axisLabel: { color: C.textDim, fontSize: 10, interval: 0, rotate: 28, width: 90, overflow: 'truncate' } }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 40,
        itemStyle: {
          borderRadius: [6, 6, 0, 0],
          color: (typeof color === 'function') ? color
            : new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: color }, { offset: 1, color: 'rgba(46,155,214,0.3)' }])
        },
        data: rows.map(function (r) { return r[valueKey]; })
      }]
    }));
  }

  /**
   * Ranked horizontal bar for leaderboards. rows: [{label,cnt}] (already
   * ordered largest→smallest). opts: { color, pct, max, empty }.
   */
  function rankBar(id, rows, opts) {
    opts = opts || {};
    if (!rows || !rows.length) return showEmpty(id, opts.empty);
    var sorted = rows.slice().reverse(); // largest at top
    render(id, base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      // bottom:0 — nothing is drawn down there any more, so the axis gutter
      // would just be dead space the bars could be using.
      grid: { left: 8, right: 44, top: 12, bottom: 0, containLabel: true },
      // No value axis drawn. Every bar already carries its own value at the
      // right-hand end, so the ticks were duplicating it — and in a span-4
      // card (Top service types, the three Top Customers charts, five of the
      // TOM charts) they overlapped into an unreadable smear like
      // "1,0002,0003,000". opts.max still fixes the SCALE; it just isn't drawn.
      xAxis: valAxis(Object.assign({
        axisLabel: { show: false }, splitLine: { show: false }, axisLine: { show: false }
      }, opts.max ? { max: opts.max } : {})),
      yAxis: catAxis({ data: sorted.map(function (r) { return r.label; }),
        axisLabel: { color: C.text, fontSize: 11, width: 170, overflow: 'truncate' } }),
      series: [{
        type: 'bar', barMaxWidth: 16,
        itemStyle: { borderRadius: [0, 6, 6, 0], color: opts.color || C.primary },
        label: {
          show: true, position: 'right', color: C.textDim, fontSize: 11,
          formatter: function (p) { return opts.pct ? p.value + '%' : FMT.format(p.value); }
        },
        data: sorted.map(function (r) { return r.cnt; })
      }]
    }));
  }

  /**
   * Batch-cohort failure combo (M-A3 + M-A5): FTF rate % bars (coloured by
   * severity vs the fleet mean) + failures/device line on a second axis.
   */
  function cohort(rows) {
    if (!rows || !rows.length) return showEmpty('chartCohort');
    var mean = rows.reduce(function (a, r) { return a + (r.ftf_rate_pct || 0); }, 0) / rows.length;
    var byYear = {};
    rows.forEach(function (r) { byYear[r.batch_year] = r; });
    render('chartCohort', base({
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'shadow' },
        formatter: function (ps) {
          if (!ps || !ps.length) return '';
          var r = byYear[ps[0].axisValue] || {};
          var out = '<strong>' + ps[0].axisValue + ' batch</strong> · ' + FMT.format(r.devices || 0) + ' devices';
          ps.forEach(function (p) {
            var val = p.seriesName === 'FTF rate' ? (p.value == null ? '—' : p.value + '%')
              : (p.value == null ? '—' : p.value + ' /device');
            out += '<br>' + p.marker + ' ' + p.seriesName + ': <strong>' + val + '</strong>';
          });
          return out;
        }
      },
      legend: { top: 0, textStyle: { color: C.text, fontSize: 12 }, icon: 'circle', itemWidth: 9, itemHeight: 9 },
      grid: { left: 8, right: 8, top: 36, bottom: 8, containLabel: true },
      xAxis: catAxis({ data: rows.map(function (r) { return r.batch_year; }) }),
      yAxis: [
        valAxis({ name: 'FTF %', axisLabel: { color: C.textDim, fontSize: 11, formatter: '{value}%' } }),
        valAxis({ name: 'fails/device', splitLine: { show: false } })
      ],
      series: [
        {
          name: 'FTF rate', type: 'bar', barMaxWidth: 34,
          // value labels shown by default so the metric never depends on colour/hover alone
          label: { show: true, position: 'top', formatter: '{c}%', color: C.textDim, fontSize: 11, fontWeight: 600 },
          // Two tiers, not three. The old blue/warn/danger ramp graded every
          // bar by the same number its own height already showed, so colour
          // carried nothing new. Red is now reserved for the one thing height
          // can't tell you: that a cohort has crossed the fleet's watch
          // threshold, which is mean+5 and derived from the data rather than
          // fixed. The markLine below draws that threshold so the red has a
          // visible cause instead of an unexplained cutoff.
          markLine: {
            silent: true, symbol: 'none',
            lineStyle: { color: C.danger, type: 'dashed', width: 1.5, opacity: 0.7 },
            label: {
              formatter: 'watch threshold', position: 'insideEndTop',
              color: C.textDim, fontSize: 10
            },
            data: [{ yAxis: Math.round((mean + 5) * 10) / 10 }]
          },
          data: rows.map(function (r) {
            var v = r.ftf_rate_pct || 0;
            return {
              value: v,
              itemStyle: { borderRadius: [6, 6, 0, 0], color: v >= mean + 5 ? C.danger : C.primary }
            };
          })
        },
        {
          // Teal, not C.accent: C.accent is the brand red, which put this line
          // in the same hue as the flagged bars above — one colour standing for
          // two unrelated things in a single chart.
          name: 'Failures/device', type: 'line', yAxisIndex: 1, smooth: true, symbolSize: 7,
          lineStyle: { width: 2.5, color: C.teal }, itemStyle: { color: C.teal },
          data: rows.map(function (r) { return r.avg_failures; })
        }
      ]
    }));
  }

  /* ── Service page (ServiceWRK) ───────────────────────────────── */

  // SQL returns bands alphabetically; this is the order a human reads them in.
  var SVC_TAT_ORDER = ['Same day', '1-2d', '3-7d', '8-30d', '30d+'];

  function svcTatBands(rows) {
    if (!rows || !rows.length) return showEmpty('chartSvcTat');
    var byBand = {};
    rows.forEach(function (r) { byBand[r.band] = r.cnt; });
    var cats = SVC_TAT_ORDER.filter(function (b) { return byBand[b]; });
    render('chartSvcTat', base({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      xAxis: catAxis({ data: cats }),
      yAxis: valAxis(),
      series: [{
        type: 'bar', barMaxWidth: 36,
        data: cats.map(function (b) {
          return {
            value: byBand[b],
            // The slowest band is the one that costs money — colour it as a
            // warning rather than leaving the reader to find it.
            itemStyle: {
              borderRadius: [6, 6, 0, 0],
              color: b === '30d+' ? C.danger : C.primary
            }
          };
        })
      }]
    }));
  }

  function svcResolution(rows) {
    if (!rows || !rows.length) return showEmpty('chartSvcResolution');
    // Explicit colors for the two real outcomes, grey for everything else.
    // NOT STATUS_PALETTE as a fallback: its index 2 IS C.warn, so an "Unknown"
    // slice landed on exactly the same amber as CENTER_VISIT and the two were
    // indistinguishable in the legend.
    var COLORS = { CENTER_VISIT: C.warn, OVERCALL_RESOLUTION: C.ok };
    render('chartSvcResolution', base({
      legend: { bottom: 0, icon: 'circle', textStyle: { color: C.text, fontSize: 12 },
        itemWidth: 9, itemHeight: 9 },
      series: [{
        type: 'pie', radius: ['55%', '78%'], center: ['50%', '44%'],
        itemStyle: { borderColor: C.sliceBorder, borderWidth: 2 },
        label: { show: false },
        data: rows.map(function (r) {
          return {
            name: r.label, value: r.cnt,
            itemStyle: { color: COLORS[r.label] || C.muted }
          };
        })
      }]
    }));
  }

  /* ── Overview decomposition FLOW ─────────────────────────────── */

  /**
   * ═════════════════════════════════════════════════════════════════════
   *  WHY THIS RENDERER EXISTS, AND WHAT IT SUPERSEDES.  Read before
   *  editing: this card has been redrawn six times and every failure was
   *  the same failure, alignment.
   * ═════════════════════════════════════════════════════════════════════
   *
   *  · `tree` series (through @76) — FAILED ON ALIGNMENT. The series lays
   *    out by TOPOLOGY, not by value: every node drew at a fixed 88×52 /
   *    70×48 box whatever its count, so magnitude lived only in the label
   *    text, and same-depth siblings split one span whether a branch held
   *    3% or 65%. Six passes tried to buy the labels room (size-by-depth
   *    @69, hard-wrapped names @70, 8%→2% margins @72, TB→LR + a depth
   *    colour ramp @76, 34px→72px leaf slots) and each MOVED the collision
   *    instead of removing it, because the layout never consulted the
   *    numbers.
   *  · `sankey` (5ad63f3) — fixed the collision, reverted in d2b4b1c purely
   *    on preference, back when the alternative was the tree.
   *  · `treemap` (@78-@88) — correct and collision-proof (rectangles that
   *    partition their parent by share cannot overlap) but a MOSAIC: no
   *    total flowing into parts, no connector anywhere on the card. That is
   *    what the user asked to replace.
   *
   *  ── What this is ────────────────────────────────────────────────────
   *  A hand-laid two-rank flow, running TOP TO BOTTOM (re-oriented from an
   *  original left-to-right design on 2026-08-25, per user, then refined
   *  the same day into distinct per-parent clusters — "subbranches" — per
   *  a follow-up correction): a band of level-1 blocks across the top, a
   *  band of level-2 blocks across the bottom, and one polygon ribbon per
   *  parent→child relationship crossing the gutter between them. One
   *  ECharts `custom` series with `coordinateSystem: 'none'`; every pixel
   *  comes from a PURE FUNCTION of (payload, canvas width, canvas height),
   *  evaluated inside renderItem off api.getWidth()/api.getHeight().
   *
   *  Blocks sit SIDE BY SIDE within a band, so the value-proportional
   *  dimension is now WIDTH, not height — text still reads left-to-right as
   *  ever (never rotated), which is what lets flowFitLabel_ carry over
   *  unchanged: it already took "available width" as a parameter, that
   *  parameter is just each block's own drawn width now, instead of one
   *  constant shared by a whole column.
   *
   *  A level-1 block's own children are laid out starting at THAT block's
   *  own left edge and never past its right edge (see (3) below) — so
   *  different parents' clusters can never overlap — and GAP_OUT (the same
   *  constant that spaces level-1 blocks apart) is what makes that boundary
   *  actually READ as separate branches rather than one continuous strip:
   *  14px between branches against 2px (GAP_IN) within one. See FLOW's own
   *  comment for the full argument.
   *
   *  ── THE ALIGNMENT ARGUMENT (five identities, not five tuning values) ─
   *  Let Wb be the plot width, n the number of drawn level-1 blocks, and
   *  BLOCK1_MIN the block floor.
   *
   *  (1) NOTHING infers a position from topology. There is no relaxation
   *      pass, no de-collision pass, no fixed node box, no per-branch slot.
   *      The only constant in the layout that is not derived from the data
   *      is each band's HEIGHT, and height carries no value here. This is
   *      the root cause of the tree era removed rather than mitigated.
   *
   *  (2) THE TOP BAND EXHAUSTS Wb EXACTLY.  free = Wb − (n−1)·GAP_OUT −
   *      n·BLOCK1_MIN, and block i gets w_i = BLOCK1_MIN + free·(v_i / total).
   *      Then Σw_i = n·BLOCK1_MIN + free = Wb − (n−1)·GAP_OUT identically —
   *      the gaps and the floors are subtracted from the budget BEFORE the
   *      values are scaled, so a large value can never eat a gap and the
   *      band can never overrun or leave dead air. The last block's width
   *      is assigned as the arithmetic remainder, so the identity survives
   *      floating point too.
   *
   *  (3) THE BOTTOM BAND IS THE SAME EXTENT, BRACKETED PER PARENT. Inside
   *      a parent's block [bx, bx+Bx] with k drawn children: avail = Bx −
   *      (k−1)·GAP_IN, free2 = avail − k·BLOCK2_MIN, w_c = BLOCK2_MIN +
   *      free2·(v_c / v_parent). Children lay out from the block's LEFT
   *      edge, so the parent's left edge IS its first child's left edge;
   *      and when the children sum to the parent (Σv_c === v_parent, tested
   *      exactly) the last child's right edge is snapped to the parent
   *      block's right edge, so the parent's whole extent is bracketed to
   *      the pixel. This is also what guarantees clusters never overlap:
   *      a parent's children never draw outside [bx, bx+Bx], so the next
   *      parent's own [bx', bx'+Bx'] — starting at bx' = bx+Bx+GAP_OUT — is
   *      always clear of them. Alignment is an identity of the arithmetic,
   *      not an outcome of a heuristic.
   *
   *  (4) NO LABEL CAN COLLIDE, because no block is ever narrower than its
   *      floor: widths are floor + a non-negative share of a non-negative
   *      remainder. Adjacent level-2 centres are ≥ BLOCK2_MIN+GAP_IN = 28px
   *      apart and level-1 centres ≥ BLOCK1_MIN+GAP_OUT = 46px apart,
   *      against single-line 11/12px text — comfortable clearance, worst
   *      case. And the block COUNT is capped by capacity computed from the
   *      same Wb the geometry paints with, so the bound and the paint
   *      cannot disagree. Vertically, each band is a fixed height chosen to
   *      hold one line of text (BAND1_H/BAND2_H), so nothing there can
   *      collide either. Nothing is clipped by `overflow: hidden` anywhere.
   *
   *  (5) IT IS CHECKED, NOT JUST ARGUED. There are no client-side unit
   *      tests in this repo (all 248 jest tests are server-side), so
   *      flowLayout_ asserts its own postconditions at runtime and
   *      console.warn()s the card id on any violation. The set covers both
   *      bands, deliberately: a level-1 or level-2 block under its floor, a
   *      non-finite coordinate at either level, a parent whose left edge
   *      differs from its first child's, a CHILD THAT OVERRUNS ITS BLOCK
   *      (the class an inconsistent payload actually produces — children
   *      summing above their parent), a broken exact bracket, and a top
   *      band whose extent is not [0, Wb].
   *
   *  ── WHAT THE WIDTH MEANS (the one honesty trade, stated plainly) ─────
   *  A block's width is BLOCK_MIN + (its exact share of the remaining free
   *  width). The floor is THE BLOCK — it carries no quantity; the width
   *  ABOVE the floor is the quantity, and that part is exactly
   *  proportional, one scale for the whole top band. This is what makes
   *  the card survive its own acid test: on the live Tickets payload
   *  (Zoho 84,545 / ServiceWRK 36,081 / TOM 1,325 — 64:1, and inside Zoho
   *  Open 211 vs Closed 84,334 — 400:1) a purely proportional width puts
   *  TOM at a few px and Open at well under a pixel. Here both get a
   *  legible, labelled block. The cost is that widths are compressed rather
   *  than ratio-true, which is why the COUNT, not the length, is the thing
   *  every block is guaranteed to carry: flowFitLabel_ gives the share up
   *  first, then the count's exact form ("18K" for 18,124), and only on a
   *  very narrow block does it give the count up to save the name. The
   *  tooltip prints the exact value and both denominators at every size.
   *  The aria-labels in Index.html say the same thing in words, because a
   *  canvas has no other channel to an assistive reader: wider is larger,
   *  widths are compressed, and they are comparable only within one band.
   *  A value of exactly 0 therefore gets exactly the floor and nothing
   *  more, and is painted in the TRACK tone (the "no quantity here" tone)
   *  with its 0 spelled out — chosen over dropping it, because a silent
   *  omission from a total the card header still counts is worse.
   *
   *  ── SCALE CAVEAT, deliberately not papered over ──────────────────────
   *  Level 1 is one scale for the whole band (free/total). Level 2 is
   *  normalised WITHIN ITS PARENT (share of parent), so free2/v_parent
   *  differs from parent to parent and level-2 blocks under different
   *  parents are NOT on a common scale. That is the decomposition reading
   *  and it is the deliberate choice: it makes within-parent composition
   *  comparable across parents (Zoho's 0.25% Open reads as 0.25% of Zoho
   *  rather than as an unresolvable sliver of the card), and every tooltip
   *  states both denominators so a length is never ambiguous.
   *
   *  ── THE COST VS THE TREEMAP, so it is not discovered later ───────────
   *  A treemap has 2-D slack; a 1-D flow does not. On a full-width open card
   *  the two bands together hold roughly a dozen level-1 blocks before the
   *  tail folds, so the flow can still name FEWER CATEGORIES ON CANVAS than
   *  the treemap did on the Devices card (12-14 device types × 5 age bands
   *  = up to 70 level-2 nodes, of which the treemap captioned most across
   *  the full card width). Nothing is omitted silently: a folded tail is
   *  drawn as its own block, sized by the tail's true sum, labelled with
   *  what it stands for, and its tooltip enumerates the members — and
   *  clicking a parent re-renders the card filtered, where those members
   *  become large. The lever, if more tail detail is ever wanted, is the
   *  card's WIDTH now (widening the browser, or the full-width grant on
   *  open in Styles.html) rather than its height — every capacity number
   *  here is derived from api.getWidth() at runtime, so nothing in this
   *  file mirrors a fixed capacity.
   *
   *  ── VERIFIED ECHARTS 5.5.0 FACTS THIS LEANS ON ──────────────────────
   *  · `coordinateSystem: 'none'` — getCoordSysInfoBySeries() has no
   *    fetcher for the name, so series.coordinateSystem stays null and
   *    makeRenderItem skips coord-sys prep. api.getWidth/getHeight are
   *    always present.
   *  · element types 'group' / 'rect' / 'polygon' / 'text' are all real
   *    (registerShape('polygon'), registerShape('rect'), createEl()).
   *    Rect honours shape.r; Polygon honours shape.points.
   *  · `emphasis: { style: … }` is the v5 spelling
   *    (retrieveStyleOptionOnState); `styleEmphasis` is the v4 fallback.
   *  · `style.font` (a CSS font shorthand) is honoured verbatim, which is
   *    what lets a measurement and a paint agree exactly.
   *  · `cursor` on a custom-series element option is IGNORED —
   *    applyMiscProps handles only silent/ignore/invisible/autoBatch, and
   *    zrender's Displayable defaults cursor to 'pointer'. So every mark
   *    shows a pointer whether or not it acts. That used to be reconciled by
   *    routing every mark's click to the nearest real node; since 2026-08-25
   *    the flow is READ-ONLY and nothing here acts on a click, so the pointer
   *    is corrected the only way reachable from outside zrender —
   *    `.chart-flow canvas { cursor: default }` in Styles.html. Marks stay
   *    hoverable on purpose: the tooltip is now the entire interaction.
   *  · zrender's getSize() subtracts computed padding, so with
   *    `.chart-flow { min-height: 480px; padding: 0 20px 20px }` and
   *    border-box, api.getHeight() is 460 and api.getWidth() is the card
   *    width minus 40. Nothing here mirrors those CSS numbers.
   */

  /**
   * The flow's text face. base() sets "'Fira Sans', sans-serif" — a face
   * this app never loads, so every other chart's text actually paints in the
   * browser's generic sans. Harmless for axis ticks; not harmless here,
   * because this renderer MEASURES text to decide how much of a name fits
   * inside a block, and a measurement is only trustworthy taken with the
   * exact string the canvas will paint with. So the flow names Lato — the
   * face Styles.html really @imports — and the measurer and every text
   * element read the same constants. Weights are ones Lato actually ships
   * (400/700), so the browser never synthesises one of them.
   */
  var FLOW_FONT = "'Lato', 'Segoe UI', system-ui, sans-serif";
  var FLOW_FONTS = {
    name1: '700 12px ' + FLOW_FONT, val1: '400 12px ' + FLOW_FONT,
    name2: '700 11px ' + FLOW_FONT, val2: '400 11px ' + FLOW_FONT,
    cap: '700 10px ' + FLOW_FONT
  };

  /**
   * Every number the layout needs. NOTE what is NOT here: the canvas
   * size. It is read from api.getWidth()/api.getHeight() on every render,
   * so the capacities below are re-derived if .chart-flow's height in
   * Styles.html ever changes, and re-derived on resize.
   *
   * The flow runs top-to-bottom (per user, 2026-08-25): a level-1 band
   * sits at the top of the card, a level-2 band at the bottom, ribbons
   * cross the gutter between them, and — unlike the old left/right
   * layout — the blocks WITHIN each band sit side by side, so a block's
   * value-proportional dimension is now its WIDTH, not its height. That
   * flips which constant governs what:
   *
   *   BAND1_H / BAND2_H are each band's FIXED height — just enough for
   *   one line of text (name + count on the same row, as before). They do
   *   NOT scale with the card like the old COL_FRAC width did, because
   *   text now reads along the value-proportional axis (width), not the
   *   fixed one — a taller band would only buy empty vertical padding.
   *
   *   BLOCK1_MIN / BLOCK2_MIN are the per-block WIDTH floors (the old
   *   ROW1_MIN/ROW2_MIN role, transposed) — the width every drawn block
   *   is guaranteed at least, whatever its value share.
   *
   * GAP_OUT is what makes the level-2 row read as separate SUBBRANCHES
   * rather than one continuous strip (per user, 2026-08-25): every level-1
   * block's own children start at that block's own left edge and never run
   * past its right edge (see flowLayout_'s "same extent again, bracketed
   * inside this block's width"), so consecutive parents' clusters are
   * already never overlapping — GAP_OUT is what makes that boundary
   * VISIBLE. It is spent in exactly one place, between level-1 blocks
   * (`x += w + GAP_OUT`), and because every level-2 cluster's x-range is
   * anchored to its own parent's, that same gap propagates straight down
   * to the row below: a wide gap between parents, unbroken by any gap
   * between a parent and ITS OWN children (there is none — a cluster's
   * ribbons start flush at the parent's edges). GAP_IN (2px) is the
   * unrelated, much smaller gap that only separates touching marks
   * WITHIN one cluster or one block (surface gap, never a border) — the
   * contrast between the two (14px between branches, 2px within one) is
   * what a reader's eye actually groups by.
   *
   * The two strokes this renderer does draw (EDGE, 1px) separate nothing:
   * one marks the no-quantity ROLE and one gives the ribbon wash a legible
   * edge, both argued in flowPalette_. END_GAP holds a ribbon 2px clear of
   * both blocks it joins, so the connector reads as its own mark rather
   * than a smear between two rectangles.
   *
   * NAME_MIN / NAME_TIGHT are the two widths a name is allowed to keep when
   * the count is set beside it: NAME_MIN (46px, ~7 characters) for the
   * comfortable tiers, NAME_TIGHT (24px, ~3 characters + ellipsis) for the
   * last tier before the count would have to be dropped. Both are floors on
   * the NAME, because the count is the channel the sub-3:1 fills owe the
   * reader (flowFitLabel_ spells the ladder out).
   */
  var FLOW = {
    INSET: 4, CAP_H: 15, GAP_OUT: 14, GAP_IN: 2,
    BAND1_H: 40, BAND2_H: 34, BLOCK1_MIN: 32, BLOCK2_MIN: 26,
    PAD_X: 10, SEP: 10,
    NAME_MIN: 46, NAME_TIGHT: 24,
    RADIUS: 4, END_GAP: 2, EDGE: 1,
    GUTTER_MIN: 56,
    CURVE_STEPS: 14, ARROW_MIN: 40, ARROW_W: 9, ARROW_H: 7
  };

  /**
   * Colour by ROLE, never by value — carrying forward the standing decision
   * the treemap's decompPalette_ comment made: length already carries every
   * magnitude, so a per-node ramp would only restate it, and the concrete
   * failure that argument recorded (an 18% residual painted heavier than a
   * 65% sibling) is exactly what a rank-keyed ramp reintroduces. Here every
   * level-1 block shares one fill whatever its size and every level-2 block
   * shares another, so a filter that drops a category can never repaint the
   * survivors.
   *
   * Four roles. The DATA roles (l1, l2) are one blue family, one step apart
   * by column. The NON-DATA roles are the ones a reader has to be able to
   * pick out of a column of data blocks, so they do not merely change hue —
   * they step OUT of the data tones' lightness neighbourhood entirely, to
   * the ink end of the theme in light mode and to the paper end in dark:
   *
   *   · agg   — a real quantity (the folded tail's true sum) that is not a
   *             single category: the highest-contrast neutral on the card.
   *   · track — no quantity at all (a zero row, or a "nothing to break out"
   *             placeholder): a near-surface fill that is deliberately
   *             almost invisible, plus a HAIRLINE OUTLINE. The outline is
   *             the form channel palette.md prescribes when a fill cannot
   *             carry a distinction: an empty slot is drawn as an outline
   *             because there is no quantity to ink in. It is not a
   *             separator (the 2px gaps do that) and it is drawn on nothing
   *             else.
   *
   * MEASURED, not eyeballed — every number below comes from the dataviz
   * skill's validate_palette.js run against the COMPOSITED card surfaces
   * (dark #0F2D4A, light #F8FAFC), OKLab ΔE×100, floors ≥15 normal / ≥8 CVD:
   *
   *   pair              light (norm/CVD)      dark (norm/CVD)
   *   l1  ↔ agg           19.2 / 18.2          30.8 / 27.7
   *   l1  ↔ track         41.6 / 38.6          26.1 / 25.4
   *   l2  ↔ agg           40.0 / 39.6          39.3 / 37.1
   *   l2  ↔ track         19.3 / 17.3          16.6 / 16.1
   *   agg ↔ track         58.4 / 58.0          54.9 / 54.0
   *
   * That is every pair that can ever be ADJACENT, and the previous tones
   * failed it badly (dark l1↔agg measured 6.4/5.4 — a full-colour reader
   * could not tell an aggregate from a device type sitting 4px above it).
   * The one pair NOT on that list is l1 ↔ l2 (light 22.3, dark 9.6): those
   * two tones never touch. They live in different columns, ≥48px of gutter
   * apart, and column membership is carried by x-position; the lightness
   * step only reinforces it. Making the dark pair clear 15 would mean
   * pushing l2 down onto the track tone, trading a real adjacency for a
   * decorative one.
   *
   * Text-on-fill, WCAG AA for normal text (≥4.5:1) everywhere:
   *   dark  l1 4.72 · l2 6.17 · agg 9.92 · track 6.43 · caption 4.87
   *   light l1 4.67 · l2 7.31 · agg 10.09 · track 6.99 · caption 5.33
   * Fills under 3:1 against the card remain (dark l1 2.98 / l2 2.00; light
   * l2 1.92, and both track tones at ~1.0 by design), which triggers the
   * palette's relief rule — and the relief is structural rather than
   * promised: a block is only ever drawn at a size that holds its label, so
   * every mark carries visible name text, and carries its COUNT too at
   * every canvas width down to ~200px (flowFitLabel_ degrades the number's
   * form before its existence). The tooltip is a full row readout on top of
   * that, never instead of it.
   *
   * The RIBBONS are pre-composited rather than drawn as an alpha wash: they
   * only ever occupy the empty gutter (never overlapping a block or each
   * other), so an opacity buys nothing and costs a measurable colour. The
   * wash alone composites to 1.32:1 (light) / 1.59:1 (dark) — lighter than
   * a hairline gridline for the one mark that carries the parent→child
   * mapping — so each ribbon also gets a 1px EDGE in the full ribbon hue,
   * which reads at 4.46:1 (light) / 4.53:1 (dark) against the card. Fill
   * for weight, edge for legibility, as marks-and-anatomy asks of any area
   * fill. A ribbon into an empty slot carries no quantity, so it takes the
   * track fill and the muted edge (3.60 / 3.90 — visible, recessive),
   * never the live data tone.
   *
   * There is no separate hover tone. A ring has to clear 3:1 against the
   * fill it strokes (WCAG 1.4.11) and no single accent could: the app's
   * light accent #0E9E86 measured 1.39:1 on l1 and 1.67:1 on l2. So the
   * hover ring wears the block's OWN ink — the same value that already
   * clears AA for that block's label, i.e. ≥4.67:1 on every role in both
   * themes, by construction rather than by luck.
   */
  function flowPalette_() {
    return THEME === 'light'
      ? { l1Fill: '#2E7BA6', l1Text: '#FFFFFF',
          l2Fill: '#8FBDD9', l2Text: '#01294E',
          aggFill: '#374350', aggText: '#FFFFFF',
          trackFill: '#EDF3F8', trackText: '#3E546B', trackEdge: '#6E869F',
          ribbon: '#CCDEE9', ribbonEdge: '#2E7BA6',
          ribbonMuted: '#EDF3F8', ribbonMutedEdge: '#6E869F',
          cap: '#566A80' }
      : { l1Fill: '#1F7AAE', l1Text: '#FFFFFF',
          l2Fill: '#1C5E85', l2Text: '#EAF1F8',
          aggFill: '#C3CEDA', aggText: '#0A2340',
          trackFill: '#123047', trackText: '#A2B4C8', trackEdge: '#6B8AA8',
          ribbon: '#184E74', ribbonEdge: '#2E9BD6',
          ribbonMuted: '#123047', ribbonMutedEdge: '#6B8AA8',
          cap: '#869AB2' };
  }

  /** Minimal HTML escape for tooltip text built from raw BigQuery values
   *  (ServiceWRK's `closure_type` reaches the label unprettified). Shared
   *  with nothing else now that the treemap is gone, but kept as its own
   *  helper because every tooltip line below needs it. */
  function decompEsc_(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /** `n` as a share of `total`, e.g. "12.4%" — "" when there's no total. */
  function decompShare_(n, total) {
    if (!total) return '';
    var pct = (n / total) * 100;
    return (pct >= 10 ? pct.toFixed(0) : pct.toFixed(1)) + '%';
  }

  /**
   * A short form of a count, for the narrow tiers of flowFitLabel_ only:
   * "18K" where "18,124" will not fit beside a readable name. Same rounding
   * as Intl's compact notation (84,545 → "85K", 1,234,567 → "1.2M"), which
   * is the auto-compact the dataviz skill's stat-tile contract asks for, and
   * deliberately the TERSEST form rather than a 3-significant-digit one:
   * at the app's 320px body min-width the canvas is ~280px and the inner
   * label width is 64px, where "18.1K" costs the count entirely and "18K"
   * keeps it. It is never the only place a number appears — the tooltip
   * always prints FMT.format() of the exact value — and it exists because
   * the alternative shipped here first (dropping the count) dropped it from
   * the LARGEST blocks first, which is exactly backwards.
   */
  function flowCompact_(n) {
    var v = n < 0 ? 0 : n;
    if (v >= 1e7) return (v / 1e6).toFixed(0) + 'M';
    if (v >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (v >= 1e4) return (v / 1e3).toFixed(0) + 'K';
    if (v >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(v);
  }

  /**
   * "1 segment" / "3 segments". The plurals are spelled out per card
   * (opts.levels) because "Country" does not pluralise by suffix, and the
   * SINGULAR is needed too: a device type with one age band, or Zoho when
   * every ticket is open, really does have exactly one child.
   */
  function flowUnit_(n, one, many) {
    return n === 1 ? one : many;
  }
  function flowPlural_(n, one, many) {
    return n + ' ' + flowUnit_(n, one, many);
  }


  /* ── text measurement ─────────────────────────────────────────────
     A real canvas 2D context measuring with the SAME font shorthand the
     chart paints with, so a truncation decision is exact rather than an
     em-advance guess or a trust-fall on zrender's overflow:'truncate'.
     Cached per (font, string): the same handful of names is measured on
     every render and on every resize. */
  var flowCtx_ = null;
  var flowTextCache_ = {};

  function flowTextW_(text, font) {
    var key = font + '|' + text;
    if (flowTextCache_[key] != null) return flowTextCache_[key];
    if (flowCtx_ === null) {
      try { flowCtx_ = document.createElement('canvas').getContext('2d') || false; }
      catch (e) { flowCtx_ = false; }
    }
    var w;
    if (flowCtx_) { flowCtx_.font = font; w = flowCtx_.measureText(String(text)).width; }
    else { w = String(text).length * 6.4; }   // last-ditch estimate, never expected
    flowTextCache_[key] = w;
    return w;
  }

  /** `text`, ellipsised to fit `maxW` — binary search on the measured
   *  width, so the result is the longest prefix that actually fits. */
  function flowTrunc_(text, maxW, font) {
    text = String(text == null ? '' : text);
    if (!(maxW > 0) || !text) return '';
    if (flowTextW_(text, font) <= maxW) return text;
    var lo = 0, hi = text.length, mid;
    while (lo < hi) {
      mid = Math.ceil((lo + hi) / 2);
      if (flowTextW_(text.slice(0, mid) + '…', font) <= maxW) lo = mid;
      else hi = mid - 1;
    }
    return lo > 0 ? text.slice(0, lo) + '…' : '';
  }

  /**
   * Lays out one block's two text runs: the name left-aligned, the count
   * right-aligned in its OWN reserved width. Reserved rather than
   * concatenated because a single "name · count · share" string truncates
   * the COUNT away first, and the count is precisely what the sub-3:1 fills
   * depend on being visible (see flowPalette_). ServiceWRK's closure_type
   * is raw, unbounded BigQuery text and lands on this card's level 2, so
   * this case is routine, not hypothetical.
   *
   * FIVE deterministic tiers, tried in order, each a measured fit rather
   * than a guess:
   *
   *   1  name + count + share      (name keeps ≥ NAME_MIN)
   *   2  name + count              (name keeps ≥ NAME_MIN)
   *   3  name + COMPACT count      (name keeps ≥ NAME_MIN)
   *   4  name + COMPACT count      (name keeps ≥ NAME_TIGHT)
   *   5  name alone, whole box
   *
   * Tiers 3 and 4 exist because the three-tier version shipped before them
   * had a per-string gate and so gave the count up on the WIDEST numbers
   * first: at a 620px browser window (the Overview card is already full
   * width there, per the max-width:820px rule in Styles.html) innerW is
   * ~89px, and "18,124" + separator + NAME_MIN did not fit while "412" did
   * — so the card printed a number on Nepal and none on India. A count
   * that vanishes from the biggest rows is worse than a rounded one, and
   * anti-patterns.md's "tooltip as the only way to read a value" is exactly
   * what it costs. So the value degrades in FORM ("18K") before it
   * degrades in existence, and the NAME gives up width before the count
   * does — down to NAME_TIGHT, past which a name would be pure ellipsis and
   * identity would be lost instead. Measured on the Customers payload, the
   * count now survives down to a ~200px canvas (every block keeps it at
   * 213px, the collapsed-column width) and tier 5 is reached below ~195px,
   * where colW itself falls under 74px — narrower than the app can get at
   * its 320px body min-width.
   */
  function flowFitLabel_(cell, name, valueTxt, compactTxt, shareTxt, w, nameFont, valFont) {
    var innerW = w - 2 * FLOW.PAD_X;
    var withShare = valueTxt + (shareTxt ? '  ·  ' + shareTxt : '');
    compactTxt = compactTxt || valueTxt;
    var tiers = valueTxt
      ? [[withShare, FLOW.NAME_MIN], [valueTxt, FLOW.NAME_MIN],
         [compactTxt, FLOW.NAME_MIN], [compactTxt, FLOW.NAME_TIGHT]]
      : [];
    var picked = false;
    tiers.forEach(function (t) {
      if (picked) return;
      var room = innerW - flowTextW_(t[0], valFont) - FLOW.SEP;
      if (room >= t[1]) {
        cell.valText = t[0];
        cell.nameW = room;
        picked = true;
      }
    });
    if (!picked) {
      cell.valText = '';
      cell.nameW = innerW;
    }
    // −2px of slack: if Lato has not finished loading, the measurer and the
    // painter agree on the fallback face but a late swap could widen the
    // string by a hair. Cheaper than a document.fonts round trip.
    cell.nameText = flowTrunc_(name, cell.nameW - 2, nameFont);
    cell.nameFont = nameFont;
    cell.valFont = valFont;
  }

  /* ── geometry primitives ─────────────────────────────────────── */

  /**
   * A ribbon: a constant-thickness band from (xA, y0) to (xB, y1) drawn on
   * the smoothstep s = t²(3−2t) — the same easing a sankey link uses, so it
   * reads as movement rather than as a wire or an indented bar. The flow
   * runs top-to-bottom, so the ribbon travels a FIXED Y span (y0 to y1, the
   * gutter between the two bands) while its X position eases from the
   * parent's side (xA) to the child's (xB), thickness w (the child's own
   * width).
   */
  function flowRibbonPoints_(y0, y1, xA, xB, w) {
    var n = FLOW.CURVE_STEPS, left = [], right = [], i, t, s, x, y;
    for (i = 0; i <= n; i++) {
      t = i / n;
      s = t * t * (3 - 2 * t);
      y = y0 + (y1 - y0) * t;
      x = xA + (xB - xA) * s;
      left.push([x, y]);
      right.push([x + w, y]);
    }
    right.reverse();
    return left.concat(right);
  }

  /** A downward-pointing triangle centred on (cx, cy). */
  function flowArrowPoints_(cx, cy, w, h) {
    return [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2], [cx, cy + h / 2]];
  }

  /* ── the model: pure, and entirely free of pixels ───────────────── */

  /**
   * Reshapes one payload root into the rows the layout will place. Pure and
   * pixel-free on purpose: every pixel decision belongs to flowLayout_,
   * which only runs inside renderItem where the real canvas size is
   * available.
   *
   * Zero-valued children are separated out rather than mixed in: a level-2
   * node with value 0 (Zoho's Closed when total === open, or any of TOM's
   * three counts) must not compete for height, and a level-1 node with
   * value 0 (ServiceWRK when its query returns no rows — note it arrives as
   * `{value: 0, children: []}`, a TRUTHY empty array, so a "has children"
   * guard misses it) must not be dropped either.
   *
   * `raw` is the payload node ITSELF, by reference — never a clone, a spread
   * or a merge. handleTreeNodeClick_ reads clearDims / resetSet / filterSet
   * / filterDim+filterValue / navTab+navDeviceType straight off it, and
   * level-2 names collide across branches ("SME" under both India and
   * Nepal), so the geometry travels alongside the node instead of on it.
   *
   * ORDER OF THE CHILDREN, and why this function is where it is decided.
   * Level 1 arrives sorted by count descending (OverviewFlow.js emits
   * countries and device types that way, and the three ticket sources in a
   * deliberate fixed order), so the layout can take its fold from the tail
   * and know the tail is the small end. Level 2 has NO such guarantee:
   * buildTicketsQuerySpecs issues `SELECT ... closure_type ... GROUP BY
   * label` with no ORDER BY, so ServiceWRK's ten outcomes arrive in
   * whatever order BigQuery returned them, and nestTicketsTree_ maps them
   * straight through. Folding that tail positionally named three outcomes
   * AT RANDOM — CENTER_VISIT (~58% of ServiceWRK) could land inside the
   * "+7 more" aggregate while PENDING_PARTS (~0.1%) got a block of its own.
   * So a non-ordinal breakdown is sorted here, by value descending, and the
   * layout's tail fold becomes a fold of the genuinely smallest children.
   * An ORDINAL breakdown (device age bands, AGE_ORDER in OverviewFlow.js)
   * keeps server order, because there the order IS the meaning and a fold
   * has to stay a contiguous range. The sort runs on `kids`, an array this
   * function built — never on the payload's own `children` array.
   */
  function flowModel_(root, levels) {
    if (!root || !root.children || !root.children.length) return null;
    var ordinal2 = !!(levels && levels.ordinal2);
    var rows = [];
    var total = 0;
    root.children.forEach(function (node) {
      var v = node && node.value > 0 ? node.value : 0;
      var all = (node && node.children) || [];
      var kids = [];
      var zeroKids = [];
      var kidSum = 0;
      all.forEach(function (k) {
        if (k && k.value > 0) { kids.push(k); kidSum += k.value; }
        else if (k) { zeroKids.push(k); }
      });
      if (!ordinal2) {
        kids.sort(function (a, b) { return (b.value || 0) - (a.value || 0); });
      }
      total += v;
      rows.push({
        raw: node, name: String(node && node.name != null ? node.name : ''),
        value: v, kids: kids, zeroKids: zeroKids, kidSum: kidSum,
        hadChildren: all.length > 0,
        // Only a real SHORTFALL counts: children that exist and account for
        // less than their parent (buildDevicesTree_ drops devices whose age
        // is null, so a type's bands can sum below the type). A node with no
        // breakdown at all is not a shortfall — its placeholder already says
        // there is nothing to break down.
        unallocated: kids.length && v - kidSum > 0 ? v - kidSum : 0
      });
    });
    if (!(total > 0)) return null;   // every child zero → the card is empty
    return { rows: rows, total: total, rootValue: root.value > 0 ? root.value : total, raw: root };
  }

  /**
   * The series' data array: one entry per mark that COULD be drawn, in
   * paint order (ribbons first, then blocks over them, then chrome). Its
   * only job is to give ECharts a dataIndex per mark — every scrap of
   * content comes from the layout, which is the only thing that knows the
   * canvas size. Built from the same `rows` objects the layout walks, and
   * each slot's index is written back onto the row it belongs to, so no
   * parallel array can ever drift out of step with the payload node it
   * hands to handleTreeNodeClick_.
   */
  function flowItems_(model) {
    var items = [];
    function slot(row, kind) {
      items.push({ value: row ? row.value : 0, kind: kind });
      return items.length - 1;
    }
    // The ORDER of this array is the paint order, and it is the only thing
    // that controls it: verified in echarts 5.5.0, updateZ$1() returns early
    // for a group (`if (el.isGroup) return`), so a `z2` set on a block group
    // is silently dropped while a `z2` on a bare ribbon path is honoured —
    // which would put every ribbon ON TOP of every block. So no element here
    // sets z2 at all, and zrender paints equal-z elements in creation order:
    // ribbons, then blocks over them, then the gutter chrome.
    model.rows.forEach(function (row) {
      row.ribbonIdx = [];
      var n = row.kids.length > 0 ? row.kids.length : 1;
      var rj;
      for (rj = 0; rj < n; rj++) row.ribbonIdx.push(slot(row, 'ribbon'));
    });
    model.rows.forEach(function (row) { row.blockIdx = slot(row, 'block'); });
    model.rows.forEach(function (row) {
      row.kidIdx = [];
      var n = row.kids.length > 0 ? row.kids.length : 1;
      var kj;
      for (kj = 0; kj < n; kj++) row.kidIdx.push(slot(row, 'block'));
    });
    model.rows.forEach(function (row) { row.arrowIdx = slot(row, 'arrow'); });
    model.capIdx = [slot(null, 'cap'), slot(null, 'cap'), slot(null, 'arrow')];
    return items;
  }

  /* ── the layout: the whole alignment argument, in one pure function ── */

  /**
   * flowLayout_(model, W, HC, levels, P) → { byIndex, warn }
   *
   * W / HC are api.getWidth() / api.getHeight(): the REAL canvas, measured
   * by ECharts, never the DOM and never a constant. This matters more than
   * it looks — render() stages options for elements that are not visible
   * yet (a collapsed card's chart div is inside its <details>, so it is
   * 0×0), and apply_() later replays that staged option verbatim. Anything
   * measured at option-build time would be frozen wrong forever.
   */
  function flowLayout_(model, W, HC, levels, P) {
    var F = FLOW;
    var out = { byIndex: {}, warn: [] };
    var i;

    /* ── the two bands. Each is a FIXED height (just one line of text —
       see FLOW's comment for why this no longer scales like the old
       column width did), stacked top and bottom with their own caption
       row immediately above them and the ribbon gutter between. */
    var y1 = F.INSET + F.CAP_H, y1b = y1 + F.BAND1_H;
    var y2cap = HC - F.INSET - F.BAND2_H - F.CAP_H, y2 = y2cap + F.CAP_H;
    if (!(y2 > y1b)) { out.bad = 'canvas too short (' + HC + 'px)'; return out; }
    var ry0 = y1b + F.END_GAP, ry1 = y2cap - F.END_GAP;
    if (!(ry1 - ry0 >= F.GUTTER_MIN * 0.5)) { out.bad = 'no room for connectors'; return out; }
    var gutterMid = (y1b + y2cap) / 2;

    /* ── horizontal budget. Blocks sit side by side within a band, so W
       (minus nothing — there is no per-band inset on this axis, unlike
       the vertical one which reserves room for each band's own caption)
       is exactly what the fold math below has to fit into. */
    var Wb = W;
    if (!(Wb >= F.BLOCK1_MIN)) { out.bad = 'canvas too narrow (' + W + 'px)'; return out; }

    /* ── level-1 capacity, then the fold. The fold is driven ONLY by the
       row count against the canvas — never by a "the residual must also
       clear the floor" loop, which is how a min-size rule ends up eating a
       sibling that was perfectly drawable on its own (an 88px ServiceWRK
       sacrificed to make a 3px TOM residual legal). Here every row that
       fits is drawn, and only the overflow is folded. The fold takes the
       TAIL in server order, so the aggregate is always over ADJACENT
       members: OverviewFlow.js emits countries and device types by count
       descending and the ticket sources in a deliberate fixed order, and
       nothing here re-sorts. */
    // WHAT pitch1 IS, stated as the property the code actually enforces.
    // It is a GLOBAL ROW-COUNT BUDGET — it feeds cap1 and nothing else. It
    // is NOT a per-row guarantee: a row's drawn width is
    // BLOCK1_MIN + free1·share, so on a skewed payload plenty of admitted
    // rows land well under pitch1 and fold their whole breakdown into one
    // slot (which the fold labels as "5 age bands", not as a range — see
    // the level-2 fold below). Budgeting at this pitch buys the same two
    // properties the old height-based version did, just along width now:
    // the mean block is at least wide enough to hold two level-2 children
    // side by side, and roughly half the band stays value-driven width
    // rather than floor.
    var pitch1 = 2 * F.BLOCK2_MIN + F.GAP_IN;
    if (pitch1 < F.BLOCK1_MIN) pitch1 = F.BLOCK1_MIN;
    var cap1 = Math.floor((Wb + F.GAP_OUT) / (pitch1 + F.GAP_OUT));
    if (cap1 < 1) cap1 = 1;
    var all = model.rows;
    var drawN = all.length < cap1 ? all.length : cap1;
    var slots = [];
    for (i = 0; i < drawN; i++) {
      if (i === drawN - 1 && drawN < all.length) {
        var members = all.slice(i);
        var sum = 0;
        members.forEach(function (m) { sum += m.value; });
        slots.push({
          row: all[i], agg: members, value: sum,
          name: members.length === all.length
            ? flowPlural_(members.length, levels.l1.toLowerCase(), levels.l1s)
            : '+' + members.length + ' more ' +
              flowUnit_(members.length, levels.l1.toLowerCase(), levels.l1s)
        });
      } else {
        slots.push({ row: all[i], agg: null, value: all[i].value, name: all[i].name });
      }
    }

    /* ── (2) the top band exhausts Wb exactly. */
    var n1 = slots.length;
    var avail1 = Wb - (n1 - 1) * F.GAP_OUT;
    var free1 = avail1 - n1 * F.BLOCK1_MIN;
    if (!(free1 > 0)) free1 = 0;
    var x = 0;
    var bandRight = Wb;

    slots.forEach(function (s, idx) {
      var share = model.total > 0 ? s.value / model.total : 1 / n1;
      var w = F.BLOCK1_MIN + free1 * share;
      // The last block takes the arithmetic remainder, so Σw + Σgaps === Wb
      // exactly regardless of floating point.
      if (idx === n1 - 1) w = bandRight - x;
      var row = s.row;
      var isAgg = !!s.agg;
      var isZero = !isAgg && s.value <= 0;
      var cell = {
        kind: 'block', role: isAgg ? 'agg1' : (isZero ? 'zero1' : 'l1'),
        x: x, y: y1, w: w, h: F.BAND1_H,
        fill: isAgg ? P.aggFill : (isZero ? P.trackFill : P.l1Fill),
        textFill: isAgg ? P.aggText : (isZero ? P.trackText : P.l1Text),
        // Only the no-quantity role is outlined, and only because its fill
        // is deliberately ~1:1 against the card: without the hairline there
        // would be no mark, just a floating label. See flowPalette_.
        stroke: isZero ? P.trackEdge : null,
        // Object identity: the payload node itself, by reference. A level-1
        // aggregate has no single node to stand for, so it gets none and
        // the click handler no-ops on it (see the cursor note above).
        raw: isAgg ? null : row.raw,
        value: s.value, share: decompShare_(s.value, model.rootValue),
        name: s.name, agg: s.agg, row: isAgg ? null : row, depth: 1
      };
      flowFitLabel_(cell, s.name, isZero ? '0' : FMT.format(s.value),
        isZero ? '0' : flowCompact_(s.value),
        (isAgg || isZero) ? '' : cell.share, w, FLOW_FONTS.name1, FLOW_FONTS.val1);
      out.byIndex[row.blockIdx] = cell;

      /* ── (3) the same extent again, bracketed inside this block's width. */
      var Bx = w;
      var cap2 = Math.floor((Bx + F.GAP_IN) / (F.BLOCK2_MIN + F.GAP_IN));
      if (cap2 < 1) cap2 = 1;    // guaranteed anyway by BLOCK1_MIN >= BLOCK2_MIN
      var kids = isAgg ? [] : row.kids;
      var kidSlots = [];
      var kj;
      if (kids.length) {
        var k = kids.length < cap2 ? kids.length : cap2;
        for (kj = 0; kj < k; kj++) {
          if (kj === k - 1 && k < kids.length) {
            var fm = kids.slice(kj);
            var fsum = 0;
            fm.forEach(function (m) { fsum += m.value > 0 ? m.value : 0; });
            // Three labels, and the WHOLE-FOLD case is tested FIRST because
            // it is not a fold of a tail — it is the entire breakdown in one
            // block, which happens on any block under BLOCK2_MIN·2+GAP_IN.
            // Labelling that "<1y → 5y+" was a bug: the full range is
            // typographically identical to a genuine partial fold
            // ("2-3y → 5y+") next to it, so blocks read as ranges instead of
            // as "all five bands, not broken out". "5 age bands" says what
            // it is. Below that, an ORDINAL breakdown (device age bands,
            // AGE_ORDER in OverviewFlow.js) folds from one end and is
            // labelled as the RANGE it covers — never "+2 more", which for an
            // ordered scale would stand for two non-adjacent bands and read
            // as a category that does not exist. A nominal breakdown folds
            // its smallest members (flowModel_ sorted them) and says so.
            kidSlots.push({
              raw: row.raw, agg: fm, value: fsum,
              name: fm.length === kids.length
                ? flowPlural_(kids.length, levels.l2.toLowerCase(), levels.l2s)
                : (levels.ordinal2
                    ? String(fm[0].name) + ' → ' + String(fm[fm.length - 1].name)
                    : '+' + fm.length + ' more')
            });
          } else {
            kidSlots.push({ raw: kids[kj], agg: null, value: kids[kj].value, name: String(kids[kj].name) });
          }
        }
      } else if (isAgg) {
        // The level-1 tail aggregate stands for several categories at once,
        // so there is nothing single to decompose. It still gets a
        // placeholder and a ribbon, because that is what keeps BOTH bands
        // spanning exactly the same extent — the identity the whole
        // alignment argument rests on.
        kidSlots.push({ raw: null, agg: null, value: 0, flat: true, flatKind: 'agg', name: 'aggregated' });
      } else {
        // Every row keeps the same structure, so the ribbon always has
        // somewhere to land and a level-1 leaf ("Others", an empty
        // ServiceWRK) stops being a special case in the geometry. Note the
        // three distinct reasons, which the tooltip tells apart: the row has
        // no records at all; it has children but every one of them is zero;
        // or the payload simply carries no breakdown for it.
        kidSlots.push(s.value <= 0
          ? { raw: row.raw, agg: null, value: 0, flat: true, flatKind: 'zero', name: 'No records' }
          : (row.hadChildren
              ? { raw: row.raw, agg: null, value: 0, flat: true, flatKind: 'allzero', name: 'no ' + levels.l2s + ' with records' }
              : { raw: row.raw, agg: null, value: 0, flat: true, flatKind: 'none', name: 'not broken out' }));
      }

      var k2 = kidSlots.length;
      var avail2 = Bx - (k2 - 1) * F.GAP_IN;
      var free2 = avail2 - k2 * F.BLOCK2_MIN;
      if (!(free2 > 0)) free2 = 0;
      // Scaled by the PARENT's value, never by the sum of its children:
      // buildDevicesTree_ drops devices whose age is null (ageBandForDays_
      // returns null and `if (band)` skips them), so a type's bands can sum
      // BELOW the type. That shortfall must show as unfilled block, not be
      // normalised away into a row that claims 100%.
      var pv = row.value;
      // Exact bracket when the children genuinely account for the parent —
      // tested as an exact sum, not a tolerance. A single full-block
      // placeholder brackets too, trivially.
      // The drawn slots always cover EVERY child — a fold moves them into
      // the tail aggregate rather than dropping them — so the slot values
      // always sum to row.kidSum, and the only question is whether the
      // children account for the parent.
      var exact = (k2 === 1 && kidSlots[0].flat) || (kids.length > 0 && row.kidSum === row.value);
      var cx = x;
      var px = x;                      // ribbons leave the parent contiguously
      var firstLeft = null;

      kidSlots.forEach(function (ks, kidx) {
        var w2;
        if (ks.flat) {
          w2 = Bx;                     // the placeholder spans the whole block
        } else {
          var sh = pv > 0 ? ks.value / pv : 1 / k2;
          w2 = F.BLOCK2_MIN + free2 * sh;
          if (kidx === k2 - 1 && exact) w2 = (x + Bx) - cx;
        }
        if (firstLeft === null) firstLeft = cx;
        var isKidAgg = !!ks.agg;
        var kc = {
          kind: 'block',
          role: ks.flat ? 'flat' : (isKidAgg ? 'agg2' : 'l2'),
          flatKind: ks.flatKind,
          x: cx, y: y2, w: w2, h: F.BAND2_H,
          fill: ks.flat ? P.trackFill : (isKidAgg ? P.aggFill : P.l2Fill),
          textFill: ks.flat ? P.trackText : (isKidAgg ? P.aggText : P.l2Text),
          stroke: ks.flat ? P.trackEdge : null,   // see the level-1 note
          // A folded level-2 block and a placeholder both click through to
          // their PARENT — the state in which those members become large
          // enough to draw, which turns a fold into a drill-down instead of
          // a dead end. Never a clone: `ks.raw` is a payload node.
          raw: ks.raw,
          value: ks.value, name: ks.name, agg: ks.agg,
          parentName: s.name, parentValue: pv, row: isAgg ? null : row, depth: 2,
          share: ks.flat ? '' : decompShare_(ks.value, pv),
